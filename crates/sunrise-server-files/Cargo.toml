[package]
name = "sunrise-server-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server's vanilla files: server.properties, eula.txt, ops, whitelist and bans, and account profile codecs"

[dependencies]
sunrise-core = { path = "../sunrise-core" }
# server.properties and eula.txt are Java-properties files..
sunrise-java-properties = { path = "../sunrise-java-properties" }
sunrise-protocol = { path = "../sunrise-protocol" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
getrandom = "0.3"
# Secure chat: the services' public keys arrive base64-encoded.
base64 = "0.22"

[lints]
workspace = true
