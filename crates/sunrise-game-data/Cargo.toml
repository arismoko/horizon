[package]
name = "sunrise-game-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable game data below commands and gameplay, shared by client and server: chat text and translations, SNBT and NBT paths, the scoreboard, boss bars, game rules and the registry and particle tables commands name"

[dependencies]
log = "0.4"
sunrise-assets = { path = "../sunrise-assets" }
sunrise-core = { path = "../sunrise-core" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
mod_vocab = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-world = { path = "../sunrise-world" }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[features]
# Mutable thread-local language publication for resource-backed game fixtures only.
test-language-publication = []
# Thread-local content mod effect registries for test fixtures only.
test-effect-registry = []

[lints]
workspace = true
