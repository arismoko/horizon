[package]
name = "sunrise-level"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable level, chunk, lighting, block-entity, biome and simulation-data foundations; no desktop or GPU stack"

[dependencies]
sunrise-assets = { path = "../sunrise-assets" }
sunrise-border = { path = "../sunrise-border" }
sunrise-game-data = { path = "../sunrise-game-data" }
sunrise-command = { path = "../sunrise-command" }
sunrise-core = { path = "../sunrise-core" }
sunrise-items = { path = "../sunrise-items" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-perf-format = { path = "../sunrise-perf-format" }
sunrise-protocol = { path = "../sunrise-protocol" }
sunrise-system = { path = "../sunrise-system" }
sunrise-threads = { path = "../sunrise-threads" }
sunrise-world = { path = "../sunrise-world" }
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["const_new"] }
unicode-bidi = "0.3.18"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[features]
test-support = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["testing"] }
sunrise-items = { path = "../sunrise-items", features = ["test-support"] }
sunrise-game-data = { path = "../sunrise-game-data", features = ["test-effect-registry"] }
sunrise-perf = { path = "../sunrise-perf" }
sunrise-threads = { path = "../sunrise-threads", features = ["sampling-test-support"] }
