[package]
name = "horizon-mod-point-shape"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The shape of an injection point, shared by #[point] and the mod API generator"

[lib]
name = "point_shape"

[dependencies]
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

[lints]
workspace = true
