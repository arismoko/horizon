[package]
name = "horizon-mod-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Unstable native-only raw rendering places for mods"

[lib]
name = "mod_render"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
horizon-client-render = { path = "../horizon-client-render", default-features = false }
horizon-mod-api = { path = "../horizon-mod-api" }
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }
glam = "0.30"
bytemuck = { version = "1.24", features = ["derive"] }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[lints]
workspace = true

[dependencies]
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
horizon-engine-slots = { path = "../horizon-engine-slots" }
