[package]
name = "horizon-mod-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Unstable native-only raw rendering places for mods"

[lib]
name = "mod_render"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-mod-points = { path = "../horizon-mod-points" }
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }
glam = "0.30"
bytemuck = { version = "1.24", features = ["derive"] }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[lints]
workspace = true
