[package]
name = "horizon-mod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The mod host above the engine: loading, Host implementations, registries and hook dispatch (#2534)"

[dependencies]
mod-render = { package = "horizon-mod-render", path = "../horizon-mod-render" }
horizon-engine-slots = { path = "../horizon-engine-slots" }
mod-points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-client = { path = "../horizon-client", default-features = false }

horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }
horizon-mod-wasm = { path = "../horizon-mod-wasm" }
mod-api = { package = "horizon-mod-api", path = "../horizon-mod-api" }

log = "0.4"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[features]
default = ["audio", "controllers", "horizon-extras"]
audio = ["horizon-client/audio"]
controllers = ["horizon-client/controllers"]
horizon-extras = ["horizon-client/horizon-extras"]
testing = ["horizon-client/testing"]
friends = ["horizon-client/friends"]
rng-trace = ["horizon-client/rng-trace"]
system-allocator = ["horizon-client/system-allocator"]
alloc-census = ["horizon-client/alloc-census"]
windows-mimalloc = ["horizon-client/windows-mimalloc"]
windows-segment-heap = ["horizon-client/windows-segment-heap"]

[dev-dependencies]
serde_json = "1"
