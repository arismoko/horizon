[package]
name = "sunrise-hot-paths-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The game as tools/hot_paths.py measures it: sunrise-game's entry, and on request one native mod that listens to the hooks the benchmark fires"

[dependencies]
sunrise-client = { path = "../sunrise-client", default-features = false, features = ["client"] }
sunrise-mod-api = { path = "../sunrise-mod-api" }
sunrise-mod-host = { path = "../sunrise-mod-host", default-features = false, features = ["client"] }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }

[lints]
workspace = true
