[package]
name = "cargo-horizon-mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cargo horizon-mod new/build/run/check: make Horizon content mods (docs/modding/src/how-to/content-mods.md)"

# `cargo binstall --git https://github.com/horizon-rust/horizon cargo-horizon-mod` (#2120) reads this: the archive
# `cargo-horizon-mod`'s workflow attaches to the `cargo-horizon-mod-v<version>` release for the runner's target,
# holding the binary at its root. tools/horizon_mod_binstall.py expands it for the workflow's targets.
[package.metadata.binstall]
pkg-url = "https://github.com/horizon-rust/horizon/releases/download/cargo-horizon-mod-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
horizon-addresses = { path = "../horizon-addresses" }
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
cap-std = "3.4.6"
# `canonicalize` that keeps plain Windows paths (no verbatim prefix), as `cargo metadata` prints them.
dunce = "1.0.5"
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index", "prebuilt"] }
horizon-mod-point-emit = { path = "../horizon-mod-point-emit" }
# The uses scan, the fit test, the surface search and its diff, over the fetched SDK's `surface.json`.
horizon-mod-surface = { path = "../horizon-mod-surface" }
horizon-release-sign = { path = "../horizon-release-sign" }
horizon-port-pack = { path = "../horizon-port-pack" }
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"
toml_edit = "0.25"
ureq = { version = "2", default-features = false, features = ["tls"] }
wasm-encoder = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
ring = "0.17"
tempfile = "3.27.0"
horizon-mod-wasm = { path = "../horizon-mod-wasm" }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
