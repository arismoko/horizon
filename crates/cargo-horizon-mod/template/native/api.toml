[package]
name = "mod-{id}"
version = "0.1.0"
edition = "2024"

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any other
# registry dependency must be pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { git = "https://github.com/arismoko/horizon"{rev} }
