[package]
name = "horizon-mod-answers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The code that answers a mod's host calls, written against the engine's subsystem traits. Depends on no game crate."

[lib]
name = "mod_answers"

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
horizon-engine-access = { path = "../horizon-engine-access" }
horizon-client-lib = { path = "../horizon-client-lib" }
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
mod_api = { package = "horizon-mod-vocab", path = "../horizon-mod-vocab" }

[lints]
workspace = true
