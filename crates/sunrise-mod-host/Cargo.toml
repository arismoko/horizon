[package]
name = "sunrise-mod-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The mod host above the engine: loading, Host implementations, registries and hook dispatch (#2534)"

[dependencies]
sunrise-core = { path = "../sunrise-core" }
mod-render = { package = "sunrise-mod-render", path = "../sunrise-mod-render", optional = true }
sunrise-client = { path = "../sunrise-client", default-features = false }
sunrise-hooks = { path = "../sunrise-hooks" }

sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["runtime-process"] }
mod-api = { package = "sunrise-mod-api", path = "../sunrise-mod-api" }

log = "0.4"
libloading = "0.8"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
object = { version = "0.39", default-features = false, features = ["read_core", "std"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
object = { version = "0.39", default-features = false, features = ["elf"] }

[target.'cfg(target_os = "macos")'.dependencies]
object = { version = "0.39", default-features = false, features = ["macho"] }

[target.'cfg(windows)'.dependencies]
object = { version = "0.39", default-features = false, features = ["pe"] }

[lints]
workspace = true

[features]
alloc-count = ["sunrise-client/alloc-count"]
default = ["client", "audio", "controllers", "sunrise-extras"]
client = ["sunrise-client/client", "dep:mod-render"]
audio = ["client", "sunrise-client/audio"]
controllers = ["client", "sunrise-client/controllers"]
sunrise-extras = ["client", "sunrise-client/sunrise-extras"]
testing = ["sunrise-client/testing"]
friends = ["sunrise-client/friends"]
rng-trace = ["sunrise-core/rng-trace", "sunrise-client/rng-trace"]
system-allocator = ["sunrise-client/system-allocator"]
alloc-census = ["sunrise-client/alloc-census"]
windows-segment-heap = ["sunrise-client/windows-segment-heap"]

[dev-dependencies]
serde_json = "1"

[[example]]
name = "wind_burst_hook_probe"
required-features = ["client"]

[[example]]
name = "native_waypoints"
required-features = ["client"]

[[example]]
name = "native_gui_overlay_probe"
required-features = ["client"]
