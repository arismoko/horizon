[package]
name = "horizon-mod-wasm-wire-loopback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Loopback tests of the generated wire proxies and service, without wasm; one module per tests/wire_loopback/ file"

[build-dependencies]
horizon-game-discovery = { path = "../../horizon-game-discovery" }
horizon-mod-api-gen = { path = "../../horizon-mod-api-gen" }

[dev-dependencies]
horizon-core = { path = "../../horizon-core" }
horizon-mod-runtime = { path = "../../horizon-mod-runtime" }
horizon-world = { path = "../../horizon-world" }
mod_api = { package = "horizon-mod-api", path = "../../horizon-mod-api", features = ["wasm-guest", "testing"] }
log = "0.4"
serde_json = "1"

[lints]
workspace = true
