[package]
name = "horizon-mod-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The runtime for wasm mods: groups packages by their dependencies and refuses what cannot load"

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-core = { path = "../horizon-core" }
horizon-mod-runtime = { path = "../horizon-mod-runtime" }
mod_points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
horizon-mod-point-emit = { path = "../horizon-mod-point-emit" }
log = "0.4"
sha2 = "0.10"
serde_json = "1"
wasmparser = "0.261"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation", "pulley"] }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
horizon-world = { path = "../horizon-world" }
horizon-threads = { path = "../horizon-threads" }
tempfile = "3.27.0"
libc = "0.2"
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
mod_points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
horizon-client-core = { path = "../horizon-client-core" }
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api", features = ["wasm-guest", "testing"] }
wat = "1.261"

[lints]
workspace = true

# Synthetic points are opt-in for the listener matrix only. Dev-dependencies
# would unify them into every integration test's game layout.
[features]
# Test instrumentation only; does not alter Wire layout.
test-copy-probe = []
runtime-fixture = []
listener-fixture = ["mod_points/listener-fixture", "horizon-mod-api-gen/listener-fixture"]

[[test]]
name = "real_member"
required-features = ["listener-fixture"]

[[test]]
name = "native_listener"
required-features = ["listener-fixture"]

[[test]]
name = "no_wire_registration"
required-features = ["listener-fixture"]

[[test]]
name = "bench"
required-features = ["listener-fixture"]

[[test]]
name = "main_stack_probe"
harness = false
required-features = ["runtime-fixture"]
