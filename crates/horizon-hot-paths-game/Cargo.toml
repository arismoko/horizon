[package]
name = "horizon-hot-paths-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The game as tools/hot_paths.py measures it: horizon-game's entry, and on request one native mod that listens to the hooks the benchmark fires"

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-mod-api = { path = "../horizon-mod-api" }
horizon-mod-host = { path = "../horizon-mod-host", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }

[lints]
workspace = true
