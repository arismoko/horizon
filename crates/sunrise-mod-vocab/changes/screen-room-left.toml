ids = ["hook:screen_room", "hook:screen_room.left"]
why = "screen_room version 2 takes room on both sides of the open container's window: ScreenRoomEvent gains `left` beside `right`, and the window and the recipe book move right by half the left room less half the right room when all of it fits and a mod menu's recipe book toggle stays on the screen. A left room is measured from the open recipe book's selected tab. With listeners on both sides the result is mixed: another mod's left answer can shrink, reverse or cancel the move a right-only answer got in version 1, so later ScreenView rectangles can differ for that right-only mod. The fit check now also includes a mod menu's resolved recipe book toggle, so a right-only reservation that would push a left-gutter toggle off the screen is refused too (#6198: a 301-wide screen, a 138-wide menu and 154 on the right used to move the toggle to -20..0); stock menus and screens with no listener lay out as before."
migrate = "Rebuild against this SDK. A mod that only reserves the right keeps writing `event.right`, and must read the shifted window from later ScreenView rectangles rather than assume it moved left by half its room. A mod with a panel left of the window writes `event.left = event.left.max(width)`. Code constructing ScreenRoomEvent passes the new `left` too."
