version = 1
handle = "handle:LevelRef::set_world_border_size"
doc = "LevelRef::set_world_border_size sets a fixed size for ticks <= 0 and starts a timed lerp otherwise on the named level, with no command size range: a signed size is accepted while the clipped box stays ordered. Successful writes notify that level's watchers even when the size repeats."
tests = [
