version = 1
doc = "PlayerRef::give_stack throws overflow from the receiving player's eyes in their own level, even when called from another level. The drop has no pickup delay and only that player may pick it up. An open transaction defers the drop until the outermost commit. If their level is unavailable, the overflow is returned instead."
