version = 1
doc = "Direct player experience writes match vanilla's setters without Mending. PlayerRef::give_experience_points adds or removes signed points and updates the player's independent score by the hook-adjusted amount without running Mending (xp_repair_ratio runs only at orb pickup); PlayerRef::give_levels adds or removes levels without changing score; both route any level-up sound to the target player's own level rather than the caller's. PlayerRef::set_experience_points writes only the bar progress with vanilla's clamp. PlayerRef::set_total_experience stores any signed total without refusing negative values and without changing the bar, level, or score."
