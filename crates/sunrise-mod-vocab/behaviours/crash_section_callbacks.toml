version = 1
doc = "Crash header and section callbacks run sequentially in registration order and appear in the crash report with the full text of the mod that registered them; a callback that panics disables only itself and the report still lists the others."
tests = [
    "crates/sunrise-level/src/crash.rs::crash_callbacks_run_in_registration_order",
