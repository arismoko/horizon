version = 2
doc = "A generated callback panic discards its staged output, disables only that mod's callback for that hook for the session, and produces a named error log and client diagnostic toast. Other eligible listeners continue from the last accepted output. For collision_shape, a panic discards only that invocation's answer without disabling the Part; later Parts continue from the last accepted shape. Journaled writes are undone in the existing transaction; published effects outside a journal are not undone. An ordinary phase or output refusal is reported each time without disabling the listener. Failed registrations do not publish; a failed chunk-disk job cannot publish even when later listeners succeed."
