version = 1
doc = "A general entity row keeps a custom name and its visibility, as `Entity.getCustomName` and `Entity.isCustomNameVisible` do: saved as `CustomName` and `CustomNameVisible`, synced to tracking clients as `Entity.DATA_CUSTOM_NAME` and `DATA_CUSTOM_NAME_VISIBLE`, read and written through `EntityRef::name`, `custom_name`, `set_custom_name`, `custom_name_visible` and `set_custom_name_visible` (the visibility reads on a client too), and used by `@e[name=...]` and command output."
