[package]
name = "sunrise-client-lib"
autobins = false
autoexamples = false
autotests = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable client systems, control tool and parity probes"

[lib]
path = "../sunrise-client/src/client_lib.rs"

[dependencies]
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
sunrise-hooks = { path = "../sunrise-hooks" }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-assets = { path = "../sunrise-assets" }
sunrise-game-data = { path = "../sunrise-game-data" }
sunrise-client-input = { path = "../sunrise-client-input" }
sunrise-client-render = { path = "../sunrise-client-render" }
sunrise-command = { path = "../sunrise-command" }
sunrise-items = { path = "../sunrise-items" }
sunrise-core = { path = "../sunrise-core" }
# `sunrise-ctl mcp`: the Model Context Protocol, shared with the launcher and the server.
sunrise-mcp = { path = "../sunrise-mcp" }
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
sunrise-optifine = { path = "../sunrise-optifine" }
sunrise-threads = { path = "../sunrise-threads" }
# The .hzperf capture format and writer (docs/perf-platform.md).
sunrise-perf-format = { path = "../sunrise-perf-format" }
# One pool of helper threads for the server tick's parallel phases (`parallel.rs`): threads made
# once, not for every phase of every tick.
rayon = "1.10"
sunrise-world = { path = "../sunrise-world" }
sunrise-sim = { path = "../sunrise-sim" }
sunrise-level = { path = "../sunrise-level" }
sunrise-protocol = { path = "../sunrise-protocol" }
# server.properties, eula.txt and the user lists, shared with sunrise-server.
sunrise-server-files = { path = "../sunrise-server-files" }
# The JDK's clock, for the LAN host's random seed (lan/mod.rs).
sunrise-java-properties = { path = "../sunrise-java-properties" }
# The control endpoint's token (control.rs), as sunrise-server's and the relay's.
getrandom = "0.3"
# Shader packs: reading them and turning their GLSL into naga modules.
sunrise-shaders = { path = "../sunrise-shaders" }
# The narrator (GameNarrator): text-to-speech of chat, system messages and screens.
sunrise-narrator = { path = "../sunrise-narrator" }
# Sunrise mods: native code and content packages (docs/modding/src/how-to/content-mods.md).
# Their runtime is the `mods` feature.
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["index-read"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
# Server resource packs are checked and cached by their SHA-1, as vanilla does.
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# The network threads of a server's players: epoll, kqueue or Windows' AFD (lan/io_pool.rs).
mio = { version = "1.2.4", features = ["os-poll", "net"] }
# Shared chunk frames are found by one keyed 128-bit hash of their body (lan/conn.rs SharedFrames).
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md).
sunrise-telemetry = { path = "../sunrise-telemetry", default-features = false }
sunrise-bench = { path = "../sunrise-bench" }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# HTTPS to the Minecraft services (online-mode session join).
ureq = { version = "2", default-features = false, features = ["tls"] }
# `LevelStorageAccess.estimateDiskSpace`: usable disk space, without unsafe code on Windows.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Contain recursive native item renderers before a stack overflow can abort the process.
stacker = "0.1.25"

[target.'cfg(unix)'.dependencies]
# The server thread's CPU time per tick (`SUNRISE_SPIKES`, spans.rs).
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# Use the registered URI handler without routing links through Explorer/cmd.
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
# Resolve virtualized folders to shell-compatible physical paths (desktop.rs).
dunce = "1.0.5"
# DirectX 12, where Vulkan has no adapter or device, or by choice (`graphicsApi`, graphics.rs).
# Shaders compile with FXC (d3dcompiler_47.dll, part of Windows), or on integrated GPUs with DXC
# (dxcompiler.dll beside the game, gfx/dx12_compiler.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# OpenGL (WGL on Windows, EGL on Linux), the last fallback, for GPUs with no Vulkan or
# DirectX 12 driver (`graphicsApi`, graphics.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Thread-local menu callbacks for resource-backed game fixtures only.
test-menu-validity = ["sunrise-sim/test-menu-validity"]
# Scoped observations for compiled-guest executor tests only.
test-payload-probe = ["sunrise-sim/test-payload-probe"]
# Isolated server-publication slots for resource-backed game fixtures only.
test-publication-scope = ["sunrise-sim/test-publication-scope"]
# Thread-local tooltip component factories for isolated game unit tests only.
test-tooltip-factories = []
# Non-consuming residency journal observation for game fixtures only.
test-residency-observer = ["sunrise-sim/test-residency-observer"]
# Local server-pack feedback observation for game fixtures only.
test-pack-feedback = []
# A level side with no weather, tags or block entities, for tests and probes that never read them.
test-dry-side = ["sunrise-sim/test-dry-side"]
# `FixedStep::still_for_tests`: a clock with SUNRISE_STILL on, for game fixtures only.
test-still-clock = ["sunrise-sim/test-still-clock"]
# Shared immutable resource cloning helpers for sunrise-client test fixtures only.
test-resource-cache = []
default = ["audio", "controllers"]
# Dev-only: the ignored tracker-send benchmark uses the executable's allocator.
tracker-send-bench = []
# Sound output. Without it (and `controllers`) the program links neither libasound nor libudev on
# Linux: the server build (`--no-default-features`, released as sunrise-engine; docs/server.md).
audio = ["sunrise-client-render/audio"]
# Controllers: the input layer's side of them (gilrs and the DualSense's output live in sunrise-client-gameplay's
# `controllers`). Without it only `sunrise-ctl pad`'s virtual pad.
controllers = ["sunrise-client-input/controllers"]
# The sensor_scan_tests mob-kind fixture for the gameplay crates' tests.
test-mob-kind = ["sunrise-sim/test-mob-kind"]
test-support = ["sunrise-sim/test-support", "sunrise-protocol/test-receive-progress"]
# Records the call sites of mob random draws (`mob_ai_probe` traces).
rng-trace = ["sunrise-core/rng-trace"]
# Opt-in Windows heap experiment; see docs/windows-allocators.md.
windows-segment-heap = []

[lints]
workspace = true

[dev-dependencies]
sunrise-client-lib = { path = ".", default-features = false, features = ["test-dry-side", "test-payload-probe"] }
sunrise-threads = { path = "../sunrise-threads", features = ["test-allocation-probe", "test-game-dir"] }
tempfile = "3"
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["testing"] }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab", features = ["testing"] }
# ui_theme's unit tests draw text in the design system's fonts.
sunrise-theme = { path = "../sunrise-theme" }
sunrise-client-render = { path = "../sunrise-client-render", features = ["test-support"] }
sunrise-items = { path = "../sunrise-items", features = ["test-support"] }
sunrise-sim = { path = "../sunrise-sim", features = ["test-support"] }
sunrise-world = { path = "../sunrise-world", features = ["test-support"] }
sunrise-game-data = { path = "../sunrise-game-data", features = ["test-language-publication", "test-effect-registry"] }
# Reads back the captures the server_perf tests write.
sunrise-perf = { path = "../sunrise-perf" }
# Every WGSL shader translated as wgpu's DirectX 12 backend does (gfx.rs tests).
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }

