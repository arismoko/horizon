[package]
name = "sunrise-mod-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The mod API: hooks, hosts, handles and parts, for native mods"

[lib]
name = "mod_api"

[dependencies]
sunrise-mod-vocab = { path = "../sunrise-mod-vocab" }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
sunrise-core = { path = "../sunrise-core" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
log = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"

[build-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }

[dev-dependencies]
sunrise-mod-vocab = { path = "../sunrise-mod-vocab", features = ["testing"] }

[features]
# Scoped mod installation for other crates' tests (`mod_api::testing`).
testing = ["sunrise-mod-vocab/testing"]
engine-test-platform = ["testing"]
# Test-only mixed hook, absent from normal API and wire layouts.

[lints]
workspace = true
