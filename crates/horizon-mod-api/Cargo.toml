[package]
name = "horizon-mod-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The mod API: hooks, hosts, handles and parts, for native and WebAssembly mods"

[lib]
name = "mod_api"

[dependencies]
horizon-mod-vocab = { path = "../horizon-mod-vocab" }
horizon-mod-runtime = { path = "../horizon-mod-runtime" }
horizon-core = { path = "../horizon-core" }
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
log = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[dev-dependencies]
horizon-mod-vocab = { path = "../horizon-mod-vocab", features = ["testing"] }

[features]
# Scoped mod installation for other crates' tests (`mod_api::testing`).
testing = ["horizon-mod-vocab/testing"]
# The mod side of the wasm boundary on a native build, for the boundary's tests.
wasm-guest = []

[lints]
workspace = true
