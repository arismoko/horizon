[package]
name = "shm-scene-runner"
version = "0.0.0"
edition = "2024"
[workspace]
resolver = "2"
[[bin]]
name = "shm_scene_runner"
path = "main.rs"
[dependencies]
horizon-client = { path = "/box/work/arismoko/horizon/crates/horizon-client", default-features = false }
horizon-mod-host = { path = "../../crates/horizon-mod-host", default-features = false }
horizon-mod-api = { path = "/box/work/arismoko/horizon/crates/horizon-mod-api" }
horizon-mod-points = { path = "/box/work/arismoko/horizon/crates/horizon-mod-points" }
horizon-mod-package = { path = "/box/work/arismoko/horizon/crates/horizon-mod-package" }
horizon-mod-wasm = { path = "/box/work/arismoko/horizon/crates/horizon-mod-wasm" }
log = "0.4"
[profile.release]
lto = "thin"
codegen-units = 1
[patch.crates-io]
wgpu-hal = { path = "/box/work/arismoko/horizon/third_party/wgpu-hal" }
naga = { path = "/box/work/arismoko/horizon/third_party/naga" }
libmimalloc-sys = { path = "/box/work/arismoko/horizon/third_party/libmimalloc-sys" }
