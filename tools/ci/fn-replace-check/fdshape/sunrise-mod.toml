id = "fnr_fdshape"
name = "Function replacement check: the Farmer's Delight targets"
version = "0.1.0"
description = "fn-replace: rows 4 and knockback's targets and kinds with trivial helpers (their real helpers call a retired runtime)"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
sunrise = "HEAD"
mixins = "MIXINS"

[[native.mixin]]
id = "ported_block_entity_tick"
kind = "HEAD"
target = "sunrise_gameplay::game::native_hooks::block_entity_tick::crate::game::ServerGame<'_>::tick_mod_block_entity_loaded"
helper = "src/mixins/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::ServerGame<'_>", value = "&mut *self" },
  { name = "pos", ty = "(i32, i32, i32)", value = "pos" },
]

[[native.mixin]]
id = "knockback_0"
kind = "MODIFY_VARIABLE"
target = "sunrise_gameplay::game::server_side::creatures_server::knockback::crate::game::ServerGame<'_>::knock_back_player"
variable = { name = "power", ordinal = 0, at = "LOAD", parameter = true }
require = 1
ordinal = 0
helper = "src/mixins/knockback.rs"
bindings = [{ name = "value", ty = "f64", value = "$value" }]

# The save path has the sign editor's borrowed-call shape and a slot in either SDK role.
[[native.mixin]]
id = "borrowed_text_component"
kind = "WRAP_OPERATION"
target = "sunrise_gameplay::game::server_side::persist::display::write_text_display"
selector = "tag_to_json"
require = 2
ordinal = 0
helper = "src/mixins/borrowed_text.rs"
bindings = [
  { name = "tag", ty = "&sunrise_core::nbt::Tag", value = "$arg0" },
  { name = "original", ty = "impl FnOnce(&sunrise_core::nbt::Tag) -> serde_json::Value", value = "$operation" },
]
[[native.mixin]]
id = "native_server_started"
kind = "HEAD"
target = "sunrise_gameplay::game::native_hooks::base::crate::game::ServerGame<'_>::native_server_started"
helper = "src/mixins/server_started.rs"
bindings = [{ name = "dedicated", ty = "bool", value = "dedicated" }]

[[native.mixin]]
id = "trait_block_state"
kind = "HEAD"
target = "sunrise_gameplay_common::game::level_access::<GameLevel<'_> as LevelAccess>::block_state"
helper = "src/mixins/trait.rs"
