id = "fnr_support"
name = "Function replacement check: support module and bridge"
version = "0.1.0"
description = "fn-replace: a [[native.module]] and a [[native.bridge]] compiled into the patch library, used by a helper"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
sunrise = "HEAD"
mixins = "MIXINS"

[[native.module]]
id = "runtime"
file = "crates/sunrise-gameplay/src/game/world/autosave_server.rs"
name = "fnr_runtime"
source = "src/runtime.rs"

[[native.bridge]]
id = "ticks"
kind = "GET_MUT"
target = "sunrise_gameplay::game::server_side::ServerState"
member = "ticks_until_autosave"

[[native.mixin]]
id = "head"
target = "sunrise_gameplay::game::server_side::autosave_server::crate::game::ServerGame<'_>::on_tick_rate_changed"
kind = "HEAD"
helper = "src/mixins/head.rs"
bindings = [{ name = "game", ty = "&mut crate::game::ServerGame<'_>", value = "&mut *self" }]
