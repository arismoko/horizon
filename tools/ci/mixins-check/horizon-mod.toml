# CI's inject and mixin check: tools/ci/mixins_check.sh pins the game and fills the function hashes and
# the Game declaration, including an area-file method, from the generated catalog. The two `[[inject]]`
# rows attach to compiled slots; the `[[native.mixin]]` row is compiled into the game by horizon-mixins.
id = "mixins_check"
name = "Mixins check"
version = "0.1.0"
description = "CI: API and area slots, and a mixin through horizon-mixins"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

internals = [{ path = "horizon_client::game::Game", hash = "GAME_HASH" }]

[native]
game = "26.3"
horizon = "HEAD"
mixins = "d9c83d7096b7ea5b83678da2efdfd6161f74997e"

[[inject]]
id = "tick"
at = "horizon_client::game::Game<'_>::tick"
kind = "head"
with = "tick"
hash = "TICK_HASH"

[[inject]]
id = "area"
at = "horizon_client::game::using_item::Game<'_>::start_eating"
kind = "return"
with = "area"
access = "internals"
hash = "AREA_HASH"

[[native.mixin]]
id = "count"
target = "horizon_client::game::Game<'_>::tick_mobs"
kind = "HEAD"
helper = "src/count.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
