# Code areas and the tests that cover them: `python3 tools/test_areas.py list|run|coverage`.
# tests/test_test_areas.py keeps it whole: every harness, LAN check and game-boot daily test belongs to an area
# (or, for harnesses, to [unassigned], a list that only shrinks), every pattern matches something, and every cargo
# entry's package has its target (cargo metadata).
#
# Per area:
#   paths      repository paths, fnmatch patterns (`*` crosses `/`); a changed file under one selects the area
#   cargo      Rust tests: { package, target ("lib", "bin:NAME" or "test:NAME"), filter (a libtest substring) }.
#              `run` runs the filter's ordinary tests; `run --daily` also runs the daily rows
#              (tools/ci/ignored-tests/) whose package, target and test path the entry matches.
#   harnesses  parity harness names (tools/test_<name>_parity.py), fnmatch patterns; a proof parity.py refuses
#              (PARITY_MANUAL) is named, to run by hand
#   lan        tools/lan_e2e.py check names, fnmatch patterns; run with `run --lan`, and an opt-in check
#              (test_areas.py LAN_OPT_IN) only on a game built for it, `--lan-bin-dir`
# Selection from a diff stays with tools/parity.py --changed (harnesses) and tools/ci/test_scope.py (crates):
# an area adds its name, its daily game-boot tests and its LAN checks, and is how a person asks for "the explosion tests".

# A changed path here can reach every area: `run --changed` tests the whole workspace as well.
escalate = [
  "Cargo.lock", "Cargo.toml", "tools/ci/rust-version", "research-lock.json",
  "tools/parity.py", "tools/parity_reach.py", "tools/parity_shim.py", "tools/lab.py", "tools/integration_env.py",
  "tools/parity_hosts.json", "tools/test_areas.py", "tools/test_areas.toml",
]

