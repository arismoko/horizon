<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
  <title id="t">Three ways into the game, from the most stable to the most powerful</title>
  <desc id="d">First choice: a hook or Part method, typed API values, native and WebAssembly. Second: an [[inject]] listener at a function slot or listed call site the game exposes, with API values, native and WebAssembly; it never compiles game code. Third: the native route, [[native.mixin]], [[native.loop]], [[native.bridge]] and [[native.module]], which compiles against the exact game build with real engine types, native only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker>
  </defs>
  <g font-size="13" fill="#1f2328">
    <rect x="10" y="20" width="260" height="190" rx="12" fill="#e6f6ec" stroke="#2f8a4f" stroke-width="1.5"/>
    <text x="30" y="50" font-size="12" fill="#1d5a33" font-weight="700">1 · FIRST CHOICE</text>
    <text x="30" y="76" font-size="16" font-weight="700" fill="#1d5a33">Hooks and Parts</text>
    <text x="30" y="104">One method per moment, with</text>
    <text x="30" y="122">a typed event and Host.</text>
    <text x="30" y="150">Stable across game builds.</text>
    <text x="30" y="186" font-weight="600">Native and WebAssembly</text>

    <rect x="300" y="20" width="260" height="190" rx="12" fill="#e7f0ff" stroke="#2b5ea7" stroke-width="1.5"/>
    <text x="320" y="50" font-size="12" fill="#1d3f73" font-weight="700">2 · NO HOOK FOR IT</text>
    <text x="320" y="76" font-size="16" font-weight="700" fill="#1d3f73" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace">[[inject]]</text>
    <text x="320" y="104">A listener at a function slot or</text>
    <text x="320" y="122">call site the game publishes,</text>
    <text x="320" y="140">with API values. Never compiles</text>
    <text x="320" y="158">game code.</text>
    <text x="320" y="186" font-weight="600">Native and WebAssembly</text>

    <rect x="590" y="20" width="260" height="190" rx="12" fill="#fff1e2" stroke="#b8621b" stroke-width="1.5"/>
    <text x="610" y="50" font-size="12" fill="#7a3d0b" font-weight="700">3 · CHANGE THE GAME'S CODE</text>
    <text x="610" y="76" font-size="16" font-weight="700" fill="#7a3d0b">The native route</text>
    <text x="610" y="102" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12">[[native.mixin]]  [[native.loop]]</text>
    <text x="610" y="120" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12">[[native.bridge]] [[native.module]]</text>
    <text x="610" y="146">Real engine types, pinned to</text>
    <text x="610" y="164">the exact game build.</text>
    <text x="610" y="186" font-weight="600">Native only</text>
  </g>
  <path d="M30 245 L 830 245" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="270" font-size="12.5" fill="#6e7681">More stable</text>
  <text x="830" y="270" font-size="12.5" fill="#6e7681" text-anchor="end">More power, tied to one game build</text>
</svg>
