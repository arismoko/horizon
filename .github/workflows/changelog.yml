name: Changelog
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: changelog-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -p test_changelog.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Generate digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/changelog.py --output "$RUNNER_TEMP/CHANGELOG.md"
      - name: Publish only to the orphan changelog branch
        run: |
          set -eu
          mkdir "$RUNNER_TEMP/digest"
          cd "$RUNNER_TEMP/digest"
          git init
          git remote add origin "$GITHUB_WORKSPACE"
          # Read the published history via the authenticated checkout remote.
          git -C "$GITHUB_WORKSPACE" fetch origin refs/heads/changelog:refs/remotes/origin/changelog || {
            status=0
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code origin refs/heads/changelog || status=$?
            # Exit 2 means a successful query with no matching branch; all other
            # outcomes are unexpected after fetch failed, including network errors.
            if [ "$status" -ne 2 ]; then
              echo "Could not fetch the published changelog branch" >&2
              exit 1
            fi
          }
          if git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet refs/remotes/origin/changelog; then
            git fetch origin refs/remotes/origin/changelog
            git checkout -b changelog FETCH_HEAD
          else
            git checkout --orphan changelog
          fi
          cp "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh generated changelog'
          # Push through checkout's credential helper, never push to main.
          git -C "$GITHUB_WORKSPACE" fetch "$RUNNER_TEMP/digest" changelog:refs/heads/changelog
          git -C "$GITHUB_WORKSPACE" push origin refs/heads/changelog:refs/heads/changelog
