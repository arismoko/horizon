name: fn-replace-check
# Native mods against the prebuilt game at this commit: the server SDK built from the staged source
# with warnings denied, then the launcher's native build of the check mods against it
# (tools/ci/fn_replace_check.sh): function replacement, bridges, support modules, a published loop,
# a mod with registry dependencies, and the refusals by name. So a change that breaks native mods
# fails here and not on a player's machine (#1102). Build and link only: no game runs and no vanilla
# data is read. Checked on main pushes, dispatches, and pull requests that touch what it builds.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - launcher/**
      - crates/horizon-mod-api-gen/**
      - crates/horizon-mod-api-macros/**
      - crates/horizon-mod-points/**
      - crates/horizon-mod-point-emit/**
      - tools/ci/fn_replace_check.sh
      - tools/ci/fn-replace-check/**
      - tools/prebuilt_game.py
      - .github/workflows/fn-replace-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per ref, queued: a started run finishes, and a newer main push replaces only the waiting one.
  group: fn-replace-check-${{ github.ref }}
  cancel-in-progress: false
env:
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
  # The 16 GB runner is short of memory for the game's release build with more.
  CARGO_BUILD_JOBS: 2
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
  fn-replace-check:
    needs: route
    runs-on: ${{ needs.route.outputs.self_hosted == 'true' && 'dyna-large' || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk the build does not need
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add swap and show memory
        if: runner.environment == 'github-hosted'
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -g
      - name: Self-hosted image headers or rootless fallback
        if: runner.environment == 'self-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install the launcher's pinned Rust and the headers the launcher and the game link against
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          pinned=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' launcher/src/rust_toolchain.rs)
          rustup toolchain install "$pinned" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pinned" >> "$GITHUB_ENV"
      # On a Dyna runner RUNNER_TEMP is a small tmpfs and the build volume is shared: the SDK and the
      # check's scratch go in a private folder on the build volume, removed when the job ends.
      - name: Allocate private scratch
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            umask 077
            mkdir -p "${CARGO_TARGET_DIR:?}"
            scratch=$(mktemp -d "$CARGO_TARGET_DIR/fn-replace-check.XXXXXX")
          else
            scratch="$RUNNER_TEMP/fn-replace-check"
            mkdir -p "$scratch"
          fi
          echo "FNR_SCRATCH=$scratch" >> "$GITHUB_ENV"
      # The SDK is built with the launcher's Rust: a mod's code is compiled against its metadata.
      - name: Server SDK, warnings denied
        run: python3 tools/prebuilt_game.py build "$FNR_SCRATCH/prebuilt" --server
      - name: Build the launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml
      - name: Function replacement check (build and link)
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          FNR_MODS="alpha beta one ten fdshape support registry lower loop" tools/ci/fn_replace_check.sh \
            "$launcher" "$FNR_SCRATCH/prebuilt" "$FNR_SCRATCH/check" 2>&1 | tee "$FNR_SCRATCH/fnr-check.log"
          grep -F 'Function replacement:' "$FNR_SCRATCH/fnr-check.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Refusals by name
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          for set in "alpha overwrite2" refused refused_state loop_refused; do
            log="$FNR_SCRATCH/refusal-${set// /_}.log"
            if FNR_KEEP=1 FNR_MODS="$set" tools/ci/fn_replace_check.sh "$launcher" "$FNR_SCRATCH/prebuilt" \
              "$FNR_SCRATCH/check" > "$log" 2>&1; then
              echo "$set built, and it must be refused"
              exit 1
            fi
            grep -E 'E_[A-Z_]+' "$log" | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
            grep -qE 'E_[A-Z_]+' "$log" || { echo "$set failed without a named refusal"; tail -40 "$log"; exit 1; }
          done
      - name: Clean private scratch
        if: always()
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -n "${FNR_SCRATCH:-}" ]; then
            rm -rf "$FNR_SCRATCH"
          fi
      - name: Memory and kills after the build
        if: always()
        run: |
          free -g
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -5 || true
          else
            dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -5 || true
          fi
