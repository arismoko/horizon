name: fn-replace-check
# Native mods against the prebuilt game at this commit: the server SDK built from the staged source
# with warnings denied, then the launcher's native build of the check mods against it
# (tools/ci/fn_replace_check.sh): function replacement, bridges, support modules, a published loop,
# a mod with registry dependencies, and the refusals by name. So a change that breaks native mods
# fails here and not on a player's machine (#1102). Build and link only: no game runs and no vanilla
# data is read. Checked by the daily run and by dispatch, never on pull requests or main pushes.
on:
  # The daily run (daily.yml) calls it with the commit to check; root dispatches it on a branch that changes
  # what it builds.
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
# A daily run's call is grouped by that run and always finishes (daily.yml runs one at a time). A dispatch on main
# gets a group of its own; elsewhere a newer dispatch on the same branch replaces the one before, which checked a
# superseded head.
concurrency:
  group: fn-replace-check-${{ inputs.commit && github.run_id || github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.commit == '' && github.ref != 'refs/heads/main' }}
env:
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          # Only dispatches (the daily run's included) run this workflow, from this repository.
          SAME_REPO: true
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
  fn-replace-check:
    needs: route
    runs-on: ${{ needs.route.outputs.self_hosted == 'true' && 'dyna-large' || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      # GitHub's 16 GB runner is short of memory for the game's release build with more than two crates at once.
      # A Dyna runner builds as many as its CPU quota allows within its memory, 4 GiB per release rustc
      # (tools/ci/cargo_jobs.py). CARGO_BUILD_JOBS, not a flag: it must also reach the launcher's mod builds.
      - name: Choose build parallelism
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            jobs=2
          else
            jobs=$(python3 tools/ci/cargo_jobs.py --job-mib 4096)
          fi
          echo "CARGO_BUILD_JOBS=$jobs" | tee -a "$GITHUB_ENV"
      - name: Free disk the build does not need
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add swap and show memory
        if: runner.environment == 'github-hosted'
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -g
      - name: Self-hosted image headers or rootless fallback
        if: runner.environment == 'self-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install the launcher's pinned Rust and the headers the launcher and the game link against
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          pinned=$(cat tools/ci/rust-version)
          rustup toolchain install "$pinned" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$pinned" >> "$GITHUB_ENV"
      # On a Dyna runner RUNNER_TEMP is a small tmpfs and the build volume is shared: the SDK and the
      # check's scratch go in a private folder on the build volume, removed when the job ends.
      - name: Allocate private scratch
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            umask 077
            mkdir -p "${CARGO_TARGET_DIR:?}"
            scratch=$(mktemp -d "$CARGO_TARGET_DIR/fn-replace-check.XXXXXX")
          else
            scratch="$RUNNER_TEMP/fn-replace-check"
            mkdir -p "$scratch"
          fi
          echo "FNR_SCRATCH=$scratch" >> "$GITHUB_ENV"
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # The SDK is built with the launcher's Rust: a mod's code is compiled against its metadata.
      - name: Server SDK, warnings denied
        # Release with ThinLTO as published, but 16 codegen units instead of 1: the same features,
        # flags, exports and link, built in parallel. A fault only one unit's inlining shows first
        # appears at the prebuilt-game publish.
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: python3 tools/prebuilt_game.py build "$FNR_SCRATCH/prebuilt" --server
      - name: Build the launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml
      - name: Function replacement check (build and link)
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          # api_only has no [native] row; beside alpha the mixed set still takes the engine route.
          FNR_ROUTE=prebuilt FNR_MODS="alpha beta one ten fdshape support registry lower loop loop_second api_only" \
            tools/ci/fn_replace_check.sh "$launcher" "$FNR_SCRATCH/prebuilt" "$FNR_SCRATCH/check" 2>&1 \
            | tee "$FNR_SCRATCH/fnr-check.log"
          grep -E 'Function replacement:|: [0-9]+ ms$|^Mods compiled against the prebuilt game in |^Runner load:' \
            "$FNR_SCRATCH/fnr-check.log" >> "$GITHUB_STEP_SUMMARY"
      - name: An API-only set takes the API route (build and link)
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          FNR_KEEP=1 FNR_ROUTE=prebuilt-api FNR_MODS="api_only" tools/ci/fn_replace_check.sh \
            "$launcher" "$FNR_SCRATCH/prebuilt" "$FNR_SCRATCH/check"
      # It also builds horizon-mixins from source, where the runs before it download the prebuilt tool.
      # On its own: with no mod filling the loop, a mixin on the loop's function is compiled for the
      # empty slot. Beside the `loop` mod it would be compiled for that mod's slots instead.
      - name: A mixin on a published loop's function, no slot filled (build and link)
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          FNR_KEEP=1 FNR_MIXINS_FROM_SOURCE=1 FNR_MODS="loop_generic_head" tools/ci/fn_replace_check.sh \
            "$launcher" "$FNR_SCRATCH/prebuilt" "$FNR_SCRATCH/check"
      - name: Refusals by name
        run: |
          launcher="${CARGO_TARGET_DIR:-launcher/target}/release/horizon-launcher"
          # Each set, then every code it must be refused with.
          while read -r set codes; do
            set=${set//+/ }
            log="$FNR_SCRATCH/refusal-${set// /_}.log"
            if FNR_KEEP=1 FNR_MODS="$set" tools/ci/fn_replace_check.sh "$launcher" "$FNR_SCRATCH/prebuilt" \
              "$FNR_SCRATCH/check" > "$log" 2>&1; then
              echo "$set built, and it must be refused"
              exit 1
            fi
            grep -E 'E_[A-Z_]+' "$log" | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
            for code in $codes; do
              grep -qF "$code: " "$log" || { echo "$set was not refused with $code"; tail -40 "$log"; exit 1; }
            done
          done <<'SETS'
          alpha+overwrite2 E_OVERWRITE_CONFLICT
          refused E_MIXIN_TARGET_MISSING E_MIXIN_NOT_REPLACEABLE
          refused_state E_MIXIN_STATE_LAYOUT
          loop_refused E_LOOP_UNKNOWN E_LOOP_ENTRY_REPLACED
          SETS
      - name: Clean private scratch
        if: always()
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ] && [ -n "${FNR_SCRATCH:-}" ]; then
            rm -rf "$FNR_SCRATCH"
          fi
      - name: Memory and kills after the build
        if: always()
        run: |
          free -g
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -5 || true
          else
            dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -5 || true
            grep usage_usec /sys/fs/cgroup/cpu.stat || true
            echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          fi
