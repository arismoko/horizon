name: game build
# Builds the game for every platform from `ref`: the Java exporters, then Linux and the Linux server, Windows x64
# and ARM64 on GitHub, and macOS on the Mac mini's runner with a 1500-frame offscreen run of a new world (smoke-test.json): Apple
# Silicon, and Intel cross-built there for x86_64-apple-darwin and checked under Rosetta 2 (#1161). Called by
# release.yml (the releases) and nightly-build.yml (the opt-in Nightly), always from main's copy of this file: the
# caller's commit, never the one being built. It holds no secrets: signing the checksums is the callers' own job,
# which never runs what this one built. Linux artifacts always build on Ubuntu 22.04; optional Dyna runners
# compile portable Java exporter classes and smoke the downloaded hosted Linux artifact with private data.
# See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (HORIZON_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      nightly:
        description: A nightly's "<date> <short sha>" (HORIZON_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # Only release.yml says true: it builds main. A nightly can hold pull requests nobody reviewed yet, whose
        # build scripts and tests run here and could rewrite target/, the cargo home or a compiler cache. So an
        # untrusted build never runs on the release runner, never saves the Rust cache (its key is its own anyway),
        # and a trusted one never reads the machine's shared sccache, which pull requests' jobs write
        # (tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
      developer_id:
        description: Sign the macOS programs with Developer ID and notarize the zip (the runner's keychain)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  runner-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Require a dedicated trusted release runner
        if: inputs.trusted && vars.MAC_RUNNER == ''
        run: |
          echo '::error::MAC_RUNNER must name a dedicated release runner before trusted builds can run.'
          exit 1
  exporters:
    needs: runner-configuration
    # This runner holds the maintainer's own pinned Minecraft jars. Only our classes leave it. An untrusted build
    # goes to the Mac mini's nightly runner (macOS + horizon-nightly: ludovics-mac-mini-nightly, beside the one that
    # runs pull requests' parity jobs, so a nightly never waits behind their queue), never the release runner
    # (MAC_RUNNER: ludovics-mac-mini-release) nor parity-main's.
    # toJSON keeps an empty trusted runner as an invalid empty label, never a Nightly fallback.
    runs-on: ${{ fromJSON(inputs.trusted && toJSON(vars.MAC_RUNNER) || (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_EXPORTERS_RUNNER) || (vars.SELF_HOSTED_CI != 'off' && '["self-hosted", "macOS", "horizon-nightly"]') || '"ubuntu-latest"') }}
    # Three full preparations (two isolated, one batched) besides the compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted' || runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '25'
      - if: runner.environment == 'self-hosted'
        run: |
          if [[ -z "${DYNA_CI_BUILD:-}" ]]; then bash tools/ci/runner-env.sh; fi
        env:
          HORIZON_NO_SCCACHE: ${{ inputs.trusted && '1' || '' }}
      - name: Build the shared wasm standard library
        shell: bash
        run: |
          cargo run --locked -p cargo-horizon-mod -- horizon-mod wasm-std horizon-wasm-std.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-std
          path: horizon-wasm-std.wasm
          if-no-files-found: error
      - name: Private exporter inputs
        run: |
          if [[ -n "${DYNA_CI_BUILD:-}" ]]; then
            HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
          else
            bash tools/ci/vanilla-data.sh
          fi
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it
          # prepares afresh.
          cargo build --release --locked -p horizon-prepare
          preparer="${CARGO_TARGET_DIR:-target}/release/horizon-prepare"
          # Compiled here, never taken from the runner's shared preparations: pull requests' parity jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$("$preparer" compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary "$preparer"
      - uses: actions/upload-artifact@v7
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [runner-configuration, exporters]
    name: build ${{ matrix.name }}
    # Windows ARM64 and musl are new: a failure never holds the other platforms' release (the signing job
    # needs this job, and a failed entry of it would fail it). The release steps leave the missing
    # optional archives out with a warning.
    continue-on-error: ${{ matrix.name == 'windows-arm64' || matrix.name == 'linux-musl' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
            # The server build too: packaging/server/install.sh installs it on Linux.
            server_dir: horizon-server-linux-x86_64
            server_asset: horizon-server-linux-x86_64.tar.gz
          - name: linux-musl
            os: ubuntu-22.04
            musl: true
            dir: horizon-linux-musl-x86_64
            asset: horizon-linux-musl-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            pe_arch: x64
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            dir: horizon-windows-arm64
            asset: horizon-windows-arm64.zip
            exe: .exe
            pe_arch: arm64
            # The ARM64 runner builds and runs native ARM64 executables; keep the C runtime in the archive.
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            target: aarch64-apple-darwin
            dir: horizon-macos-arm64
            asset: horizon-macos-arm64.zip
          # Intel Macs: built on the same runner for another target; its checks and smoke test run the x86_64
          # programs under Rosetta 2.
          - name: macos-x64
            mac: true
            target: x86_64-apple-darwin
            dir: horizon-macos-x64
            asset: horizon-macos-x64.zip
    runs-on: ${{ matrix.mac && fromJSON(inputs.trusted && toJSON(vars.MAC_RUNNER) || (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_MAC_RUNNER) || (vars.SELF_HOSTED_CI != 'off' && '["self-hosted", "macOS", "horizon-nightly"]') || '"macos-15"') || matrix.os }}
    # The fork's cold client + headless builds need both feature variants; keep upstream's limits unchanged.
    timeout-minutes: ${{ github.repository == 'arismoko/horizon' && 60 || (matrix.mac && 60 || 40) }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The release's version, built in (horizon_core::release): --version, user agents and crash reports
      # say it. No version-bump commits.
      HORIZON_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
      # Where cargo puts the programs: target/release, or target/<target>/release for another target.
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout, the Mac mini's runner too: its work folder is shared with pull requests'
          # parity jobs, and nothing they leave (target/, an untracked .cargo/config.toml, a build script's output)
          # may end up in a release. target/ is rebuilt from scratch; .local/ is relinked by vanilla-data.sh, which
          # keeps its preparations outside the checkout.
          clean: true
      - name: Workflow-owned validation tools
        if: (runner.os == 'Linux' && !matrix.musl) || runner.environment == 'self-hosted'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/check_glibc.py
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted' && !matrix.musl
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        with:
          distribution: temurin
          java-version: '25'
      - name: Build the official game, horizon-ctl, horizon-prepare and horizon-server
        if: ${{ !matrix.musl }}
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: The official game is the game players get, under its name
        # horizon-official: horizon-client's game with Horizon's own parts plugged in (docs/layers.md, "How a
        # Horizon crate plugs in"). Everything below, the launcher and players know it as horizon-client.
        if: ${{ !matrix.musl }}
        run: cp -f "$BIN/horizon-official${{ matrix.exe }}" "$BIN/horizon-client${{ matrix.exe }}"
      - name: Every program the release folder takes was built
        if: ${{ !matrix.musl }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            test -f "$BIN/$binary${{ matrix.exe }}" || { echo "::error::$BIN/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        run: |
          python tools/check_pe_arch.py "${{ matrix.pe_arch }}" \
            "$BIN/horizon-client${{ matrix.exe }}" "$BIN/horizon-ctl${{ matrix.exe }}" \
            "$BIN/horizon-prepare${{ matrix.exe }}" "$BIN/horizon-server${{ matrix.exe }}"
      - name: Rosetta for the Intel build on Apple Silicon
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify macOS executable architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            actual=$(lipo -archs "$BIN/$binary")
            [[ "$actual" == "$EXPECTED_ARCH" ]] || { echo "::error::$binary is $actual, expected $EXPECTED_ARCH"; exit 1; }
          done
      - name: The signing keychain, unlocked
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/keychain.sh unlock
      - name: Signed with Developer ID and the hardened runtime
        # Before the checks below, so they run the programs as players will.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --force --options runtime --timestamp --keychain "$MACOS_SIGN_KEYCHAIN" \
              --identifier "dev.horizon.${binary#horizon-}" --sign "$MACOS_SIGN_IDENTITY" "$BIN/$binary"
            codesign --verify --strict --verbose=2 "$BIN/$binary"
          done
      - name: Only system libraries
        if: ${{ !matrix.musl }}
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the standard
        # loader and libraries every desktop distribution has. macOS: only the system's own libraries.
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            file="$BIN/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$file"
            fi
          done
      - name: Baseline x86-64 CPUs only
        # No POPCNT or LZCNT at all (the script says why only those): a C library's count intrinsic killed the
        # game before main on a Core 2 (#7264). Not the Mac builds: every Intel Mac that runs macOS 11 has both.
        if: runner.os != 'macOS' && matrix.pe_arch != 'arm64' && !matrix.musl
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_cpu_baseline.py \
            $(for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do echo "$BIN/$binary${{ matrix.exe }}"; done)
      - name: Linux glibc baseline (Ubuntu 22.04)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          python3 .workflow-tools/tools/check_glibc.py \
            "$BIN/horizon-client" "$BIN/horizon-ctl" "$BIN/horizon-prepare" "$BIN/horizon-server"
      - name: Every program starts
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          bin=$BIN
          "$bin/horizon-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/horizon-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/horizon-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in horizon-prepare horizon-server; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
      - name: Tools from the runner
        if: runner.environment == 'self-hosted'
        env:
          HORIZON_NO_SCCACHE: ${{ inputs.trusted && '1' || '' }}
        run: |
          if [[ -z "${DYNA_CI_BUILD:-}" ]]; then bash tools/ci/runner-env.sh; fi
      - name: Resources prepared from the runner's own Minecraft
        if: runner.environment == 'self-hosted'
        run: |
          if [[ -n "${DYNA_CI_BUILD:-}" ]]; then
            HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
          else
            bash tools/ci/vanilla-data.sh
          fi
      - name: The game runs (offscreen, a new world, 1500 frames)
        if: runner.environment == 'self-hosted'
        run: bash .workflow-tools/tools/ci/game_smoke.sh
      # The separate Linux artifact smoke supplies the report when Dyna is enabled;
      # otherwise Apple Silicon supplies it. Intel still passes its own smoke run.
      - uses: actions/upload-artifact@v7
        if: runner.environment == 'self-hosted' && matrix.name == 'macos' && (inputs.trusted || vars.DYNA_CI_SELF_HOSTED != 'true' || vars.NIGHTLY_LINUX_RUNNER == '')
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@v8
        with:
          name: original-exporters
          path: exporters
      # The wasm member is target-independent, including on musl and Windows.
      - uses: actions/download-artifact@v8
        with:
          name: wasm-std
          path: ${{ matrix.musl && 'target/x86_64-unknown-linux-musl/release' || env.BIN }}
      - name: Build, check and package for musl in Alpine
        if: matrix.musl
        # Run Docker on the Ubuntu host: JavaScript actions themselves require glibc.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e HORIZON_VERSION -e HORIZON_NIGHTLY \
            rust:alpine3.22 sh tools/ci/build-musl.sh
      - name: Package
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          # Windows x64: Microsoft's DXC, pinned and checksummed, which DirectX 12 uses on integrated GPUs
          # (gfx/dx12_compiler.rs), with its licence. ARM64 keeps FXC (THIRD_PARTY_NOTICES.md says why).
          if [[ "${{ matrix.name }}" == windows ]]; then
            python tools/ci/fetch_dxc.py "dist/${{ matrix.dir }}"
          fi
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - name: Notarized
        # A zip of programs can't be stapled: Gatekeeper asks Apple the first time each one runs.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --verify --strict "dist/${{ matrix.dir }}/$binary"
          done
          packaging/macos/notarize.sh "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The server build (the game without sound or controllers, as horizon-engine)
        if: matrix.server_asset
        run: |
          set -euo pipefail
          # After the client is packaged: target/release/horizon-client is rebuilt without the audio and
          # controllers features, so it needs neither libasound nor libudev (minimal server images lack them).
          cargo build --release --locked -p horizon-game --no-default-features --bin horizon-client
          cargo run --locked -p xtask -- package-server "$BIN/horizon-client" "dist/${{ matrix.server_dir }}"
          folder="dist/${{ matrix.server_dir }}"
          python3 tools/check_imports.py --server "$folder/horizon-engine" "$folder/horizon-server" "$folder/horizon-prepare"
          python3 .workflow-tools/tools/check_glibc.py "$folder/horizon-engine" "$folder/horizon-server" "$folder/horizon-prepare"
          "$folder/horizon-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          cd dist
          rm -f "${{ matrix.server_asset }}"
          tar czf "${{ matrix.server_asset }}" "${{ matrix.server_dir }}"
          ls -l "${{ matrix.server_asset }}"
      - uses: actions/upload-artifact@v7
        if: matrix.server_asset
        with:
          name: ${{ matrix.server_asset }}
          path: dist/${{ matrix.server_asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: packaging/macos/keychain.sh lock

  linux-smoke:
    name: smoke hosted Linux artifact
    needs: [runner-configuration, build]
    if: ${{ !inputs.trusted && vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_LINUX_RUNNER != '' }}
    # Dyna supplies private resources, never the libc used to compile shipped binaries.
    runs-on: ${{ fromJSON(vars.NIGHTLY_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: Workflow-owned smoke tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: horizon-linux-x86_64.tar.gz
          path: ${{ runner.temp }}/hosted-linux
      - name: Unpack the hosted-built game, unchanged
        run: |
          tar xzf "$RUNNER_TEMP/hosted-linux/horizon-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/hosted-linux"
          echo "BIN=$RUNNER_TEMP/hosted-linux/horizon-linux-x86_64" >> "$GITHUB_ENV"
      - name: Private resources from the Dyna runner
        run: |
          : "${DYNA_CI_BUILD:?Linux smoke requires a Dyna private-data runner}"
          mkdir -p exporters
          cp -a "$BIN/exporters/." exporters/
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      - name: The hosted artifact draws a world under Xvfb
        run: bash .workflow-tools/tools/ci/game_smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3

