name: Paper event parity
# Informational only; never add push or pull_request triggers (issue #2090).
on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: read
concurrency:
  group: paper-parity
  cancel-in-progress: false
jobs:
  paper-parity:
    # Upstream's Mac runner holds the Paper server and Mojang files it compares with; this fork has no
    # runner with that label, so its scheduled run only sat queued until GitHub cancelled it.
    if: github.repository == 'horizon-rust/horizon'
    runs-on: [self-hosted, horizon-game, macOS]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      # Also tells the staging script where the native fixture must be installed.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/paper-parity/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Same persistent build/import/preparation caches as the parity workflows.
          clean: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: Tools from the runner (Python and the pinned JDK)
        run: bash tools/ci/runner-env.sh
      - name: Vanilla data, and resources prepared by this preparer
        # Imports the runner's own pinned Mojang copy; runs horizon-prepare on cache misses.
        run: bash tools/ci/vanilla-data.sh
      - name: Stage the native trace engine
        run: python3 tools/prepare_paper_trace_engine.py
      - name: Build the staged engine
        run: cargo build --release --manifest-path .local/paper-parity/engine-project/Cargo.toml
      - name: Build the bots
        run: cargo build --release --locked -p horizon-bots
      - name: Compare Paper events and Horizon hooks
        id: compare
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.local/paper-parity')
          Path(os.environ['RUNNER_TEMP'], 'paper-before.json').write_text(
              json.dumps([p.name for p in root.iterdir()]))
          PY
          set +e
          # Defaults work both before and after #2355 (no --scenario on main yet).
          python3 tools/paper_parity.py run \
            --engine "$CARGO_TARGET_DIR/release/paper-trace-engine" \
            --bots "$CARGO_TARGET_DIR/release/horizon-bots" \
            2>&1 | tee "$RUNNER_TEMP/paper-report.log"
          result=${PIPESTATUS[0]}
          echo "exit=$result" >> "$GITHUB_OUTPUT"
          # Classify the result below; do not hide harness failures with continue-on-error.
      - name: Summarize and classify (differences are informational)
        if: ${{ !cancelled() && steps.compare.outputs.exit != '' }}
        env:
          HARNESS_EXIT: ${{ steps.compare.outputs.exit }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import paper_parity as harness

          root = Path('.local/paper-parity')
          temp = Path(os.environ['RUNNER_TEMP'])
          before = set(json.loads((temp / 'paper-before.json').read_text()))
          # main uses chunk-load-*; #2355 uses run-*/<scenario>-<allow|cancel>.
          runs = [p for p in root.iterdir() if p.name not in before and p.is_dir()
                  and p.name.startswith(('chunk-load-', 'run-'))]
          artifact = root / ('run-ci-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          artifact.mkdir()
          shutil.copyfile(temp / 'paper-report.log', artifact / 'report.log')
          errors = []
          def collect(directory, destination):
              destination.mkdir(parents=True, exist_ok=True)
              # Deliberately shallow: never descend into worlds, homes, bootstrap or classes.
              for file in directory.iterdir():
                  if file.is_file() and file.suffix in ('.json', '.jsonl', '.log'):
                      shutil.copyfile(file, destination / file.name)
              try:
                  manifest = json.loads((directory / 'run.json').read_text())
                  if 'runs' in manifest:
                      if not manifest['runs']:
                          raise ValueError('empty scenario list')
                      for name in manifest['runs']:
                          if Path(name).name != name:
                              raise ValueError('invalid scenario directory')
                          collect(directory / name, destination / name)
                      return
                  if manifest.get('error') or not manifest.get('complete'):
                      raise ValueError(manifest.get('error') or 'incomplete run')
                  mapping = harness.hook_map()
                  for side in ('paper', 'horizon'):
                      rows = [json.loads(line) for line in (directory / f'{side}.jsonl').read_text().splitlines()]
                      joins = [i for i, r in enumerate(rows) if r['name'] == '_join']
                      quits = [i for i, r in enumerate(rows) if r['name'] == '_quit']
                      if len(joins) != 1 or len(quits) != 1 or quits[0] <= joins[0]:
                          raise ValueError(f'{side}: invalid join/quit markers')
                      for hook in manifest['scenario']['hooks']:
                          names = mapping[hook] if side == 'paper' else [hook]
                          events = [r for r in rows[:quits[0]] if r['name'] in names]
                          if not events:
                              raise ValueError(f'{side}: no observations for {hook}')
                          for event in events:
                              if type(event['tick']) is not int or type(event['cancelled']) is not bool:
                                  raise ValueError(f'{side}: invalid event metadata')
                              harness.NORMALIZE[hook](side, event['fields'])
              except (OSError, ValueError, KeyError, TypeError, IndexError) as error:
                  errors.append(f'{directory.name}: {error}')

          for directory in runs:
              collect(directory, artifact / directory.name)
          if not runs:
              errors.append('no run manifest produced')
          code = int(os.environ['HARNESS_EXIT'])
          if code not in (0, 1):
              errors.append(f'harness exited {code}')
          status = 'Harness error' if errors else ('Informational mismatch' if code else 'Match')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'## Paper event parity: {status}\n\n```text\n')
              summary.write((artifact / 'report.log').read_text())
              summary.write('\n```\n')
              summary.write('\n'.join(errors) + '\n')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
      - name: Traces and reports only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: paper-parity-${{ github.run_id }}-${{ github.run_attempt }}
          # Sanitized copies only, never the harness worlds, Paper jar or Mojang data.
          path: |
            .local/paper-parity/run-ci-${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            .local/paper-parity/run-ci-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            .local/paper-parity/run-ci-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
          if-no-files-found: ignore
          retention-days: 7
