name: ci-cache
# Publishes the GitHub-hosted caches that lint and verify restore (dyna-ci.yml). Main's own lint and verify run on
# Dyna's runners, which never save GitHub caches, so without this job outside contributors' pull requests built
# from cold: about 24 minutes of clippy instead of 3. Keys and environment must match dyna-ci.yml exactly.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cache
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
jobs:
  lint:
    if: github.repository == 'arismoko/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Lint cache toolchain
        id: toolchain
        run: |
          echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: lint-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ steps.toolchain.outputs.slot }}
          restore-keys: |
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-
      - name: Restore unchanged source timestamps
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json
      # The same commands as dyna-ci.yml's lint, so the artifacts match. A lint failure still leaves reusable
      # artifacts, so the snapshot is saved either way.
      - name: Build the lint graphs
        if: steps.lint-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cargo clippy --keep-going --workspace --all-targets -- -D warnings
          cargo clippy --keep-going -p horizon-client -p horizon-game -p horizon-mod-host --all-targets --no-default-features -- -D warnings
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.lint-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  verify:
    if: github.repository == 'arismoko/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # A new key: the dependency-only snapshot under the old one blocked saving this one.
          shared-key: verify-workspace
          cache-workspace-crates: true
      # The same targets as dyna-ci.yml's verify, built and not run.
      - name: Build verify's test targets
        run: cargo test --workspace --lib --bins --tests --no-run
