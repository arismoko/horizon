name: boat-recovery
on:
  workflow_run:
    workflows: [dyna-checks]
    types: [completed]
  # A queued runner does not emit a new event when it crosses the ten-minute limit.
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  # Serialize event handlers and sweeps so two controllers cannot cancel/rerun the same attempt.
  group: boat-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'arismoko/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # ONLY the controller workflow's trusted default-branch revision. Never use
      # workflow_run.head_sha or PR refs here. The API script may parse bounded
      # base-SHA metadata from a PR artifact, but never extracts or executes it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/boat_controller.py
      # A fork's pull request runs see no variables, so publish the boat switch and its user list (both already
      # public in effect) for boat_health.py. Bounded and schema-checked on both ends; never a secret.
      - if: ${{ !cancelled() }}
        env:
          BOAT_CI: ${{ vars.BOAT_CI }}
          BOAT_USERS: ${{ vars.BOAT_CI_USERS }}
        run: python3 tools/ci/boat_health.py publish > boat-routing.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: boat-routing
          path: boat-routing.json
          retention-days: 1
