name: telemetry-server
# Diverges from upstream: automatic runs are disabled pending root CI-capacity approval.
# The separate ingest workspace can still be checked explicitly when capacity permits.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telemetry-server-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Our checks runners (label horizon-checks, docs/ci-runners.md); SELF_HOSTED_CI=light or off: GitHub's.
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/horizon-telemetry-server
    steps:
      - uses: actions/checkout@v7
      - run: bash ../../tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # Ours keep their build folder between jobs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: crates/horizon-telemetry-server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
