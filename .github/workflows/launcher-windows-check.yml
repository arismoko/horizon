name: launcher-windows-check
# The launcher's tests on Windows x64, for pull requests that change it. Nothing is published: the release workflow
# (launcher.yml) stays off. GitHub-hosted, so it needs no runner of ours. The runtime-leases and launcher-processes
# jobs start child processes, so they run in the daily run (daily.yml calls this workflow with a commit) and by
# dispatch, never on pushes or pull requests (CI tiers, owner 2026-11-13).
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  # Main pushes publish the cache that pull requests restore (pull requests never save one).
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'crates/horizon-server-files/**'
      - 'crates/horizon-java-properties/**'
      - 'crates/horizon-client/src/carrier_store.rs'
      - 'crates/horizon-client/src/carrier_store_tests.rs'
      - '.github/workflows/launcher-windows-check.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'crates/horizon-mod-package/**'
      - 'crates/horizon-server-files/**'
      - 'crates/horizon-java-properties/**'
      - 'crates/horizon-client/src/carrier_store.rs'
      - 'crates/horizon-client/src/carrier_store_tests.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/launcher-windows-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Finish running main checks; keep only the newest pending push. Obsolete PR runs still cancel.
concurrency:
  # Each main push runs at once, beside any other (it publishes nothing that needs an order).
  # A daily run's call is grouped by that run.
  group: launcher-windows-check-${{ github.event.pull_request.number || inputs.commit && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.gate.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Heavy checks for this event
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/ci/pr_gate.py >> "$GITHUB_OUTPUT"

  test:
    # Only same-repository rollups and syncs compile on PR events; main and dispatch stay unchanged. The daily run's
    # call runs runtime-leases only.
    needs: gate
    if: inputs.commit == '' && needs.gate.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          # The launcher builds native mods for windows-gnu (rust_toolchain::WINDOWS_X64_TARGET), and
          # registry_compile's tests emit metadata for it: the image's stable had its std, a fresh pin does not.
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows-check
          # One cache from main, read by every pull request: per-PR caches filled the 10 GB budget and evicted main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Debug builds: no launcher test depends on a release-only path (cfg!(debug_assertions) gates only the
      # self-update switch and development overrides, which no test reaches), and debug adds overflow checks.
      - run: "cargo test --no-fail-fast --locked -p horizon-mod-package --features runtime-process --lib output::"
        working-directory: .
      # The library, the binary's own tests, the docs, and the tests/ targets that start no process. The tests/
      # targets that start the launcher binary run in the daily run's launcher-processes job, built for release:
      # a debug launcher overflows the Windows main thread's 1 MiB stack.
      - run: >-
          cargo test --no-fail-fast --locked --lib --bins --test developer_install --test durable_publication
          --test modpack_headline --test storage_consent
      - run: cargo test --no-fail-fast --locked --doc

  runtime-leases:
    # The daily run's call (scheduled or dispatched; it passes a commit) and a hand dispatch: it starts child
    # processes, so it is a daily test.
    if: inputs.commit != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: runtime-leases-windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p horizon-mod-package --features runtime-process --example holder_actor
        working-directory: .
        shell: bash
      - run: cargo test --no-fail-fast --release --locked -p horizon-mod-package --features runtime-process --lib
        working-directory: .
        shell: bash
      # The package's daily tests (its rows in tools/ci/ignored-tests/, the ones that start processes among them) run
      # here on Windows too, by name: no other ignored test (a manual one, a fixture writer) runs.
      - name: The package's daily tests
        working-directory: .
        shell: bash
        # bash -eo pipefail: a failure of the policy reader fails the step, never an empty selection.
        run: |
          listed=$(python tools/ci/ignored_tests.py --daily-tests horizon-mod-package lib | tr -d '\r')
          if [ -z "$listed" ]; then
            echo "horizon-mod-package's library has no daily rows: nothing to run"
            exit 0
          fi
          mapfile -t tests <<< "$listed"
          cargo test --no-fail-fast --release --locked -p horizon-mod-package --features runtime-process --lib \
            -- --ignored --exact "${tests[@]}"

  launcher-processes:
    # The tests/ targets that start the launcher binary (the test job runs every other target). Release, as players
    # run it: a debug launcher overflows the Windows main thread's 1 MiB stack. Daily run and hand dispatch only.
    if: inputs.commit != '' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo test --no-fail-fast --release --locked --test desktop --test hidden_processes --test logs
          --test owner_gate --test startup --test storage
