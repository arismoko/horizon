name: launcher-windows-check
# The launcher's tests on Windows x64, for pull requests that change it. Nothing is built for release or published:
# the release workflow (launcher.yml) stays off. GitHub-hosted, so it needs no runner of ours.
on:
  # Main pushes publish the cache that pull requests restore (pull requests never save one).
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'crates/horizon-server-files/**'
      - 'crates/horizon-client/src/carrier_store.rs'
      - 'crates/horizon-client/src/carrier_store_tests.rs'
      - '.github/workflows/launcher-windows-check.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'crates/horizon-mod-package/**'
      - 'crates/horizon-server-files/**'
      - 'crates/horizon-client/src/carrier_store.rs'
      - 'crates/horizon-client/src/carrier_store_tests.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/launcher-windows-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Finish running main checks; keep only the newest pending push. Obsolete PR runs still cancel.
concurrency:
  group: launcher-windows-check-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-windows-check
          # One cache from main, read by every pull request: per-PR caches filled the 10 GB budget and evicted main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: "cargo test --no-fail-fast --release --locked -p horizon-mod-package --features runtime-process --lib output::"
        working-directory: .
      # Every test target (the library, the binary, tests/), as launcher.yml runs them.
      - run: cargo test --no-fail-fast --release --locked

  runtime-leases:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: runtime-leases-windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p horizon-mod-package --features runtime-process --example holder_actor
        working-directory: .
        shell: bash
      - run: cargo test --no-fail-fast --release --locked -p horizon-mod-package --features runtime-process --lib
        working-directory: .
        shell: bash
