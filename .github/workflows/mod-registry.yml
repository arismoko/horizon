name: mod-registry
# The submission service is its own workspace (crates/horizon-mod-registry), so the checks job doesn't build
# it: this one does, and builds its image, whenever anything the image copies changes (horizon-mod-vocab's build
# script reads the game's hook sources, so the image copies every crate).
on:
  push:
    branches: [main]
    paths:
      # Everything its image copies (crates/horizon-mod-registry/Dockerfile): every crate's sources and the
      # layering inventory and the mixin patch its build reads, the root manifest and the build context's
      # ignore list.
      - 'crates/**'
      - 'tools/layering/mod_vocab_state.json'
      - 'tools/mixins/narrow-reference-rule.patch'
      - 'Cargo.toml'
      - '.dockerignore'
      - '.github/workflows/mod-registry.yml'
  pull_request:
    paths:
      # Everything its image copies (crates/horizon-mod-registry/Dockerfile): every crate's sources and the
      # layering inventory and the mixin patch its build reads, the root manifest and the build context's
      # ignore list.
      - 'crates/**'
      - 'tools/layering/mod_vocab_state.json'
      - 'tools/mixins/narrow-reference-rule.patch'
      - 'Cargo.toml'
      - '.dockerignore'
      - '.github/workflows/mod-registry.yml'
permissions:
  contents: read
concurrency:
  group: mod-registry-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Our checks runners (label horizon-checks, docs/ci-runners.md); SELF_HOSTED_CI=light or off: GitHub's.
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && vars.SELF_HOSTED_CI != 'light' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/horizon-mod-registry
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Ours keep their build folder between jobs.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: crates/horizon-mod-registry
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
  image:
    # The image Railway deploys, built from the repository root as Railway does: a crate its build needs and
    # the Dockerfile does not copy fails here, not at the next deploy. GitHub's runners have Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f crates/horizon-mod-registry/Dockerfile .
