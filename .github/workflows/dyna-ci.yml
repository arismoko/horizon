          echo "::error::$FETCH_STEP: history fetch from GitHub failed or timed out twice."
          exit 1
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # Offline tooling compiles tiny standalone fixtures even when no game Rust changed.
      # Install their tools explicitly rather than making missing compilers turn cases into skips.
      - name: Install Rust tools for isolated tooling fixtures
        if: needs.changes.outputs.rust_required != 'false' || needs.changes.outputs.tooling_required != 'false'
        env:
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
