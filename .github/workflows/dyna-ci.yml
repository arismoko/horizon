name: dyna-checks
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
# Upstream-style checks on pull requests; fork-only extras on main pushes and dispatches.
# Keep upstream's workflows byte-identical; disable checks (ci.yml) in the fork's Actions
# settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher; the dispatched run uses Dyna.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      prepare-output-check:
        description: Check the prepared output digest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks. Main runs are never cancelled: a run in
  # progress finishes, and only the newest waiting push runs next, so main is always checked.
  group: dyna-checks-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  changes:
    if: github.event_name != 'schedule' && !inputs.prepare-output-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
      # Every ignored-tests shard on main pushes and dispatches; empty on pull requests.
      ignored_matrix: ${{ steps.matrix.outputs.matrix || '{"shard":[]}' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pool's switch and lease are read live: `vars` is fixed when the run is created, and a main run
      # that waits in the concurrency group would otherwise see a lease that expired while it waited.
      # A fork's pull request gets no token to read them and stays on GitHub's runners.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" = true ]; then
            ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_SELF_HOSTED" -q .value 2>/dev/null || true)
            LEASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_POOL_UNTIL" -q .value 2>/dev/null || true)
          fi
          # A refused read prints GitHub's error JSON: keep only a well-formed answer, else use the snapshot.
          case "${LEASE:-}" in '' | *[!0-9]*) LEASE= ;; esac
          case "${ENABLED:-}" in true | false) ;; *) ENABLED= ;; esac
          echo "pool lease: live=${LEASE:-unreadable} snapshot=${VARS_LEASE:-none}"
          ENABLED=${ENABLED:-$VARS_ENABLED} LEASE=${LEASE:-$VARS_LEASE} bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - name: The ignored-tests shard matrix
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: matrix
        run: python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"

  pool-watch:
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dyna_ci_pool_watch.py

  # Lint and verify use separate Dyna slots when the pool is available; each slot's build folder persists.
  # Outside contributors and pool-down runs stay on GitHub's runners with snapshot caches.
  lint:
    # Dyna's large runner for main's pushes and this repository's own pull requests (owner, 2026-11-05): its
    # build folder persists, so clippy re-checks only what changed. A fork's pull request, or a run while the
    # pool is down, stays on GitHub's runners with the snapshot cache below.
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'dyna-large' || 'ubuntu-latest' }}
    # A cold lint (two full clippy graphs) takes 40+ minutes on GitHub runners: room to finish, main to save its cache.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 75 || 100 }}
    env:
      # Keep incremental check state too: changed workspace crates can reuse unchanged queries.
      CARGO_INCREMENTAL: 1
      # Like verify, avoid scheduling eight large rustc processes inside a 16 GiB slot.
      JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j4' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Dyna runner dependencies without root
        if: steps.rust.outputs.required != 'false' && runner.environment != 'github-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            # The slot's build folder persists between jobs; point the checkout's target at it.
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
            # Keep clippy-driver direct, but reuse sccache for ordinary dependency compilations.
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/clippy-cache.sh" >> "$GITHUB_ENV"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Lint cache toolchain
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        id: toolchain
        run: |
          echo "hash=$(rustc +stable -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          # One snapshot every 6 hours: the repository's 10 GB cache budget can't hold one per main head.
          echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      # rust-cache's default removes workspace artifacts. Those are the expensive part here,
      # in two feature graphs; keep both, and publish a fresh snapshot from main every 6 hours.
      - uses: actions/cache/restore@v4
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        id: lint-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ steps.toolchain.outputs.slot }}
          restore-keys: |
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-
      # A restore-key hit can predate a profile or dependency change: a successful download
      # does not mean Cargo has artifacts for the requested graph (for example, #1190).
      - name: Report lint cache compatibility
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        env:
          REQUESTED_KEY: ${{ steps.lint-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.lint-cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$MATCHED_KEY" ]; then
            STATUS="No lint cache found; this run builds from cold."
          elif [[ "$MATCHED_KEY" == "${REQUESTED_KEY%-*-*}-"* ]]; then
            STATUS="Matching manifests and lockfile; unchanged Cargo units can be reused."
          else
            STATUS="Fallback cache from different manifests or lockfile; dependency or profile changes can require a full rebuild until main saves a matching snapshot."
            echo "::notice::$STATUS"
          fi
          {
            echo "### Lint workspace cache"
            echo "$STATUS"
            printf '\nRequested: `%s`\n\nRestored: `%s`\n\n' "$REQUESTED_KEY" "${MATCHED_KEY:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
      # A fresh checkout otherwise makes every workspace source newer than the cached artifacts.
      # Only byte-identical Git objects regain their cached mtimes; changed inputs stay new.
      - name: Restore unchanged source timestamps
        if: steps.rust.outputs.required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check formatting and lint
        if: steps.rust.outputs.required != 'false'
        id: native-lint
        run: |
          cargo +stable fmt --all -- --check
          find crates/horizon-mod-api/src -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --check --config skip_children=true
          find crates/horizon-client/src/game -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --config skip_children=true --check
          rustup run stable rustfmt --edition 2024 --check crates/horizon-mod-api-gen/dispatch-tests/src/fixtures/*.rs
          cargo +stable clippy $JOBS --workspace --all-targets -- -D warnings
      - name: Lint the server build without sound or controllers
        if: steps.rust.outputs.required != 'false'
        id: server-lint
        run: cargo +stable clippy $JOBS -p horizon-client --all-targets --no-default-features -- -D warnings
      - name: The mod API builds for wasm32
        if: steps.rust.outputs.required != 'false'
        run: cargo +stable check $JOBS -p horizon-mod-api --target wasm32-unknown-unknown --locked
      - name: Report lint compiler cache
        if: ${{ !cancelled() && steps.rust.outputs.required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      # Publish native work even if the independent wasm check fails. Pull requests only read
      # main's snapshots; they can never replace a cache subsequently consumed by main.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.native-lint.outcome == 'success' && steps.server-lint.outcome == 'success' && steps.lint-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  wasm-mods:
    # Main pushes and dispatches: a mod built to mod.wasm and loaded as the game loads it;
    # the mod API's generated WIT as an artifact, and its diff in the job summary (never a failure).
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'dyna-large' || 'ubuntu-latest' }}
    # The universal host and guest binding build alone takes about an hour on the OVH runners (36 minutes
    # for the whole job on the desktop runner), so 60 minutes cancelled every main run there.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dyna runner dependencies without root
        if: runner.environment != 'github-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchains and the ALSA and udev headers
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
          fi
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: wasm-mods
          # Every fixture uses this workspace's target, so its std and shared dependencies
          # are cached once rather than in seven independent target directories.
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The mod API, points and internals crates build for wasm32
        run: cargo +1.99.1 check -p horizon-mod-api -p horizon-mod-points -p horizon-mod-internals --target wasm32-unknown-unknown
      - name: Generated internals copies, containers and functions compile for wasm32
        env:
          HORIZON_MOD_INTERNALS_MANIFEST: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/internals/coverage.toml
          HORIZON_MOD_INTERNALS_CATALOG: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/internals/coverage.json
        run: cargo +1.99.1 check -p horizon-mod-internals --target wasm32-unknown-unknown
      - name: Every crossable real internal has compiling host and guest bindings
        run: |
          export HORIZON_COVERAGE_WASM_CARGO="$(rustup which --toolchain 1.99.1 cargo)"
          export HORIZON_COVERAGE_WASM_RUSTC="$(rustup which --toolchain 1.99.1 rustc)"
          cargo +stable test -j4 -p horizon-mod-api-gen --lib real_catalog_has_compiling_host_and_guest_bindings -- --ignored --nocapture
      - name: Build all wasm fixtures and the std member in one shared target
        run: |
          cargo +stable build -p cargo-horizon-mod -p xtask
          for mod in docs/modding/examples/wasm-hello \
            crates/horizon-mod-wasm/tests/groups/{counter_lib,alpha,beta,gamma} \
            crates/horizon-mod-wasm/tests/points/{chat_tail,lib_tail}; do
            mkdir -p "$mod/target"
            ln -s "$GITHUB_WORKSPACE/target" "$mod/target/horizon-mod"
            (cd "$mod" && "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod build --wasm)
          done
          mod=crates/horizon-mod-wasm/tests/internals/counter
          mkdir -p "$mod/target"
          ln -s "$GITHUB_WORKSPACE/target" "$mod/target/horizon-mod"
          (cd "$mod" && HORIZON_MOD_INTERNALS_CATALOG="$GITHUB_WORKSPACE/$mod/internals.json" "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod build --wasm)
          (cd docs/modding/examples/wasm-hello && "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm")
      - name: Build the runtime tests once
        # Run the resulting binaries below: a separate Cargo invocation can rerun the API's
        # generator and rebuild its dependents even when no source changed.
        run: |
          cargo +stable test -p horizon-mod-wasm --tests --no-run --message-format=json | python3 -c '
          import json, sys
          for line in sys.stdin:
              artifact = json.loads(line)
              if artifact["reason"] == "compiler-artifact" and artifact["target"]["kind"] == ["test"] and artifact["executable"]:
                  print("WASM_TEST_" + artifact["target"]["name"].upper() + "=" + artifact["executable"])
          ' >> "$GITHUB_ENV"
      - name: Load it in the runtime
        env:
          HORIZON_WASM_SAMPLE: ${{ github.workspace }}/docs/modding/examples/wasm-hello/target/horizon-mod/hello_wasm.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: '"$WASM_TEST_SAMPLE" --ignored'
      - name: Mods sharing a library, linked in one group, and a mod of another group
        env:
          HORIZON_WASM_GROUPS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/groups
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: '"$WASM_TEST_GROUPS" --ignored'
      - name: Native and wasm listeners at one point, in the installed order
        env:
          HORIZON_WASM_POINTS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/points
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: '"$WASM_TEST_POINTS" --ignored'
      - name: A generated internals view commits its raw listener's journal and calls its thunk
        env:
          HORIZON_WASM_INTERNALS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/internals
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: '"$WASM_TEST_INTERNALS" --ignored'
      - name: Internals panics and journal overflow stop only the calling group
        env:
          HORIZON_WASM_INTERNALS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/internals
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: 'cargo +stable test -j4 -p horizon-mod-wasm --lib "view::tests::" -- --ignored'
      - name: A listener refused with its library keeps nothing of their group
        env:
          HORIZON_WASM_GROUPS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/groups
          HORIZON_WASM_POINTS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/points
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: '"$WASM_TEST_REFUSED_POINTS" --ignored'
      - name: The mod API's WIT, and what this change does to it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          target/debug/xtask mod-api wit target/wit-head
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git worktree add -q ../wit-base "$BASE_SHA"
            # The base's own generator reads the base's catalog: the head's xtask doesn't know
            # the base's layout. A base that can't build its WIT fails the step.
            (cd ../wit-base && cargo +stable run -q -p xtask -- mod-api wit "$GITHUB_WORKSPACE/target/wit-base")
          fi
          if [ -f target/wit-base/mod-api.wit ]; then
            python3 tools/ci/wit_report.py target/wit-base/mod-api.wit target/wit-head/mod-api.wit >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No mod-api.wit to compare with at $BASE_SHA: this is the first." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mod-api-wasm
          path: |
            target/wit-head/mod-api.wit
            target/horizon-wasm-std.wasm
            docs/modding/examples/wasm-hello/target/horizon-mod/hello_wasm.hmod

  wasm-bench:
    # Main pushes and dispatches: what a wasm mod costs against the same mod built native,
    # in release, in the job summary (never a failure; timings on shared runners are indicative).
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchains and the ALSA and udev headers
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-bench
          workspaces: |
            .
            crates/horizon-mod-wasm/tests/bench/hook -> target/horizon-mod
            crates/horizon-mod-wasm/tests/bench/internals -> target/horizon-mod
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the benchmark mod to mod.wasm, and the std member
        run: |
          cargo +stable build -p cargo-horizon-mod
          cd crates/horizon-mod-wasm/tests/bench/hook
          ../../../../../target/debug/cargo-horizon-mod horizon-mod build --wasm
          ../../../../../target/debug/cargo-horizon-mod horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm"
          cd ../internals
          HORIZON_MOD_INTERNALS_CATALOG="$PWD/internals.json" ../../../../../target/debug/cargo-horizon-mod horizon-mod build --wasm
      - name: The same hook native and as mod.wasm
        env:
          HORIZON_WASM_BENCH: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/bench/hook/target/horizon-mod/bench_mod.hmod
          HORIZON_WASM_INTERNALS_BENCH: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/bench/internals/target/horizon-mod/internals_bench.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        # The internals bench seals the process-wide hook registry, so it runs alone, as its #[ignore] note says.
        run: |
          cargo +stable test --release -p horizon-mod-wasm --test bench -- --ignored --nocapture --test-threads=1 --skip internals_bench
          cargo +stable test --release -p horizon-mod-wasm --test bench -- --ignored --nocapture --test-threads=1 internals_bench

  verify:
    needs: changes
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-large' || vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j4' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 tools/check_public_tree.py --history
          fi
      - name: Check duplicate public native functions
        run: python3 tools/sync_upstream.py --check
      - name: Install Dyna runner dependencies without root
        if: steps.rust.outputs.required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependency-only cache: a full workspace/test snapshot would compete with lint for the 10 GB budget.
      # Profile overrides in Cargo.toml are part of rust-cache's key; unchanged dependencies still restore.
      - uses: Swatinem/rust-cache@v2
        if: steps.rust.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A dyna-large runner has a hard 16 GiB limit and 8 CPUs; horizon-client rustc processes take about 2.6 GB
      # each, so Dyna runs build four crates at a time. Formatting and lint run in parallel on GitHub's
      # runners (the lint job), so this job only tests. A cargo flag, not CARGO_BUILD_JOBS: sccache hashes
      # CARGO_* variables, and that would split the runners' cache from the boxes'.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which the lint job already
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Test Rust core and voxel kernel correctness
        if: steps.rust.outputs.required != 'false'
        run: cargo +stable test $JOBS --workspace --lib --bins --tests
      # Separate timings make rebuilds between Cargo invocations visible without changing the test selection.
      # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
      # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
      # recompiling the workspace with a different dependency graph.
      - name: Test ignored mod content roots
        if: steps.rust.outputs.required != 'false'
        run: |
          cargo +stable test $JOBS --workspace --lib --bins --tests mod_content::tests:: -- --ignored
      - name: Test Rust documentation examples
        if: steps.rust.outputs.required != 'false'
        run: cargo +stable test $JOBS --workspace --doc
      # Last, and whatever happened above: a tooling failure must never skip the Rust tests.
      - name: Test offline research tooling
        if: ${{ !cancelled() }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tools/ci -p 'test_prepared_*.py' -v
  # The #[ignore]d library tests that need the prepared vanilla data, which verify doesn't have. Main pushes and
  # dispatches only, on Dyna's large runner where that data lives. Every shard runs, with one package per shard
  # (the plan lives in tools/ci/ignored_shards.py). tools/ci/ignored_tests.py fails on a new failure and on a known
  # one that passes, and prints only test names and results: the data is Mojang's.
  ignored-tests-shards:
    needs: changes
    # Skip an empty matrix instead of expanding to nothing, which GitHub refuses.
    if: >-
      needs.changes.outputs.self_hosted == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      fromJSON(needs.changes.outputs.ignored_matrix).shard[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ignored_matrix) }}
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Dyna runner dependencies
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          rustup toolchain install stable --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Not every dyna-large runner has the data yet. Dispatches skip the tests there; main pushes fail.
      - name: Prepare checkout-keyed vanilla data
        id: data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for dir in minecraft datagen horizon-client tools; do
            if [ ! -d "/cache/horizon-local/$dir" ]; then
              echo "prepared data unavailable on this runner"
              if [ "$EVENT" = push ]; then exit 1; fi
              echo "present=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      - name: Generate the fishing test's vanilla reference inputs
        if: steps.data.outputs.present != 'false' && matrix.shard == 'horizon-client'
        run: |
          reference=$(mktemp -d "$RUNNER_TEMP/fishing-reference.XXXXXX")
          python3 tools/test_fishing_rng_parity.py --prepare-reference "$reference" --env-file "$GITHUB_ENV"
      - name: Run the ignored tests that need prepared data
        if: steps.data.outputs.present != 'false'
        env:
          RUSTUP_TOOLCHAIN: stable
          SHARD: ${{ matrix.shard }}
        run: |
          export HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3"
          python3 tools/ci/with_xvfb.py python3 tools/ci/ignored_tests.py "$SHARD"
  # Aggregate the main-push and dispatch shards: green when each passed or was skipped.
  ignored-tests:
    needs: [changes, ignored-tests-shards]
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.self_hosted == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every ignored-tests shard passed or was skipped
        run: |
          result="${{ needs.ignored-tests-shards.result }}"
          case "$result" in
            success | skipped) echo "ignored-tests shards: $result" ;;
            *) echo "::error::ignored-tests shards: $result" && exit 1 ;;
          esac
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    needs: changes
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this pull request change the launcher or a crate it builds?
        if: github.event_name == 'pull_request'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Dyna runner dependencies without root
        if: steps.launcher.outputs.required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers GPUI links against
        if: steps.launcher.outputs.required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.launcher.outputs.required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the launcher's formatting, lint and tests
        if: steps.launcher.outputs.required != 'false'
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: |
          cargo +stable fmt --check
          cargo +stable clippy $JOBS --all-targets --locked -- -D warnings
          cargo +stable test $JOBS --locked --lib --bins
  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  prepared-output-check:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare-output-check && github.repository == 'arismoko/horizon'
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Dyna runner dependencies
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          rustup toolchain install stable --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check prepared output digest
        run: |
          # Never reuse a completed preparation for this diagnostic, including a retry.
          for attempt in 1 2; do
            HORIZON_PREPARE_KEY="${GITHUB_SHA:0:16}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              HORIZON_PREPARE_EXPORT_DIGEST="$RUNNER_TEMP/export.digest" \
              HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
            exported=$(cat "$RUNNER_TEMP/export.digest")
            actual=$(python3 tools/prepare_output.py digest 2>/dev/null) || { echo "::error::prepared output digest unavailable"; exit 1; }
            { echo "fresh export $attempt: $exported"; echo "seeded export $attempt: $actual"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          set +e
          python3 tools/prepare_output.py check > "$RUNNER_TEMP/output-check.log" 2>&1
          result=$?
          set -e
          expected=$(awk '!/^#/ && NF == 2 { value=$2 } END { print value }' crates/horizon-prepare/output-versions.txt)
          { echo "prepared output check: $([ "$result" -eq 0 ] && echo pass || echo fail)"; echo "actual: $actual"; echo "expected: $expected"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"

  vanilla-parity:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'workflow_dispatch' && !inputs.prepare-output-check
    runs-on: dyna-large
    permissions:
