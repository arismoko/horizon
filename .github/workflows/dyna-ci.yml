name: dyna-checks
# What the run tests, readable in the run list: a dispatch with `pr` runs on ref main but tests that pull request's head,
# so it is named for it and never read as main's CI; the prepared-output dispatch likewise.
run-name: "${{ inputs.pr && format('PR #{0} gate', inputs.pr) || inputs.prepare-output-check && 'prepared output check' || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
# A contributor's pull request (its head in a fork) gets the cheap checks (verify-static, format); the heavy ones
# (everything that compiles) run on main's pushes, dispatches, and same-repository rollup or sync pull requests
# (tools/ci/pr_gate.py, docs/ci-runners.md).
# Keep upstream's workflows byte-identical; disable checks (ci.yml) in the fork's Actions
# settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher and the churn report; the dispatched run uses Dyna.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      github-fallback:
        description: Force GitHub-hosted runners after a boat runner outage
        type: boolean
        default: false
      prepare-output-check:
        description: Check the prepared output digest
        type: boolean
        default: false
      pr:
        description: Run the heavy checks on this pull request's head (a fork's too) and post them on it
        type: string
        default: ''
defaults:
  run:
    shell: bash

permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks. Each main push runs at once, beside any
  # other: none of its jobs publishes or writes shared state, so a main run never waits behind another.
  # A dispatch for a pull request (`pr`) is grouped by that pull request, never by main's head.
  group: dyna-checks-${{ github.event.pull_request.number || inputs.pr && format('pr-{0}', inputs.pr) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  # A draft pull request skips every check below (they all need this job); it runs when marked ready.
  changes:
    if: github.event_name != 'schedule' && !inputs.prepare-output-check && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # Selection normally finishes in two minutes; allow two bounded history fetches.
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # Whether the heavy jobs run (tools/ci/pr_gate.py); a dispatch with `pr` runs them on that head.
      heavy: ${{ steps.gate.outputs.heavy }}
      pr_sha: ${{ steps.gate.outputs.pr_sha }}
      # Whether this run's code may use our own runners: never a fork's pull request, dispatched or not.
      trusted: ${{ steps.gate.outputs.trusted || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false') }}
      rust_required: ${{ steps.selection.outputs.rust_required || 'true' }}
      launcher_required: ${{ steps.selection.outputs.launcher_required || 'true' }}
      tooling_required: ${{ steps.selection.outputs.tooling_required || 'true' }}
      self_hosted: ${{ !inputs.github-fallback && steps.hosted.outputs.forced_github != 'true' && steps.runner.outputs.self_hosted || 'false' }}
      # Where lint and verify run when they don't go to Dyna's pool: boat-large for listed outside contributors
      # while vars.BOAT_CI is on (boat refuses a public repository's run unless both its author and the user who
      # started it are on boat's own list, so the same list lives in vars.BOAT_CI_USERS), else GitHub's runner.
      hosted_label: ${{ steps.hosted.outputs.label }}
      forced_github: ${{ steps.hosted.outputs.forced_github }}
    steps:
      - uses: actions/checkout@v4
      - name: Heavy checks for this event
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ inputs.pr }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/ci/pr_gate.py >> "$GITHUB_OUTPUT"
      - name: Fetch this commit's history for selection
        if: github.event_name == 'pull_request'
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history for selection
        run: |
          for attempt in 1 2; do
            if [ "$(git rev-parse --is-shallow-repository)" = false ]; then exit 0; fi
            if timeout --kill-after=10s 300s git fetch -q --no-tags --unshallow origin "$(git rev-parse HEAD)"; then exit 0; fi
            echo "$FETCH_STEP: GitHub fetch attempt $attempt failed or timed out."
          done
          echo "::error::$FETCH_STEP: history fetch from GitHub failed or timed out twice."
          exit 1
      - name: Select checks once for this pull request
        if: github.event_name == 'pull_request'
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --all "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # workflow_run omits pull_requests for fork runs. Record only immutable IDs;
      # the trusted controller reads this as bounded data, never as executable code.
      - name: Record the original PR base for boat recovery
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('boat-base.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': '1',
              'base': event['pull_request']['base']['sha'],
              'head': event['pull_request']['head']['sha'],
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          name: boat-base-1
          path: boat-base.json
          retention-days: 2
      # Prefer the live pool switch/lease. github.token normally cannot read Variables;
      # its snapshot fallback uses run creation time, bounded to an hour of queue age.
      # Fork pull requests remain on GitHub's runners.
      - id: runner
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ steps.gate.outputs.trusted || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ "$SAME_REPO" = true ]; then
            ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_SELF_HOSTED" -q .value 2>/dev/null || true)
            LEASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_POOL_UNTIL" -q .value 2>/dev/null || true)
          fi
          # A refused read prints GitHub's error JSON: keep only a well-formed answer, else use the snapshot.
          case "${LEASE:-}" in '' | *[!0-9]*) LEASE= ;; esac
          case "${ENABLED:-}" in true | false) ;; *) ENABLED= ;; esac
          echo "pool lease: live=${LEASE:-unreadable} snapshot=${VARS_LEASE:-none}"
          SOURCE=live
          CREATED=
          if [ -z "${LEASE:-}" ]; then
            SOURCE=snapshot
            # Actions read is sufficient for run metadata, unlike the Variables endpoint.
            CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .created_at 2>/dev/null || true)
            if [ -n "$CREATED_AT" ]; then
              CREATED=$(date -d "$CREATED_AT" +%s 2>/dev/null || true)
            fi
          fi
          ENABLED=${ENABLED:-$VARS_ENABLED} LEASE=${LEASE:-$VARS_LEASE} LEASE_SOURCE=$SOURCE CREATED=$CREATED bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - id: hosted
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a fork's pull request: boat_health.py then reads what boat-recovery published.
          BOAT_CI: ${{ vars.BOAT_CI }}
          BOAT_FALLBACK: ${{ inputs.github-fallback && 'true' || 'false' }}
          BOAT_USERS: ${{ vars.BOAT_CI_USERS }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          ACTOR: ${{ github.triggering_actor }}
        run: python3 tools/ci/boat_health.py

  # Fork PR tokens cannot dispatch or cancel runs. The trusted default-branch
  # boat-recovery workflow cancels/reruns outages; changes reads the previous attempt.
  # Same-run fallback jobs would leave the original queued checks pending, not green.
  boat-watch:
    needs: changes
    if: needs.changes.outputs.hosted_label == 'boat-large' && needs.changes.outputs.self_hosted != 'true' && needs.changes.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 tools/ci/boat_watch.py

  pool-watch:
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dyna_ci_pool_watch.py

  # The conflict-hotspot churn report (tools/hotspots/README.md), on the nightly schedule only, on GitHub's runner:
  # replays the last 3 days of merges with `git merge-tree` (git 2.38 or newer) and rewrites one issue. No build.
  # Never a gate: the job and each step continue on error, so a failure or a timeout never fails the run.
  churn-report:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request heads and upstream's main
        id: fetch
        continue-on-error: true
        run: |
          git fetch -q --no-tags origin '+refs/pull/*/head:refs/pull/*/head'
          git fetch -q --no-tags https://github.com/horizon-rust/horizon.git main:refs/remotes/upstream/main
      - name: Update the churn report issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Conflict hotspots: churn report'
          FETCHED: ${{ steps.fetch.outcome }}
        run: |
          git --version
          python3 tools/hotspots/measure.py --days 3 --report > "$RUNNER_TEMP/report.md"
          {
            echo "> 🤖 Filed by Aria's agent swarm, Dyna, not by Aria."
            echo
            if [ "$FETCHED" != success ]; then
              echo "Fetching the PR heads or upstream's main failed: some PRs show as a commit, and syncs may count as PRs."
              echo
            fi
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | sed -n '1p')
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  # Lint and verify use separate Dyna slots when the pool is available; each slot's build folder persists.
  # Outside contributors and pool-down runs stay on GitHub's runners with snapshot caches.
  lint:
    # Dyna's large runner for main's pushes and this repository's own pull requests (owner, 2026-11-05): its
    # build folder persists, so clippy re-checks only what changed. A fork's pull request, or a run while the
    # pool is down, stays on GitHub's runners with the snapshot cache below.
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna-large' || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    # Recent green lint peaked at 53.5 minutes on a cold runner (including the wasm check).
    # Cold GitHub/boat lint was not represented in that sample; retain its previous allowance.
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 60 || github.event_name == 'pull_request' && 75 || 100 }}
    env:
      # dyna (Dyna's pool: persistent build folder, no sudo), boat (a fresh VM like GitHub's, 16 GiB) or github.
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Documentation needs no Rust lint
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'Rust lint is not selected; repository hygiene still runs.'
      # Not diff-selected: any tracked file can contain a captured tool notice.
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && env.RUNNER_KIND == 'dyna'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            # The slot's build folder persists between jobs; point the checkout's target at it.
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
            # Keep clippy-driver direct, but reuse sccache for ordinary dependency compilations.
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" >> "$GITHUB_ENV"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Lint cache toolchain
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        id: toolchain
        run: |
          echo "hash=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          # One snapshot every 6 hours: the repository's 10 GB cache budget can't hold one per main head.
          echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      # rust-cache's default removes workspace artifacts. Those are the expensive part here,
      # in two feature graphs; keep both. ci-cache.yml publishes a fresh snapshot from main every 6 hours.
      - uses: actions/cache/restore@v4
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        id: lint-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ steps.toolchain.outputs.slot }}
          restore-keys: |
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-
      # A restore-key hit can predate a profile or dependency change: a successful download
      # does not mean Cargo has artifacts for the requested graph (for example, #1190).
      - name: Report lint cache compatibility
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        env:
          REQUESTED_KEY: ${{ steps.lint-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.lint-cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$MATCHED_KEY" ]; then
            STATUS="No lint cache found; this run builds from cold."
          elif [[ "$MATCHED_KEY" == "${REQUESTED_KEY%-*-*}-"* ]]; then
            STATUS="Matching manifests and lockfile; unchanged Cargo units can be reused."
          else
            STATUS="Fallback cache from different manifests or lockfile; dependency or profile changes can require a full rebuild until main saves a matching snapshot."
            echo "::notice::$STATUS"
          fi
          {
            echo "### Lint workspace cache"
            echo "$STATUS"
            printf '\nRequested: `%s`\n\nRestored: `%s`\n\n' "$REQUESTED_KEY" "${MATCHED_KEY:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
      # A Dyna runner builds as many crates at once as its CPU quota allows within its memory, about 3 GiB
      # per large rustc (tools/ci/cargo_jobs.py); boat's 16 GiB VM keeps four. A cargo flag, not
      # CARGO_BUILD_JOBS: sccache hashes CARGO_* variables, which would split the runners' cache from the boxes'.
      - name: Choose build parallelism
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          case "$RUNNER_KIND" in
            dyna) jobs="-j$(python3 tools/ci/cargo_jobs.py --job-mib 3072)" ;;
            boat) jobs=-j4 ;;
            *) jobs= ;;
          esac
          echo "JOBS=$jobs" | tee -a "$GITHUB_ENV"
      # A fresh checkout otherwise makes every workspace source newer than the cached artifacts.
      # Only byte-identical Git objects regain their cached mtimes; changed inputs stay new.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check repository artifacts and workflow YAML
        id: check_repository_artifacts_and_workflow_yaml
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        id: check_mod_api_boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: formatting
        run: |
          python3 tools/ci/format_scan.py
      - name: Lint native targets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: native-lint
        run: cargo clippy $JOBS --keep-going --workspace --all-targets -- -D warnings
      - name: Lint the server build without sound or controllers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: server-lint
        run: cargo clippy $JOBS --keep-going -p horizon-client -p horizon-game -p horizon-mod-host --all-targets --no-default-features -- -D warnings
      - name: The mod API builds for wasm32
        id: the_mod_api_builds_for_wasm32
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: cargo check $JOBS --keep-going -p horizon-mod-api --target wasm32-unknown-unknown --locked
      # The prebuilt SDK's own feature graph: a release --lib build with prefer-dynamic and warnings denied, as
      # tools/prebuilt_game.py builds it, for the host and for the Windows archive (system-allocator there,
      # cargo_features). The checks above unify test and dev features (test-support) into one host build, which hid
      # an unused import (Linux) and a unix-only binding (Windows) from everything but the SDK builds on main. Its own
      # target folder: these flags would otherwise invalidate the workspace's artifacts for the other steps.
      - name: The prebuilt SDK's host library builds without warnings
        id: sdk_host
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' }}
        run: |
          started=$SECONDS
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS='-C prefer-dynamic -D warnings' \
            cargo check $JOBS --keep-going --locked -p horizon-mod-host --lib --profile release --target-dir target/sdk-check --target "$host"
          echo "SDK library check host: $((SECONDS - started)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The prebuilt SDK's Windows library builds without warnings
        id: sdk_windows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' }}
        env:
          # MinGW ignores mimalloc's MSVC pragmas. CFLAGS replaces cc's default warning flags,
          # so retain -Wall/-Wextra for both mimalloc and hidapi; silence only unknown pragmas.
          CFLAGS_x86_64_pc_windows_gnu: -Wall -Wextra -Wno-unknown-pragmas
        run: |
          started=$SECONDS
          # hidapi and libmimalloc-sys compile C for the target in their build scripts.
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null; then
            echo "::error::x86_64-w64-mingw32-gcc is missing: the Windows SDK check needs MinGW (gcc-mingw-w64-x86-64 in the ci-runner image)"
            exit 1
          fi
          rustup target add x86_64-pc-windows-gnu
          # The real build is a dylib, which Cargo never LTOs; a --lib check under the release profile's thin LTO
          # builds the dependencies for linker-plugin LTO, which rustc refuses with prefer-dynamic on Windows.
          # A check generates no code, so LTO changes no warning or cfg it reports.
          env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS='-C prefer-dynamic -D warnings' \
            cargo check $JOBS --keep-going --locked -p horizon-mod-host --lib --profile release --target-dir target/sdk-check \
              --target x86_64-pc-windows-gnu --features system-allocator --config profile.release.lto=false
          echo "SDK library check windows: $((SECONDS - started)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report lint compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: |
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true
          # The runner's CPU time and peak memory: what the build parallelism above has to fit.
          grep usage_usec /sys/fs/cgroup/cpu.stat || true
          echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
      # Publish native work even if the independent wasm check fails. Pull requests only read
      # main's snapshots; they can never replace a cache subsequently consumed by main.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat') && github.ref == 'refs/heads/main' && steps.native-lint.outcome == 'success' && steps.server-lint.outcome == 'success' && steps.lint-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py


  verify:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && 'dyna-large' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && 50 || 45 }}
