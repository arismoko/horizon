  # compiles. Formatting alone never blocks a merge (room rule); lint repeats it on the heavy runs.
  format:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check repository artifacts and workflow YAML
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Install rustfmt on the pinned Rust
        run: bash tools/ci/rustup_install.sh --profile minimal --component rustfmt
      - name: Check formatting
        run: |
          python3 tools/ci/format_scan.py
          (cd launcher && cargo fmt --check)

  verify-static:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    # A contributor's pull request gets GitHub's runners: these checks compile nothing heavy, and
    # its only two checks must not depend on a paid pool's balance.
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && 'ubuntu-latest' || needs.changes.outputs.trusted != 'true' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && 'dyna-large' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 20 || 45 }}
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      # With Vulkan hidden, a runner with Mesa's GL software adapter (boat's image) would still run the GPU tests,
      # on GL, and fail (#2841); Vulkan only leaves every runner with no adapter, so GPU tests skip here everywhere.
      WGPU_BACKEND: vulkan
      RUNNER_KIND: ${{ needs.changes.outputs.trusted != 'true' && 'github' || needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        id: checkout
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      # Public-tree ranges and file-size ancestry need full history of this exact commit,
      # not every branch and tag. The Rust job only needs its checkout's HEAD and tracked files.
      - name: Fetch this commit's history
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history
        run: |
          for attempt in 1 2; do
            if [ "$(git rev-parse --is-shallow-repository)" = false ]; then exit 0; fi
            if timeout --kill-after=10s 300s git fetch -q --no-tags --unshallow origin "$(git rev-parse HEAD)"; then exit 0; fi
            echo "$FETCH_STEP: GitHub fetch attempt $attempt failed or timed out."
