      - name: Report the mod API surface change
        id: report_the_mod_api_surface_change
        # What this pull request changes in what mods can name, in the job summary: the head's horizon-stage exports
        # the merge base and this tree, then classifies the diff (tools/ci/surface_report.py). A report, not a gate:
        # it fails only when this tree cannot be exported, for a stale or unreadable new change note, or, with
        # tools/ci/surface.toml's gate on, for a breaking change no note declares.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false' && (github.event_name == 'pull_request' || inputs.pr != '')) && steps.stage.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/surface_report.py
      - name: Validate prebuilt source stage and listed slots
        id: validate_prebuilt_source_stage_and_listed_slots
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') && steps.stage.outcome == 'success' }}
        run: python3 tools/ci/test_stage_catalog.py -v
      - name: Test Rust documentation examples
        id: test_rust_documentation_examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: cargo test $JOBS --no-fail-fast --profile test --workspace --doc
      - name: No Rust work selected
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'No Rust work selected; static checks report independently.'
      - name: Report test compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
