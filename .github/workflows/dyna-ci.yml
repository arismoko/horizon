          for toolchain in "${DYNA_CI_BUILD:-/build}"/rustup/toolchains/*/; do
            [ -f "$toolchain/lib/rustlib/components" ] || continue
            echo "build-folder toolchain $(basename "$toolchain"): $(sed 's/-x86_64.*//;s/-aarch64.*//' "$toolchain/lib/rustlib/components" | sort -u | tr '\n' ' ')"
