          python-version: '3.12'
      # What the slot's build folder holds before this job writes anything: Dyna mounts /build per slot for
      # reuse across jobs, and an empty one means a cold build (no target, no registry, no toolchain).
      - name: Report what the build folder holds at job start
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        # A report only: an unreadable folder or a failed du/find/findmnt never fails the job.
        continue-on-error: true
        run: |
          # RUSTUP_HOME is set by a later step (tools/ci/dyna_ci_deps.sh): read its folder directly.
