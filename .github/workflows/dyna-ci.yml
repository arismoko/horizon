        run: python3 tools/ci/run_test_binaries.py --jobs 3 --time-limits 2,5 -- cargo test $JOBS --profile test --workspace --lib --bins --tests
      # Prepared-data content-root tests stay in the existing client-lib data leg.
      # Running them again here without the data only rebuilds targets before they return early.
      # One genuine pinned export also validates source staging and listed slots.
      # Outside tests/ discovery: the later offline suite must not stage it again.
      # Keep this before doc tests so their failures cannot hide stale slots.
      - name: Build the source stage generator (test profile)
        id: stage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: |
          started=$SECONDS
          cargo build $JOBS --locked --profile test -p horizon-mod-api-gen --bin horizon-stage --message-format=json-render-diagnostics > "$RUNNER_TEMP/stage-artifacts.jsonl"
          echo "Stage generator build: $((SECONDS - started))s"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = [json.loads(line) for line in Path(os.environ["RUNNER_TEMP"], "stage-artifacts.jsonl").read_text().splitlines()]
          executables = {item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "horizon-stage"
                         and "bin" in item["target"]["kind"]
                         and not item["profile"]["test"] and item.get("executable")}
          if len(executables) != 1:
              raise SystemExit(f"expected one normal horizon-stage executable, got {executables}")
          executable = str(Path(executables.pop()).resolve(strict=True))
          if "\r" in executable or "\n" in executable:
              raise SystemExit("horizon-stage executable path must not contain CR or LF")
