        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The checkout is the pull request merged into main as it is now: measure the merge against that main, so
        # main's own growth since the branch's base (a sync's) is never charged to the pull request.
        run: python3 tools/check_file_size.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # Fixed conflict hotspots stay fixed: no SUMMARY.md line for a discovered book page, at most 5 launcher
      # language files outside a rollup or sync, no growth of hooks/notes.rs. Measured against the base as above.
      # The branch name counts only from this repository: a fork could name its branch like a rollup.
      - name: Fixed hotspots stay fixed
        id: fixed_hotspots_stay_fixed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ needs.changes.outputs.trusted == 'true' && github.head_ref || '' }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: python3 tools/hotspots/check_guards.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge} --branch "$BRANCH" --labels "$LABELS"
      # horizon-mod-wasm-wire-loopback's build.rs declares tests/wire_loopback/*.rs: its root gains no module line and no test.
      - name: wire_loopback root does not grow
        id: wire_loopback_root_does_not_grow
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/hotspots/check_wire_loopback.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      - name: Vocabulary state has explicit ownership
        id: vocabulary_state_has_explicit_ownership
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/check_mod_vocabulary_state.py
      # One file per topic in tools/ci/ignored-tests/: well-formed rows, each test in one file, nothing else in the
      # folder, no file at the retired single-list path.
      - name: Ignored-test policy files read cleanly
        id: ignored_test_policy_files_read_cleanly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_ignored_test_rows.py
      # The unit tier: a test that boots the game is #[ignore = "daily"]; the fixtures are in tools/ci/game-boot-fixtures.txt.
      - name: Game-boot tests are daily tests
        id: game_boot_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_game_boot_tests.py
      # The unit tier: a test that starts a child process is #[ignore = "daily"]; helpers in tools/ci/process-spawns.txt.
      - name: Process-starting tests are daily tests
        id: process_starting_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_process_tests.py
      # A test that reruns its own test executable by --exact must select it ignored or not, or a daily one checks nothing.
      - name: Test reruns select ignored tests too
        id: test_reruns_select_ignored_tests_too
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/reexec_include_ignored.py --check
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        id: crates_follow_the_layers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_layers.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # tools/hotspots/README.md: a `pub use` brace list under the vocabulary's exports/ names at most 12 items, so two
      # PRs adding names don't conflict on rustfmt's re-wrap; today's longer lists only shrink.
      - name: Export lists stay short
        id: export_lists_stay_short
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_lists.py
      # tools/hotspots/check_stand_ins.py: hand-written stand-ins of the dispatch tests and the wire loopback keep up
      # with the hooks and vocabulary traits they mirror, on the member PR itself instead of in a rollup's build.
      - name: Test stand-ins keep up with the API
        id: test_stand_ins_keep_up_with_the_api
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_stand_ins.py
      # Independent of the Rust job and earlier check results; require successful setup:
      # compiler fixtures after failed setup would add a second, misleading failure.
      - name: Python tests of the repository's tools
        id: python_tests_of_the_repository_s_tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tests -v --durations=25
      - name: Python tests of prepared-data tooling
        id: prepared_tooling_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tools/ci -p 'test_prepared_*.py' -v
      # The mod-host map's tables (#2534), built on main's pushes instead of committed, so no PR has to regenerate
      # them: docs/layering/mod-host-map.md points here. Main pushes only, never pull requests; about 17 s of Python
      # measured locally, no build.
      - name: Build the mod-host map tables
        id: mod_host_map
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'push' }}
        run: python3 tools/layering/scan_engine_mod_edges.py --map target/layering/mod-host-map-tables.md
      - name: Upload the mod-host map tables
        id: mod_host_map_upload
        if: ${{ !cancelled() && github.event_name == 'push' && steps.mod_host_map.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mod-host-map
          path: target/layering/mod-host-map-tables.md
          if-no-files-found: error
      - name: Report optional mod-host map upload failure
        if: ${{ !cancelled() && steps.mod_host_map_upload.outcome == 'failure' }}
        run: |
          echo '::warning::Optional mod-host-map artifact upload failed; inspect the upload step for details.'
          echo '### Optional mod-host-map artifact unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'The upload failed. Map generation remains a required step; the optional download is unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py

  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    needs: changes
    if: needs.changes.outputs.launcher_required != 'false' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.launcher_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers GPUI links against
        if: needs.changes.outputs.launcher_required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.launcher_required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check launcher formatting
        id: check_launcher_formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo fmt --check
      - name: Lint launcher
        id: lint_launcher
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo clippy $JOBS --keep-going --all-targets --locked -- -D warnings
      - name: Test launcher library and binaries
        id: test_launcher_library_and_binaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --locked --lib --bins
      - name: Test launcher storage
        id: test_launcher_storage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --locked --test storage
      - name: Build launcher runtime holder test actor
        id: build_launcher_runtime_holder_test_actor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: python3 ../tools/ci/ignored_shards.py --prepare horizon-mod-package $JOBS
      - name: Test launcher runtime package
        id: test_launcher_runtime_package
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build_launcher_runtime_holder_test_actor.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --manifest-path ../Cargo.toml --locked -p horizon-mod-package --features runtime-process --lib
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py

  # A dispatch with `pr`: posts the heavy jobs' results on that pull request's head. It runs none of its code, so it
  # alone holds the write permission, and only for commit statuses.
  pr-status:
    needs: [changes, lint, verify, verify-static, launcher]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.changes.outputs.pr_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.changes.outputs.pr_sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          states = {"success": "success", "skipped": "success", "failure": "failure", "cancelled": "error"}
          for job in ("lint", "verify", "verify-static", "launcher"):
              result = json.loads(os.environ["RESULTS"])[job]["result"]
              subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['SHA']}",
                              "-f", f"state={states.get(result, 'error')}", "-f", f"context=dispatched/{job}",
                              "-f", f"description=dyna-checks dispatched on this head: {result}",
                              "-f", f"target_url={os.environ['RUN']}"], check=True)
          PY

  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  prepared-output-check:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare-output-check && github.repository == 'arismoko/horizon'
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Check prepared output digest
        run: |
          # Never reuse a completed preparation for this diagnostic, including a retry.
          for attempt in 1 2; do
            HORIZON_PREPARE_KEY="${GITHUB_SHA:0:16}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              HORIZON_PREPARE_EXPORT_DIGEST="$RUNNER_TEMP/export.digest" \
              HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
            exported=$(cat "$RUNNER_TEMP/export.digest")
            actual=$(python3 tools/prepare_output.py digest 2>/dev/null) || { echo "::error::prepared output digest unavailable"; exit 1; }
            { echo "fresh export $attempt: $exported"; echo "seeded export $attempt: $actual"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          set +e
          python3 tools/prepare_output.py check > "$RUNNER_TEMP/output-check.log" 2>&1
          result=$?
          set -e
          expected=$(awk '!/^#/ && NF == 2 { value=$2 } END { print value }' crates/horizon-prepare/output-versions.txt)
          { echo "prepared output check: $([ "$result" -eq 0 ] && echo pass || echo fail)"; echo "actual: $actual"; echo "expected: $expected"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"

  vanilla-parity:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'workflow_dispatch' && !inputs.prepare-output-check && !inputs.github-fallback && !inputs.pr
    runs-on: dyna-large
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Use system Python for parity harnesses
        run: |
          mkdir -p "$DYNA_CI_BUILD/bin"
          ln -sf "$GITHUB_WORKSPACE/tools/ci/dyna_parity_python.sh" "$DYNA_CI_BUILD/bin/python"
          echo "$DYNA_CI_BUILD/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Set up disk-backed parity scratch and prepared vanilla data
        run: |
          rm -rf "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          mkdir -p "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          ln -s "$DYNA_CI_BUILD/parity-out" .local
          echo "TMPDIR=$DYNA_CI_BUILD/parity-tmp" >> "$GITHUB_ENV"
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      # Harness subprocess timeouts can be shorter than a cold release build. Match their build commands and target dir.
      - name: Build parity probes
        run: |
          cargo build --release --bin horizon-parity
          cargo build --release --bin horizon-tick-parity
          cargo build --release --bin horizon-geometry-parity
          cargo build --release --bin horizon-noise-parity
          cargo build --release --bin horizon-density-parity
          cargo build --release --bin horizon-worldgen-parity
