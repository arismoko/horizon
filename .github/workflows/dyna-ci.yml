      # generator's, the client library's, no_wire_registration) took most of this step while the runner idled.
      # Three, not more: the job's memory.peak counts the build and page cache, so it says nothing about this
      # step; the runner prints each binary's max RSS and the largest five, which sizes any later change.
      # Every binary still runs every test, from its package directory; any failure fails the step, and the
      # step ends with the failing binaries and test names.
      - name: Test Rust core and voxel kernel correctness
