      # cgroup holds (anon: processes; file: page cache; shmem: the tmpfs checkout and /tmp).
      - name: Memory after the test build
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        continue-on-error: true
        run: |
          echo "memory.max $(cat /sys/fs/cgroup/memory.max) memory.peak $(cat /sys/fs/cgroup/memory.peak)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^oom_kill ' /sys/fs/cgroup/memory.events | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E '^(anon|file|shmem|file_dirty|file_writeback) ' /sys/fs/cgroup/memory.stat | tee -a "$GITHUB_STEP_SUMMARY"
      # What bounds the build: the slowest compile units, from the report --timings writes.
      - name: Slowest compile units
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' }}
        continue-on-error: true
        run: |
          python3 tools/ci/cargo_timings.py target/cargo-timings/cargo-timing.html | tee -a "$GITHUB_STEP_SUMMARY"
      # Binaries run normally, three at a time, under the inet/resolver preload guard. Only a binary
      # recording a violation is rerun per test to name culprits, even if they swallow the refusal.
      # The guard library is built here only; the daily run does not preload it. Unix sockets remain available.
      - name: Test Rust core and voxel kernel correctness
        id: test_rust_core_and_voxel_kernel_correctness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') && steps.core_build.outcome == 'success' }}
        run: |
          cc -shared -fPIC -O2 -Wall -Wextra -Werror tools/ci/network_guard.c -o target/network_guard.so
          python3 tools/ci/run_test_binaries.py --jobs 3 --time-limits 2,5 --network-guard target/network_guard.so --no-data-skips -- cargo test $JOBS --profile test --workspace --lib --bins --tests
      # Prepared-data content-root tests stay in the existing client-lib data leg.
      # Running them again here without the data only rebuilds targets before they return early.
      # The surface report's tool. The staging pass itself is proven on a clean checkout by the SDK's Linux leg in
      # the daily run (prebuilt-game-build.yml, tools/ci/test_stage_catalog.py), not here: it takes minutes.
      - name: Build the source stage generator (test profile)
        id: stage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false' && (github.event_name == 'pull_request' || inputs.pr != '')) }}
        run: python3 tools/ci/surface_report.py --build-tool
      - name: Report the mod API surface change
        id: report_the_mod_api_surface_change
        # Each tree's own sunrise-stage exports its stable API; the head's tool reads both engine catalogs and
        # classifies the diff in the job summary. The report fails if either surface cannot be exported or compared,
        # for a stale or unreadable new change note, and, with tools/ci/surface.toml's gate on, for a breaking change
        # no new note declares.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false' && (github.event_name == 'pull_request' || inputs.pr != '')) && steps.stage.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
        run: python3 tools/ci/surface_report.py
      - name: Test Rust documentation examples
        id: test_rust_documentation_examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: cargo test $JOBS --no-fail-fast --profile test --workspace --doc
      - name: No Rust work selected
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'No Rust work selected; static checks report independently.'
      - name: Report test compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: |
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Peak includes page cache; oom_kill records OOM kills, anon is only end-of-job residue.
          grep usage_usec /sys/fs/cgroup/cpu.stat || true
          echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          grep '^oom_kill ' /sys/fs/cgroup/memory.events 2>/dev/null || echo "oom_kill unavailable"
          awk '/^anon / {print "anon at job end", $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo "anon at job end unavailable"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py


  # Source checks and isolated compiler fixtures, never a second game build or game target cache.
  # A contributor's pull request gets this instead of lint: the same repository checks and formatting, nothing that
  # compiles. Formatting alone never blocks a merge (room rule); lint repeats it on the heavy runs.
  format:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.heavy == 'false'
    # Only pull requests outside the gate run it, so it is never a gate job: GitHub's runner, leaving Dyna's to gates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check repository artifacts and workflow YAML
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/check_api_boundary.py --source-only
      # A change with no Rust in it (tools/ci/rust_changes.py) has nothing to format.
      - name: Install rustfmt on the pinned Rust
        if: needs.changes.outputs.rust_required != 'false'
        env:
          DYNA: ${{ runner.environment != 'github-hosted' }}
        run: |
          if [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt
      - name: Check formatting
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          python3 tools/ci/format_scan.py

  verify-static:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    # A contributor's pull request gets GitHub's runners: these checks compile nothing heavy, and
    # its only two checks must not depend on a paid pool's balance.
    # A pull request outside the gate: GitHub's runner, never a paid pool or our own (it gates nothing).
    # On our pool, dyna-medium: the work is serial Python, git and small fixture compiles, which GitHub's 4-CPU runner
    # finishes in 8 to 11 minutes, so eight CPUs only took a large slot from the gate's compiling jobs.
    runs-on: ${{ needs.changes.outputs.heavy == 'false' && 'ubuntu-latest' || needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna-small' || 'ubuntu-latest') || needs.changes.outputs.trusted != 'true' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playsunrise-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 20 || 45 }}
    # Use verify's hidden-GPU environment so a stray plain GPU test fails instead of silently skipping.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      WGPU_BACKEND: vulkan
      SUNRISE_GPU_TESTS_REQUIRE_ADAPTER: '1'
      RUNNER_KIND: ${{ needs.changes.outputs.heavy == 'false' && 'github' || needs.changes.outputs.trusted != 'true' && 'github' || needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        id: checkout
        with:
          # A dispatch with `pr`: that pull request's test merge with its base, as a pull_request run checks out;
          # otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_merge }}
      # Public-tree ranges and sync ancestry need full history of this exact commit,
      # not every branch and tag. The Rust job only needs its checkout's HEAD and tracked files.
      - name: Fetch this commit's history
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history
          # A pull request's checks read commits and trees (the range's paths, merge bases, ancestry) and only a few
          # files' contents, which Git then fetches one by one: a pull request off our pool takes the history without
          # file contents. Main's pushes (--history), and our pool with the host's history mirror, take all of it.
          HISTORY_FILTER: ${{ github.event_name == 'pull_request' && env.RUNNER_KIND != 'dyna' && 'blob:none' || '' }}
        # On our runners the host's shared history mirror makes this a short fetch (tools/ci/history_fetch.sh).
        run: bash tools/ci/history_fetch.sh
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # Offline tooling compiles tiny standalone fixtures even when no game Rust changed.
      # Install their tools explicitly rather than making missing compilers turn cases into skips.
      # Dyna's image has no Cargo, and checks that always run need it (the ignored-test inventory builds
      # sunrise-game-discovery; a main push's mod-host map reads `cargo metadata`), so it installs there even when
      # neither is selected, as on a main push whose tree already passed the gate (tools/ci/gate_reuse.py).
      - name: Install Rust tools for isolated tooling fixtures
        if: needs.changes.outputs.rust_required != 'false' || needs.changes.outputs.tooling_required != 'false' || env.RUNNER_KIND == 'dyna'
        env:
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # Dyna's runner builds in its persistent target (CARGO_TARGET_DIR) here too: the ignored-test inventory builds
      # sunrise-game-discovery and its path dependencies (sunrise-mod-surface among them). Without the snapshot, a
      # build of this tree left artifacts that a later job of another tree judged fresh (R55's verify, 2026-11-19).
      - name: Restore unchanged source timestamps
        if: env.RUNNER_KIND == 'dyna'
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check generated extension tag catalog
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/surface_extension_tags.py --check
      # The launcher's copies of game crates move only when the pull request says which copy must follow.
      - name: Launcher mirrors
        id: launcher_mirrors
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 tools/ci/check_launcher_mirrors.py --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH"
          else
            python3 tools/ci/check_launcher_mirrors.py
          fi
      - name: Check native hook wiring
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' }}
        run: bash tools/ci/check_hook_wiring.sh
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        id: keep_game_artifacts_out_of_git
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 tools/check_public_tree.py --history
          fi
      - name: Check duplicate public native functions
        id: check_duplicate_public_native_functions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/sync_upstream.py --check
      # docs/layers.md#built-in-addresses: every built-in outside address in the Sunrise layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        id: built_in_addresses_stay_in_their_home
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_addresses.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # Fixed conflict hotspots stay fixed: no SUMMARY.md line for a discovered book page, no growth of hooks/notes.rs.
      # Measured against the base as above.
      - name: Fixed hotspots stay fixed
        id: fixed_hotspots_stay_fixed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/hotspots/check_guards.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      - name: Vocabulary state has explicit ownership
        id: vocabulary_state_has_explicit_ownership
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/check_mod_vocabulary_state.py
      - name: Gameplay crates follow layer rules
        id: gameplay_crates_follow_layer_rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_gameplay_layers.py
      # One file per topic in tools/ci/ignored-tests/: well-formed rows, each test in one file, nothing else in the
      # folder, no file at the retired single-list path.
      - name: Ignored-test policy files read cleanly
        id: ignored_test_policy_files_read_cleanly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_ignored_test_rows.py
      # Modules are plain mod items: a file under a crate's src/ that nothing declares is never compiled.
      - name: Every crate source file is compiled
        id: every_crate_source_file_is_compiled
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_unreached_sources.py
      # tools/port_map/: a row that names a Sunrise function still finds it, or is listed in
      # tools/ci/port_map_known_stale.txt, which only shrinks (tools/ci/check_port_map_paths.py).
      - name: Port-map rows find their function
        id: port_map_rows_find_their_function
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_port_map_paths.py ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Fetch locked Cargo dependencies for the vanilla build check
        id: extras_fetch
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' && needs.changes.outputs.rust_required != 'false' }}
        run: cargo fetch --locked --target host-tuple
      - name: The vanilla build reuses the default build's dependencies
        id: extras_features
        if: ${{ !cancelled() && steps.extras_fetch.outcome == 'success' }}
        run: python3 tools/ci/check_extras_features.py
      # The unit tier: a test that boots the game is #[ignore = "daily"]; the fixtures are in tools/ci/game-boot-fixtures.txt.
      - name: Game-boot tests are daily tests
        id: game_boot_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_game_boot_tests.py
      # The unit tier: a test that starts a child process is #[ignore = "daily"]; helpers in tools/ci/process-spawns.txt.
      - name: Process-starting tests are daily tests
        id: process_starting_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_process_tests.py
      # Its one rustc outgrew the 16 GiB parity runner (#4896): a harness runs a fixture from lab.parity_fixtures().
      - name: Parity harnesses do not build the client lib test
        id: parity_harnesses_do_not_build_the_client_lib_test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_parity_harness_builds.py
      # A test that reruns its own test executable by --exact must select it ignored or not, or a daily one checks nothing.
      - name: Test reruns select ignored tests too
        id: test_reruns_select_ignored_tests_too
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/reexec_include_ignored.py --check
      # The nested workspaces (telemetry server, registry and probes) take game crates by path: a crate that
      # gains a dependency must refresh their own Cargo.lock too, or their --locked builds refuse after merge.
      - name: Nested workspaces' lockfiles are current
        id: nested_workspaces_lockfiles_are_current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/ci/check_nested_locks.py
      # Frame hooks run with Game::renderer taken out (sunrise#5858): their files reach the GPU through Game::mod_gpu().
      - name: Frame-hook files do not read the renderer
        id: frame_hook_files_do_not_read_the_renderer
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_mod_gpu_access.py
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        id: crates_follow_the_layers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_layers.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # tools/hotspots/README.md: a `pub use` brace list under the vocabulary's exports/ names at most 12 items, so two
      # PRs adding names don't conflict on rustfmt's re-wrap; today's longer lists only shrink.
      - name: Export lists stay short
        id: export_lists_stay_short
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_lists.py
      # tools/hotspots/check_stand_ins.py: hand-written stand-ins of the dispatch tests keep up
      # with the hooks they mirror, on the member PR itself instead of in a rollup's build.
      - name: Test stand-ins keep up with the API
        id: test_stand_ins_keep_up_with_the_api
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_stand_ins.py
      # Independent of the Rust job and earlier check results; require successful setup:
      # compiler fixtures after failed setup would add a second, misleading failure.
      - name: Python tests of the repository's tools
        id: python_tests_of_the_repository_s_tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tests -v --durations=25
      - name: Python tests of prepared-data tooling
        id: prepared_tooling_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tools/ci -p 'test_prepared_*.py' -v
      # The mod-host map's tables (#2534), built on main's pushes instead of committed, so no PR has to regenerate
      # them: docs/layering/mod-host-map.md points here. Main pushes only, never pull requests; about 17 s of Python
      # measured locally, no build.
      - name: Build the mod-host map tables
        id: mod_host_map
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'push' }}
        run: python3 tools/layering/scan_engine_mod_edges.py --map target/layering/mod-host-map-tables.md
      - name: Upload the mod-host map tables
        id: mod_host_map_upload
        if: ${{ !cancelled() && github.event_name == 'push' && steps.mod_host_map.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mod-host-map
          path: target/layering/mod-host-map-tables.md
          if-no-files-found: error
      - name: Report optional mod-host map upload failure
        if: ${{ !cancelled() && steps.mod_host_map_upload.outcome == 'failure' }}
        run: |
          echo '::warning::Optional mod-host-map artifact upload failed; inspect the upload step for details.'
          echo '### Optional mod-host-map artifact unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'The upload failed. Map generation remains a required step; the optional download is unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py

  # A dispatch with `pr`: posts the heavy jobs' results on that pull request's head. It runs none of its code, so it
  # alone holds the write permission, and only for commit statuses.
  pr-status:
    needs: [changes, lint, verify, verify-static]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.changes.outputs.pr_sha != ''
    # Five seconds of status posts after the gate: nothing waits on it, so it takes none of Dyna's counted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Plain Python against the API: Dyna's runner image has no GitHub CLI.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.changes.outputs.pr_sha }}
          MERGE: ${{ needs.changes.outputs.pr_merge }}
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          states = {"success": "success", "skipped": "success", "failure": "failure", "cancelled": "error"}
          for job in ("lint", "verify", "verify-static"):
              result = json.loads(os.environ["RESULTS"])[job]["result"]
              body = {"state": states.get(result, "error"), "context": f"dispatched/{job}",
                      "description": f"{result} on test merge {os.environ['MERGE']}", "target_url": os.environ["RUN"]}
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['SHA']}",
                  data=json.dumps(body).encode(), method="POST",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=20):
                  pass
          PY

  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  prepared-output-check:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare-output-check && github.repository == 'sunrise-org/sunrise'
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Check prepared output digest
        run: |
          # Never reuse a completed preparation for this diagnostic, including a retry.
          for attempt in 1 2; do
            SUNRISE_PREPARE_KEY="${GITHUB_SHA:0:16}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              SUNRISE_PREPARE_EXPORT_DIGEST="$RUNNER_TEMP/export.digest" \
              SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
            exported=$(cat "$RUNNER_TEMP/export.digest")
            actual=$(python3 tools/prepare_output.py digest 2>/dev/null) || { echo "::error::prepared output digest unavailable"; exit 1; }
            { echo "fresh export $attempt: $exported"; echo "seeded export $attempt: $actual"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          set +e
          python3 tools/prepare_output.py check > "$RUNNER_TEMP/output-check.log" 2>&1
          result=$?
          set -e
          expected=$(awk '!/^#/ && NF == 2 { value=$2 } END { print value }' crates/sunrise-prepare/output-versions.txt)
          { echo "prepared output check: $([ "$result" -eq 0 ] && echo pass || echo fail)"; echo "actual: $actual"; echo "expected: $expected"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"
