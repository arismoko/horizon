            if [ ! -d "$dir" ]; then echo "build-folder $dir: absent"; continue; fi
            files=$(du -s --inodes "$dir" 2>/dev/null | cut -f1 || true)
            size=$(du -sh "$dir" 2>/dev/null | cut -f1 || true)
            oldest=$(find "$dir" -maxdepth 2 -printf '%TY-%Tm-%TdT%TH:%TM\n' 2>/dev/null | sort | sed -n '1p' || true)
            mount=$(findmnt -n -o SOURCE,TARGET -T "$dir" 2>/dev/null | sed -n '1p' || true)
            echo "build-folder $dir: entries=${files:-?} size=${size:-?} oldest=${oldest:-none} mount=${mount:-?}"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          # Size against this host's cap (tools/ci/dyna-slot-caps.txt): over it, Dyna empties target/ before the next job.
          host=$(sed -n 's/^dyna-ci-\(.*\)-[0-9a-f]\{8\}$/\1/p' <<< "${RUNNER_NAME:-}")
          cap=$(awk -v h="$host" '$1 == h {print $2}' tools/ci/dyna-slot-caps.txt 2>/dev/null || true)
          used=$(du -s --block-size=1G "${DYNA_CI_BUILD:-/build}" 2>/dev/null | cut -f1 || true)
          echo "build-folder cap: host=${host:-?} size=${used:-?} GiB cap=${cap:-80} GiB" | tee -a "$GITHUB_STEP_SUMMARY"
          # What takes the room, toward that cap.
          du -sh "${DYNA_CI_BUILD:-/build}"/* "${CARGO_TARGET_DIR:-/nonexistent}"/* 2>/dev/null | sort -rh | sed -n '1,12p' | sed 's/^/build-folder part /' | tee -a "$GITHUB_STEP_SUMMARY" || true
