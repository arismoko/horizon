name: dyna-checks
# What the run tests, readable in the run list: a dispatch with `pr` runs on ref main but tests that pull request's
# test merge with its base, so it is named for it and never read as main's CI; the prepared-output dispatch likewise.
run-name: "${{ inputs.pr && format('PR #{0} gate', inputs.pr) || inputs.prepare-output-check && 'prepared output check' || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
# A contributor's pull request (its head in a fork) gets the cheap checks (verify-static, format); the heavy ones
# (everything that compiles) run on main's pushes, dispatches, and same-repository rollup or sync pull requests
# (tools/ci/pr_gate.py, docs/ci-runners.md).
# Keep upstream's workflows byte-identical; disable checks (ci.yml) in the fork's Actions
# settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher and the churn report; the dispatched run uses Dyna.
on:
  push:
    # release/26.3 too: a break-glass patch release needs the gate passed on a push of its exact commit
    # (release_train.break_glass_problems).
    branches: [main, release/26.3]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      github-fallback:
        description: Force GitHub-hosted runners after a boat runner outage
        type: boolean
        default: false
      prepare-output-check:
        description: Check the prepared output digest
        type: boolean
        default: false
      pr:
        description: Run the heavy checks on this pull request's test merge with its base (a fork's too) and post them on its head
        type: string
        default: ''
defaults:
  run:
    shell: bash

permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks, and a new push to main replaces main's: only the newest
  # main head needs a gate, and a burst of merges otherwise held a Dyna runner per job of every merge's run, ahead
  # of the rollup gates queued behind them. None of its jobs publishes or writes shared state.
  # A dispatch for a pull request (`pr`) is grouped by that pull request, never by main's head; any other dispatch
  # (for a Dev build) by its commit, and it always finishes.
  # A main push run started again (a later attempt) is a release's gate: release.yml re-runs a commit's gate that the
  # next push cancelled before it publishes that commit (tools/release_train.py gate_again). It is grouped by its
  # commit and always finishes.
  group: dyna-checks-${{ github.event.pull_request.number || inputs.pr && format('pr-{0}', inputs.pr) || github.event_name == 'push' && github.run_attempt == '1' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.run_attempt == '1' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  SUNRISE_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'sunrise-org/sunrise' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  # A draft pull request skips every check below (they all need this job); it runs when marked ready.
  changes:
    if: github.event_name != 'schedule' && !inputs.prepare-output-check && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Dyna's small runner for a gate (main, dispatches, this repository's rollups and syncs: the pull requests
    # pr_gate.py marks heavy, and checks in ci.yml skips) while the repository's switch is on, so the gate never queues
    # on GitHub's runners. Every other pull request runs this workflow on GitHub's runners, beside checks: nothing
    # gates on it, and Dyna's runners are counted (16 on the host), so they are kept for the gates. A forced fallback
    # stays on GitHub's. The routing below still reads the lease.
    runs-on: >-
      ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && !inputs.github-fallback && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository && (
      startsWith(github.head_ref, 'sunrise-review-rollup-') || startsWith(github.head_ref, 'fork-review-rollup-') ||
      startsWith(github.head_ref, 'rollup-') || startsWith(github.head_ref, 'sync-') ||
      startsWith(github.head_ref, 'sync/upstream-') ||
      contains(github.event.pull_request.labels.*.name, 'rollup') || contains(github.event.pull_request.labels.*.name, 'sync'))) &&
      'dyna-small' || 'ubuntu-latest' }}
    # Selection normally finishes in seconds; allow the file list and two bounded history fetches.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # Whether the heavy jobs run (tools/ci/pr_gate.py); a dispatch with `pr` runs them on that pull request's test
      # merge with its base, and reports them on its head (`pr_sha`).
      heavy: ${{ steps.gate.outputs.heavy == 'false' && 'false' || 'true' }}
      pr_sha: ${{ steps.gate.outputs.pr_sha }}
      pr_merge: ${{ steps.gate.outputs.pr_merge }}
      # Whether this run's code may use our own runners: never a fork's pull request, dispatched or not.
      trusted: ${{ steps.gate.outputs.trusted || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false') }}
      # Off where selection needs none, and on a main push whose tree its merged head's pull_request run already
      # passed (tools/ci/gate_reuse.py): the jobs then run only what doesn't depend on them, on the small runner.
      rust_required: ${{ steps.reuse.outputs.reused == 'true' && 'false' || steps.selection.outputs.rust_required || 'true' }}
      tooling_required: ${{ steps.reuse.outputs.reused == 'true' && 'false' || steps.selection.outputs.tooling_required || 'true' }}
      reused_run: ${{ steps.reuse.outputs.run }}
      # Only a gate (heavy) uses Dyna's runners; a pull request outside it runs where a pool-down run would.
      self_hosted: ${{ steps.gate.outputs.heavy == 'true' && !inputs.github-fallback && steps.hosted.outputs.forced_github != 'true' && steps.runner.outputs.self_hosted || 'false' }}
      # Where lint and verify run when they don't go to Dyna's pool: boat-large for listed outside contributors
      # while vars.BOAT_CI is on (boat refuses a public repository's run unless both its author and the user who
      # started it are on boat's own list, so the same list lives in vars.BOAT_CI_USERS), else GitHub's runner.
      hosted_label: ${{ steps.hosted.outputs.label }}
      forced_github: ${{ steps.hosted.outputs.forced_github }}
    steps:
      - uses: actions/checkout@v4
      # Dyna's runner image has no GitHub CLI; GitHub's runners do.
      - name: GitHub CLI
        run: bash tools/ci/ensure_gh.sh
      - name: Heavy checks for this event
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ inputs.pr }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/ci/pr_gate.py >> "$GITHUB_OUTPUT"
      # Only an ordinary pull request narrows its checks: a rollup or sync (heavy, tools/ci/pr_gate.py) skips the
      # three selection steps, so its outputs stay 'true' and it takes the full gate, as main's pushes do.
      # The pull request's files from the API for this run's base and head, exactly as the history's diff lists them,
      # or listed=false whenever they might differ (tools/ci/pr_files.py); then the history is fetched as before.
      - name: List this pull request's files
        if: github.event_name == 'pull_request' && steps.gate.outputs.heavy == 'false'
        id: files
        timeout-minutes: 2
        # A list that can't be read in time is only a fallback to the history, never a failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: python3 tools/ci/pr_files.py "$RUNNER_TEMP/pr-files" >> "$GITHUB_OUTPUT"
      - name: Fetch this commit's history for selection
        if: github.event_name == 'pull_request' && steps.gate.outputs.heavy == 'false' && steps.files.outputs.listed != 'true'
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history for selection
          # Selection diffs the base against the head (their merge base and two trees), so it takes the commits
          # alone, and Git fetches the trees the diff reads. The whole history took 80 to 220 s on a slot whose
          # mirror was cold, and every gate job waits for this one.
          HISTORY_FILTER: tree:0
        run: bash tools/ci/history_fetch.sh
      - name: Select checks once for this pull request
        if: github.event_name == 'pull_request' && steps.gate.outputs.heavy == 'false'
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FILES: ${{ steps.files.outputs.listed == 'true' && format('{0}/pr-files', runner.temp) || '' }}
          # The records pr_files.py wrote: a listing that lost one selects everything.
          ENTRIES: ${{ steps.files.outputs.entries }}
        run: python3 tools/ci/rust_changes.py --all ${FILES:+--files "$FILES" --entries "$ENTRIES"} "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Best-effort: any failure leaves `reused` unset, and the push runs the whole gate.
      - name: Reuse the merged head's passed gate
        if: github.event_name == 'push'
        id: reuse
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/gate_reuse.py >> "$GITHUB_OUTPUT"
      # workflow_run omits pull_requests for fork runs. Record only immutable IDs;
      # the trusted controller reads this as bounded data, never as executable code.
      - name: Record the original PR base for boat recovery
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('boat-base.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': '1',
              'base': event['pull_request']['base']['sha'],
              'head': event['pull_request']['head']['sha'],
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          name: boat-base-1
          path: boat-base.json
          retention-days: 2
      # The pool's switch and lease (tools/ci/dyna_ci_route.sh): live when readable, else the attempt's snapshot judged
      # at the attempt's creation or start and for an hour after it. Fork pull requests remain on GitHub's runners.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ steps.gate.outputs.trusted || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: bash tools/ci/dyna_ci_route.sh >> "$GITHUB_OUTPUT"
      - id: hosted
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a fork's pull request: boat_health.py then reads what boat-recovery published.
          BOAT_CI: ${{ vars.BOAT_CI }}
          BOAT_FALLBACK: ${{ inputs.github-fallback && 'true' || 'false' }}
          BOAT_USERS: ${{ vars.BOAT_CI_USERS }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          ACTOR: ${{ github.triggering_actor }}
        run: python3 tools/ci/boat_health.py

  # Fork PR tokens cannot dispatch or cancel runs. The trusted default-branch
  # boat-recovery workflow cancels/reruns outages; changes reads the previous attempt.
  # Same-run fallback jobs would leave the original queued checks pending, not green.
  boat-watch:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.hosted_label == 'boat-large' && needs.changes.outputs.self_hosted != 'true' && needs.changes.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 tools/ci/boat_watch.py

  # The conflict-hotspot churn report (tools/hotspots/README.md), on the nightly schedule only, on GitHub's runner:
  # replays the last 3 days of merges with `git merge-tree` (git 2.38 or newer) and rewrites one issue. No build.
  # Never a gate: the job and each step continue on error, so a failure or a timeout never fails the run.
  churn-report:
    if: github.repository == 'sunrise-org/sunrise' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request heads and upstream's main
        id: fetch
        continue-on-error: true
        run: |
          git fetch -q --no-tags origin '+refs/pull/*/head:refs/pull/*/head'
          git fetch -q --no-tags https://github.com/horizon-rust/horizon.git main:refs/remotes/upstream/main
      - name: Update the churn report issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Conflict hotspots: churn report'
          FETCHED: ${{ steps.fetch.outcome }}
        run: |
          git --version
          python3 tools/hotspots/measure.py --days 3 --report > "$RUNNER_TEMP/report.md"
          {
            echo "> 🤖 Filed by Aria's agent swarm, Dyna, not by Aria."
            echo
            if [ "$FETCHED" != success ]; then
              echo "Fetching the PR heads or upstream's main failed: some PRs show as a commit, and syncs may count as PRs."
              echo
            fi
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | sed -n '1p')
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  # Lint and verify use separate Dyna slots when the pool is available; each slot's build folder persists.
  # Outside contributors and pool-down runs stay on GitHub's runners with snapshot caches.
  lint:
    # Dyna's large runner for main's pushes and this repository's own pull requests (owner, 2026-11-05): its
    # build folder persists, so clippy re-checks only what changed. A fork's pull request, or a run while the
    # pool is down, stays on GitHub's runners with the snapshot cache below.
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna-small' || 'ubuntu-latest') || needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna-large' || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    # Recent green lint peaked at 53.5 minutes on a cold runner.
    # Cold GitHub/boat lint was not represented in that sample; retain its previous allowance.
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 60 || github.event_name == 'pull_request' && 75 || 100 }}
    env:
      # dyna (Dyna's pool: persistent build folder, no sudo), boat (a fresh VM like GitHub's, 16 GiB) or github.
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Documentation needs no Rust lint
        if: needs.changes.outputs.rust_required == 'false'
        env:
          REUSED: ${{ needs.changes.outputs.reused_run }}
        run: |
          if [ -n "$REUSED" ]; then
            echo "This tree passed the gate in run $REUSED; repository hygiene still runs." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rust lint is not selected; repository hygiene still runs.'
          fi
      # Not diff-selected: any tracked file can contain a captured tool notice.
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's test merge with its base, as a pull_request run checks out;
          # otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_merge }}
      # The tree this gate checks, so a main push of the same tree can take its verdict (tools/ci/gate_reuse.py). Only
      # where the tree's own dyna-ci.yml runs (a push, a pull_request's test merge): a `pr` dispatch runs main's
      # definition on another tree. Best-effort: a failed record only loses the saving.
      - name: Record the checked tree
        id: tree
        if: needs.changes.outputs.rust_required != 'false' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/gate-tree"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/gate-tree/tree"
          echo "tree=$(cat "$RUNNER_TEMP/gate-tree/tree")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.tree.outcome == 'success'
        continue-on-error: true
        with:
          name: gate-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/gate-tree/tree
          retention-days: 3
          overwrite: true
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && env.RUNNER_KIND == 'dyna'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            # The slot's build folder persists between jobs; point the checkout's target at it.
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
            # sccache for every compile, Clippy runs on workspace crates included (tools/ci/compiler-cache.sh).
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" >> "$GITHUB_ENV"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # No lint snapshot on GitHub's runners: ci-cache.yml's 2 GB every 6 hours pushed the release caches (the SDK's and
      # the launcher's) out of the repository's 10 GB, and those come first. A GitHub-hosted lint builds from cold.
      # A Dyna runner builds as many crates at once as its CPU quota allows within its memory, about 3 GiB
      # per large rustc (tools/ci/cargo_jobs.py); boat's 16 GiB VM keeps four. A cargo flag, not
      # CARGO_BUILD_JOBS: sccache hashes CARGO_* variables, which would split the runners' cache from the boxes'.
      - name: Choose build parallelism
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          case "$RUNNER_KIND" in
            dyna) jobs="-j$(python3 tools/ci/cargo_jobs.py --job-mib 3072)" ;;
            boat) jobs=-j4 ;;
            *) jobs= ;;
          esac
          echo "JOBS=$jobs" | tee -a "$GITHUB_ENV"
      # A fresh checkout otherwise makes every workspace source newer than the cached artifacts.
      # Only byte-identical Git objects regain their cached mtimes; changed inputs stay new.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check repository artifacts and workflow YAML
        id: check_repository_artifacts_and_workflow_yaml
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        id: check_mod_api_boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: formatting
        run: |
          python3 tools/ci/format_scan.py
      - name: Lint native targets and server build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: native-lint
        run: |
          # Split JOBS into two complementary counts that sum to it, at least 1 each.
          # When JOBS is empty (e.g. GitHub-hosted runners), run the two lints sequentially
          # to avoid doubling the runner's default parallelism.
          if [ -n "${JOBS:-}" ]; then
            n=${JOBS#-j}
            j_native="-j$(( (n + 1) / 2 ))"
            j_server="-j$(( n / 2 ))"
            [ "$j_server" = "-j0" ] && j_server="-j1"
          else
            j_native=""
            j_server=""
          fi

          status_native=0
          status_server=0

          if [ -n "$j_server" ]; then
            python3 tools/ci/check_warnings.py cargo clippy $j_server --keep-going --target-dir target/server-lint \
              -p sunrise-client -p sunrise-game -p sunrise-mod-host --all-targets --no-default-features \
              > "$RUNNER_TEMP/server-lint.log" 2>&1 &
            server_pid=$!

            python3 tools/ci/check_warnings.py cargo clippy $j_native --keep-going --workspace --all-targets || status_native=$?
            wait "$server_pid" || status_server=$?
          else
            python3 tools/ci/check_warnings.py cargo clippy --keep-going --workspace --all-targets || status_native=$?
            python3 tools/ci/check_warnings.py cargo clippy --keep-going --target-dir target/server-lint \
              -p sunrise-client -p sunrise-game -p sunrise-mod-host --all-targets --no-default-features \
              > "$RUNNER_TEMP/server-lint.log" 2>&1 || status_server=$?
          fi

          if [ "$status_native" -eq 0 ]; then
            echo "workspace_lint=success" >> "$GITHUB_OUTPUT"
          else
            echo "workspace_lint=failure" >> "$GITHUB_OUTPUT"
          fi

          if [ "$status_server" -ne 0 ]; then
            echo "Server lint failed:"
            cat "$RUNNER_TEMP/server-lint.log"
          fi

          if [ "$status_native" -ne 0 ] || [ "$status_server" -ne 0 ]; then
            exit 1
          fi
      # The full boundary audit: the mod API's generated signatures (mod_api_generated*.rs, written by sunrise-mod-vocab's
      # build script during the lint above), which the source-only check cannot see. Only Cargo's build-script outputs
      # are scanned: the persistent target holds far more.
      - name: Check generated mod API signatures
        id: generated_api_boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' && steps.native-lint.outputs.workspace_lint == 'success' }}
        run: python3 tools/ci/check_api_boundary.py --generated-root target/debug/build
      # The prebuilt SDK's own feature graph: a release --lib build with prefer-dynamic and warnings rejected, as
      # tools/prebuilt_game.py builds it, for the host and for the Windows archive (system-allocator there,
      # cargo_features). The checks above unify test and dev features (test-support) into one host build, which hid
      # an unused import (Linux) and a unix-only binding (Windows) from everything but the SDK builds on main. Own
      # target folders, one per target so the two run at once: these flags would otherwise invalidate the workspace's
      # artifacts for the other steps. Each check is a chain of single-threaded crate checks (rollup 13: host 5.9 and
      # Windows 5.6 minutes one after the other, under 2 of the runner's 8 CPUs busy), so together they take about
      # as long as one; each gets half the job's crate slots to stay within its memory.
      # --target leaves host units uncapped as before; stable Cargo has no host-rustflags, so their denies can stop dependents.
      - name: The prebuilt SDK's host and Windows libraries build without warnings
        id: sdk_libraries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' }}
        env:
          # MinGW ignores mimalloc's MSVC pragmas. CFLAGS replaces cc's default warning flags,
          # so retain -Wall/-Wextra for both mimalloc and hidapi; silence only unknown pragmas.
          CFLAGS_x86_64_pc_windows_gnu: -Wall -Wextra -Wno-unknown-pragmas
        run: |
          # hidapi and libmimalloc-sys compile C for the target in their build scripts.
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null; then
            echo "::error::x86_64-w64-mingw32-gcc is missing: the Windows SDK check needs MinGW (gcc-mingw-w64-x86-64 in the ci-runner image)"
            exit 1
          fi
          rustup target add x86_64-pc-windows-gnu
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          half=${JOBS:+-j$(( (${JOBS#-j} + 1) / 2 ))}
          check() {  # name, then the cargo arguments; the output waits in a log until both have finished
            local name=$1 started=$SECONDS status=0
            shift
            env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS='-C prefer-dynamic' \
              python3 tools/ci/check_warnings.py cargo check $half --keep-going --locked -p sunrise-mod-host --lib --profile release \
                "$@" > "$RUNNER_TEMP/sdk-$name.log" 2>&1 || status=$?
            echo "SDK library check $name: $((SECONDS - started)) s" >> "$RUNNER_TEMP/sdk-times"
            return $status
          }
          check host --target-dir target/sdk-check --target "$host" & host_check=$!
          # The real build is a dylib, which Cargo never LTOs; a --lib check under the release profile's thin LTO
          # builds the dependencies for linker-plugin LTO, which rustc refuses with prefer-dynamic on Windows.
          # A check generates no code, so LTO changes no warning or cfg it reports.
          check windows --target-dir target/sdk-check-windows --target x86_64-pc-windows-gnu --features system-allocator \
            --config profile.release.lto=false & windows_check=$!
          failed=
          wait "$host_check" || failed="$failed host"
          wait "$windows_check" || failed="$failed windows"
          for name in host windows; do
            case " $failed " in
              *" $name "*) echo "SDK library check $name failed:"; cat "$RUNNER_TEMP/sdk-$name.log" ;;
              *) echo "::group::SDK library check $name"; cat "$RUNNER_TEMP/sdk-$name.log"; echo "::endgroup::" ;;
            esac
          done
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/sdk-times"
          if [ -n "$failed" ]; then
            echo "::error::The prebuilt SDK's library has warnings or errors for:$failed (its output is above)"
            exit 1
          fi
      - name: Report lint compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: |
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Peak includes page cache; oom_kill records OOM kills, anon is only end-of-job residue.
          grep usage_usec /sys/fs/cgroup/cpu.stat || true
          echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          grep '^oom_kill ' /sys/fs/cgroup/memory.events 2>/dev/null || echo "oom_kill unavailable"
          awk '/^anon / {print "anon at job end", $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo "anon at job end unavailable"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py


  verify:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    # Stopgap for sunrise#5839 on the next line: verify alone on dyna-xlarge, back to dyna-large once the gate's peak line shows the sunrise-client lib-test compile at or under 12 GiB.
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna-small' || 'ubuntu-latest') || needs.changes.outputs.self_hosted == 'true' && 'dyna-xlarge' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playsunrise-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && 50 || 45 }}
    # GPU device tests belong in the daily on lavapipe, not in verify. Hide Vulkan and disallow GL so that
    # a stray plain GPU test fails on every runner rather than running or silently skipping.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      WGPU_BACKEND: vulkan
      SUNRISE_GPU_TESTS_REQUIRE_ADAPTER: '1'
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's test merge with its base, as a pull_request run checks out;
          # otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_merge }}
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # What the slot's build folder holds before this job writes anything: Dyna mounts /build per slot for
      # reuse across jobs, and an empty one means a cold build (no target, no registry, no toolchain).
      - name: Report what the build folder holds at job start
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        # A report only: an unreadable folder or a failed du/find/findmnt never fails the job.
        continue-on-error: true
        run: |
          # RUSTUP_HOME is set by a later step (tools/ci/dyna_ci_deps.sh): read its folder directly.
          for dir in "${DYNA_CI_BUILD:-/build}" "${CARGO_TARGET_DIR:-}" "${CARGO_HOME:-}/registry" "${DYNA_CI_BUILD:-/build}/rustup/toolchains"; do
            if [ ! -d "$dir" ]; then echo "build-folder $dir: absent"; continue; fi
            files=$(du -s --inodes "$dir" 2>/dev/null | cut -f1 || true)
            size=$(du -sh "$dir" 2>/dev/null | cut -f1 || true)
            oldest=$(find "$dir" -maxdepth 2 -printf '%TY-%Tm-%TdT%TH:%TM\n' 2>/dev/null | sort | sed -n '1p' || true)
            mount=$(findmnt -n -o SOURCE,TARGET -T "$dir" 2>/dev/null | sed -n '1p' || true)
            echo "build-folder $dir: entries=${files:-?} size=${size:-?} oldest=${oldest:-none} mount=${mount:-?}"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          # Size against this host's cap (tools/ci/dyna-slot-caps.txt): over it, Dyna empties target/ before the next job.
          host=$(sed -n 's/^dyna-ci-\(.*\)-[0-9a-f]\{8\}$/\1/p' <<< "${RUNNER_NAME:-}")
          cap=$(awk -v h="$host" '$1 == h {print $2}' tools/ci/dyna-slot-caps.txt 2>/dev/null || true)
          used=$(du -s --block-size=1G "${DYNA_CI_BUILD:-/build}" 2>/dev/null | cut -f1 || true)
          echo "build-folder cap: host=${host:-?} size=${used:-?} GiB cap=${cap:-80} GiB" | tee -a "$GITHUB_STEP_SUMMARY"
          # What takes the room, toward that cap.
          du -sh "${DYNA_CI_BUILD:-/build}"/* "${CARGO_TARGET_DIR:-/nonexistent}"/* 2>/dev/null | sort -rh | sed -n '1,12p' | sed 's/^/build-folder part /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Each kept toolchain and its components: a test runs rustfmt under whichever toolchain it selects.
          for toolchain in "${DYNA_CI_BUILD:-/build}"/rustup/toolchains/*/; do
            [ -f "$toolchain/lib/rustlib/components" ] || continue
            echo "build-folder toolchain $(basename "$toolchain"): $(sed 's/-x86_64.*//;s/-aarch64.*//' "$toolchain/lib/rustlib/components" | sort -u | tr '\n' ' ')"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # Registry dependencies, from the snapshot ci-cache.yml publishes from main every 6 hours; pull requests only
      # read it. The workspace crates are rebuilt: their snapshot was 3 GB of the repository's 10 GB of caches.
      # Profile overrides in Cargo.toml are part of rust-cache's key; unchanged dependencies still restore.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          shared-key: verify-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use persistent verify build artifacts
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: |
          mkdir -p "${CARGO_TARGET_DIR:?}"
          if [ ! -e target ] && [ ! -L target ]; then
            ln -s "$CARGO_TARGET_DIR" target
          elif [ ! target -ef "$CARGO_TARGET_DIR" ]; then
            echo '::error::Existing target path does not point to CARGO_TARGET_DIR; refusing to replace it.'
            exit 1
          fi
      # The runner's CPU quota within its memory on Dyna, four on boat, Cargo's default elsewhere. 4 GiB a rustc, not
      # lint's 3: this job compiles gameplay twice with code generation (the lib and the executable test targets), and
      # at five a 16 GiB runner's compile was killed for memory (signal 9).
      - name: Choose build parallelism
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          case "$RUNNER_KIND" in
            dyna) jobs="-j$(python3 tools/ci/cargo_jobs.py --job-mib 4096)" ;;
            boat) jobs=-j4 ;;
            *) jobs= ;;
          esac
          echo "JOBS=$jobs" | tee -a "$GITHUB_ENV"
      # Pair the retained artifacts with lint's input snapshot. Cargo still decides freshness;
      # only byte-identical Git objects regain their previous source timestamps.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # sunrise-client rustc processes take several GB each; $JOBS (chosen above) fits them in the runner's
      # memory. Formatting and lint run in parallel (the lint job), so this job only tests.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which the lint job already
      # type-checks.
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Setup done
        id: setup
        run: 'true'
      # Compile first, apart from running: the build's time and its slowest units show on their own.
      - name: Build Rust core test binaries
        id: core_build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        # Build the exact test graph on green. A workspace proc-macro can have different build/test
        # dependency profiles; cargo build first would make cargo test compile its consumers again.
        run: |
          # Keep other compiles parallel, but prevent the two large lib tests from exhausting memory together.
          export SUNRISE_TEST_RUSTC_WRAPPER="${RUSTC_WRAPPER:-}"
          export RUSTC_WRAPPER="$GITHUB_WORKSPACE/tools/ci/test-compile-lock.sh"
          build_log=$(mktemp)
          trap 'rm -f "$build_log"' EXIT
          if cargo test $JOBS --profile test --workspace --lib --bins --tests --no-run --timings 2>&1 | tee "$build_log"; then
            exit 0
          fi
          # Keep the fast parallel build on green. A killed compile gets one retry of the
          # same test graph, with finished units cached and no overlapping rustc processes.
          if grep -Eq 'Compile terminated by signal [0-9]+|signal: [0-9]+, SIG[A-Z]+|terminated with signal [0-9]+' "$build_log"; then
            failed_units=$(grep 'error: could not compile' "$build_log" | tr '\n' ';' || true)
            echo "::warning::A compile was killed by a signal; retrying the test build with -j1. Failed units: $failed_units"
            if cargo test -j1 --profile test --workspace --lib --bins --tests --no-run --timings; then
              exit 0
            fi
          fi
          # Only red runs pay for the other graph, to collect independent targets' errors too.
          echo "::error::The test build failed (its errors are above); building again with --keep-going to list every target's errors."
          if cargo build $JOBS --keep-going --profile test --workspace --lib --bins --tests; then
            # Main 9918e72ba0: two compiles killed by signal 9, then this build passed and the step ended with no message.
            echo "::error::The --keep-going build passed, but it builds a different graph and does not clear the failed test build: check the errors above, including any 'signal 9' (a compile killed, usually for memory), before rerunning."
          fi
          exit 1
