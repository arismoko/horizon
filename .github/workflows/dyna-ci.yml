name: dyna-checks
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || github.workflow }}
# Upstream-style checks on pull requests; fork-only extras on main pushes and dispatches.
# Keep upstream's workflows byte-identical; disable checks (ci.yml) in the fork's Actions
# settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher; the dispatched run uses Dyna.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      github-fallback:
        description: Force GitHub-hosted runners after a boat runner outage
        type: boolean
        default: false
      prepare-output-check:
        description: Check the prepared output digest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks. Main runs are never cancelled: a run in
  # progress finishes, and only the newest waiting push runs next, so main is always checked.
  group: dyna-checks-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  # A draft pull request skips every check below (they all need this job); it runs when marked ready.
  changes:
    if: github.event_name != 'schedule' && !inputs.prepare-output-check && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust_required: ${{ steps.selection.outputs.rust_required || 'true' }}
      launcher_required: ${{ steps.selection.outputs.launcher_required || 'true' }}
      tooling_required: ${{ steps.selection.outputs.tooling_required || 'true' }}
      # The sample was PR-selected before centralization; keep main/dispatch behavior unchanged.
      sample_required: ${{ steps.selection.outputs.sample_required || 'false' }}
      self_hosted: ${{ !inputs.github-fallback && steps.hosted.outputs.forced_github != 'true' && steps.runner.outputs.self_hosted || 'false' }}
      routing_reason: ${{ steps.runner.outputs.routing_reason }}
      # Every ignored-tests shard on main pushes and dispatches; empty on pull requests.
      ignored_matrix: ${{ steps.matrix.outputs.matrix || '{"shard":[]}' }}
      # Where lint and verify run when they don't go to Dyna's pool: boat-large for listed outside contributors
      # while vars.BOAT_CI is on (boat refuses a public repository's run unless both its author and the user who
      # started it are on boat's own list, so the same list lives in vars.BOAT_CI_USERS), else GitHub's runner.
      hosted_label: ${{ steps.hosted.outputs.label }}
      forced_github: ${{ steps.hosted.outputs.forced_github }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this commit's history for selection
        if: github.event_name == 'pull_request'
        run: git fetch -q --no-tags --unshallow origin "$(git rev-parse HEAD)"
      - name: Select checks once for this pull request
        if: github.event_name == 'pull_request'
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --all "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # workflow_run omits pull_requests for fork runs. Record only immutable IDs;
      # the trusted controller reads this as bounded data, never as executable code.
      - name: Record the original PR base for boat recovery
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('boat-base.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': '1',
              'base': event['pull_request']['base']['sha'],
              'head': event['pull_request']['head']['sha'],
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          name: boat-base-1
          path: boat-base.json
          retention-days: 2
      # Prefer the live pool switch/lease. github.token normally cannot read Variables;
      # its snapshot fallback uses run creation time, bounded to an hour of queue age.
      # Fork pull requests remain on GitHub's runners.
      - id: runner
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" = true ]; then
            ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_SELF_HOSTED" -q .value 2>/dev/null || true)
            LEASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_POOL_UNTIL" -q .value 2>/dev/null || true)
          fi
          # A refused read prints GitHub's error JSON: keep only a well-formed answer, else use the snapshot.
          case "${LEASE:-}" in '' | *[!0-9]*) LEASE= ;; esac
          case "${ENABLED:-}" in true | false) ;; *) ENABLED= ;; esac
          echo "pool lease: live=${LEASE:-unreadable} snapshot=${VARS_LEASE:-none}"
          SOURCE=live
          CREATED=
          if [ -z "${LEASE:-}" ]; then
            SOURCE=snapshot
            # Actions read is sufficient for run metadata, unlike the Variables endpoint.
            CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .created_at 2>/dev/null || true)
            if [ -n "$CREATED_AT" ]; then
              CREATED=$(date -d "$CREATED_AT" +%s 2>/dev/null || true)
            fi
          fi
          ENABLED=${ENABLED:-$VARS_ENABLED} LEASE=${LEASE:-$VARS_LEASE} LEASE_SOURCE=$SOURCE CREATED=$CREATED bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - id: hosted
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a fork's pull request: boat_health.py then reads what boat-recovery published.
          BOAT_CI: ${{ vars.BOAT_CI }}
          BOAT_FALLBACK: ${{ inputs.github-fallback && 'true' || 'false' }}
          BOAT_USERS: ${{ vars.BOAT_CI_USERS }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          ACTOR: ${{ github.triggering_actor }}
        run: python3 tools/ci/boat_health.py
      - name: The ignored-tests shard matrix
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: matrix
        run: python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"

  # Fork PR tokens cannot dispatch or cancel runs. The trusted default-branch
  # boat-recovery workflow cancels/reruns outages; changes reads the previous attempt.
  # Same-run fallback jobs would leave the original queued checks pending, not green.
  boat-watch:
    needs: changes
    if: needs.changes.outputs.hosted_label == 'boat-large' && needs.changes.outputs.self_hosted != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 tools/ci/boat_watch.py

  pool-watch:
    needs: changes
    if: needs.changes.outputs.self_hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/dyna_ci_pool_watch.py

  # Lint and verify use separate Dyna slots when the pool is available; each slot's build folder persists.
  # Outside contributors and pool-down runs stay on GitHub's runners with snapshot caches.
  lint:
    # Dyna's large runner for main's pushes and this repository's own pull requests (owner, 2026-11-05): its
    # build folder persists, so clippy re-checks only what changed. A fork's pull request, or a run while the
    # pool is down, stays on GitHub's runners with the snapshot cache below.
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'dyna-large' || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    # A cold lint (two full clippy graphs) takes 40+ minutes on GitHub runners: room to finish, main to save its cache.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 75 || 100 }}
    env:
      # dyna (Dyna's pool: persistent build folder, no sudo), boat (a fresh VM like GitHub's, 16 GiB) or github.
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'dyna' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
      # Like verify, avoid scheduling eight large rustc processes inside a 16 GiB slot.
      JOBS: ${{ (needs.changes.outputs.self_hosted == 'true' || startsWith(needs.changes.outputs.hosted_label, 'boat')) && '-j4' || '' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Documentation needs no Rust lint
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'Rust lint is not selected; repository hygiene still runs.'
      # Not diff-selected: any tracked file can contain a captured tool notice.
      - uses: actions/checkout@v4
      - name: Check repository artifacts and workflow YAML
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && env.RUNNER_KIND == 'dyna'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            # The slot's build folder persists between jobs; point the checkout's target at it.
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
            # Keep clippy-driver direct, but reuse sccache for ordinary dependency compilations.
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/clippy-cache.sh" >> "$GITHUB_ENV"
          fi
          bash tools/ci/rustup_install.sh stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Lint cache toolchain
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        id: toolchain
        run: |
          echo "hash=$(rustc +stable -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          # One snapshot every 6 hours: the repository's 10 GB cache budget can't hold one per main head.
          echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      # rust-cache's default removes workspace artifacts. Those are the expensive part here,
      # in two feature graphs; keep both. ci-cache.yml publishes a fresh snapshot from main every 6 hours.
      - uses: actions/cache/restore@v4
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        id: lint-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ steps.toolchain.outputs.slot }}
          restore-keys: |
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            lint-workspace-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-
      # A restore-key hit can predate a profile or dependency change: a successful download
      # does not mean Cargo has artifacts for the requested graph (for example, #1190).
      - name: Report lint cache compatibility
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        env:
          REQUESTED_KEY: ${{ steps.lint-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.lint-cache.outputs.cache-matched-key }}
        run: |
          if [ -z "$MATCHED_KEY" ]; then
            STATUS="No lint cache found; this run builds from cold."
          elif [[ "$MATCHED_KEY" == "${REQUESTED_KEY%-*-*}-"* ]]; then
            STATUS="Matching manifests and lockfile; unchanged Cargo units can be reused."
          else
            STATUS="Fallback cache from different manifests or lockfile; dependency or profile changes can require a full rebuild until main saves a matching snapshot."
            echo "::notice::$STATUS"
          fi
          {
            echo "### Lint workspace cache"
            echo "$STATUS"
            printf '\nRequested: `%s`\n\nRestored: `%s`\n\n' "$REQUESTED_KEY" "${MATCHED_KEY:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
      # A fresh checkout otherwise makes every workspace source newer than the cached artifacts.
      # Only byte-identical Git objects regain their cached mtimes; changed inputs stay new.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check formatting
        if: needs.changes.outputs.rust_required != 'false'
        id: formatting
        continue-on-error: true
        run: |
          cargo +stable fmt --all -- --check
          find crates/horizon-mod-api/src crates/horizon-mod-vocab/src -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --check --config skip_children=true
          find crates/horizon-client/src/game -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --config skip_children=true --check
          rustup run stable rustfmt --edition 2024 --check crates/horizon-mod-api-gen/dispatch-tests/src/fixtures/*.rs
      - name: Lint native targets
        if: needs.changes.outputs.rust_required != 'false'
        id: native-lint
        run: cargo +stable clippy $JOBS --keep-going --workspace --all-targets -- -D warnings
      - name: Lint the server build without sound or controllers
        if: needs.changes.outputs.rust_required != 'false'
        id: server-lint
        run: cargo +stable clippy $JOBS --keep-going -p horizon-client -p horizon-game -p horizon-mod-host --all-targets --no-default-features -- -D warnings
      - name: The machine sample builds against this API
        if: needs.changes.outputs.sample_required == 'true'
        run: python3 tools/ci/check_machine_sample.py
      - name: The mod API builds for wasm32
        if: needs.changes.outputs.rust_required != 'false'
        run: cargo +stable check $JOBS -p horizon-mod-api --target wasm32-unknown-unknown --locked
      - name: Propagate formatting failure
        if: ${{ always() && steps.formatting.outcome == 'failure' }}
        run: |
          echo '::error::Formatting failed; see Check formatting. Independent build failures remain above.'
          exit 1
      - name: Report lint compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      # Publish native work even if the independent wasm check fails. Pull requests only read
      # main's snapshots; they can never replace a cache subsequently consumed by main.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat') && github.ref == 'refs/heads/main' && steps.native-lint.outcome == 'success' && steps.server-lint.outcome == 'success' && steps.lint-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  verify:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && 'dyna-large' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      # With Vulkan hidden, a runner with Mesa's GL software adapter (boat's image) would still run the GPU tests,
      # on GL, and fail (#2841); Vulkan only leaves every runner with no adapter, so GPU tests skip here everywhere.
      WGPU_BACKEND: vulkan
      JOBS: ${{ (needs.changes.outputs.self_hosted == 'true' || startsWith(needs.changes.outputs.hosted_label, 'boat')) && '-j4' || '' }}
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
      # Only this commit's own history (rust_changes.py's merge base, check_public_tree.py's range and HEAD
      # ancestry), not every branch and tag: a full checkout fetched them all and took over a minute.
      - name: Fetch this commit's history
        run: git fetch -q --no-tags --unshallow origin "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 tools/check_public_tree.py --history
          fi
      - name: Check duplicate public native functions
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/sync_upstream.py --check
      # docs/layers.md#built-in-addresses: every built-in outside address in the Horizon layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        if: needs.changes.outputs.rust_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_addresses.py ${BASE_SHA:+--base "$BASE_SHA"}
      # docs/layers.md#file-size: a Rust file over 3000 lines may not grow (pull requests; main has no base to compare).
      - name: Big files don't grow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_file_size.py ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh stable --profile minimal --component rustfmt --component clippy
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        if: needs.changes.outputs.rust_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_layers.py ${BASE_SHA:+--base "$BASE_SHA"}
      # Workspace crates too: GitHub-hosted verify (outside contributors) otherwise rebuilt every workspace crate.
      # ci-cache.yml publishes this snapshot from main every 6 hours; pull requests only read it.
      # Profile overrides in Cargo.toml are part of rust-cache's key; unchanged dependencies still restore.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          # A new key: the dependency-only snapshot under the old one blocked saving this one.
          shared-key: verify-workspace
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A dyna-large runner has a hard 16 GiB limit and 8 CPUs; horizon-client rustc processes take about 2.6 GB
      # each, so Dyna runs build four crates at a time. Formatting and lint run in parallel on GitHub's
      # runners (the lint job), so this job only tests. A cargo flag, not CARGO_BUILD_JOBS: sccache hashes
      # CARGO_* variables, and that would split the runners' cache from the boxes'.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which the lint job already
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Build the runtime holder test actor
        if: needs.changes.outputs.rust_required != 'false'
        run: cargo +stable build $JOBS -p horizon-mod-package --features runtime-process --example holder_actor
      - name: Test Rust core and voxel kernel correctness
        if: needs.changes.outputs.rust_required != 'false'
        run: cargo +stable test $JOBS --workspace --lib --bins --tests
      # Separate timings make rebuilds between Cargo invocations visible without changing the test selection.
      # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
      # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
      # recompiling the workspace with a different dependency graph.
      - name: Test ignored mod content roots
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          cargo +stable test $JOBS --workspace --lib --bins --tests mod_content::tests:: -- --ignored
      # Derive caller inputs from slot rows on the checked-out PR merge result.
      # Keep this before doc tests so their failures cannot hide stale slots.
      - name: Validate prebuilt source stage and listed slots
        if: needs.changes.outputs.rust_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/stage_slots.py --base "${BASE_SHA:-HEAD^}"
      - name: Test Rust documentation examples
        if: needs.changes.outputs.rust_required != 'false'
        run: cargo +stable test $JOBS --workspace --doc
      - name: Test listed call production export and real registry
        if: needs.changes.outputs.rust_required != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/listed_calls.py --base "${BASE_SHA:-HEAD^}"
      - name: Report test compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
      # Last, so a tooling failure never skips the Rust tests. Only after every earlier step succeeded (success(),
      # not !cancelled()): after a failure the Rust install was skipped, and tests that launch rustc would add a
      # second, misleading failure.
      - name: Test offline research tooling
        if: ${{ success() && needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false' }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s tools/ci -p 'test_prepared_*.py' -v
      # The mod-host map's tables (#2534), built on main's pushes instead of committed, so no PR has to regenerate
      # them: docs/layering/mod-host-map.md points here. Main pushes only, never pull requests; about 17 s of Python
      # measured locally, no build.
      - name: Build the mod-host map tables
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: python3 tools/layering/scan_engine_mod_edges.py --map target/layering/mod-host-map-tables.md
      - name: Upload the mod-host map tables
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: mod-host-map
          path: target/layering/mod-host-map-tables.md
          if-no-files-found: error
  # The #[ignore]d library tests that need the prepared vanilla data, which verify doesn't have. Main pushes and
  # dispatches only, on Dyna's large runner where that data lives. Every shard runs, with one package per shard
  # (the plan lives in tools/ci/ignored_shards.py). tools/ci/ignored_tests.py fails on a new failure and on a known
  # one that passes, and prints only test names and results: the data is Mojang's.
  ignored-tests-shards:
    needs: changes
    # Skip an empty matrix instead of expanding to nothing, which GitHub refuses.
    if: >-
      needs.changes.outputs.self_hosted == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      fromJSON(needs.changes.outputs.ignored_matrix).shard[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ignored_matrix) }}
    # Owner-approved stopgap: #2944 removes this when the legs run under 15 minutes.
    runs-on: ${{ (matrix.shard == 'horizon-client#1of2' || matrix.shard == 'horizon-client#2of2') && 'dyna-xlarge' || 'dyna-large' }}
    # Temporary: #2944 brings client data legs under 15 minutes and restores the 60-minute cap.
    timeout-minutes: ${{ (matrix.shard == 'horizon-client#1of2' || matrix.shard == 'horizon-client#2of2') && 90 || 60 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh stable --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Record data-leg start and compiler cache
        run: |
          date -u '+data-leg start utc=%Y-%m-%dT%H:%M:%SZ'
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
      # Missing data must fail on both main pushes and nightly dispatches.
      - name: Prepare checkout-keyed vanilla data
        id: data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for dir in minecraft datagen horizon-client tools; do
            if [ ! -d "/cache/horizon-local/$dir" ]; then
              echo "prepared data unavailable on this runner"
              echo "Prepared data unavailable: $dir ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      - name: Retain typed preparation diagnostics only
        if: failure() && steps.data.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: preparation-diagnostic-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/prepare-build.diagnostic.json
            ${{ runner.temp }}/prepare.diagnostic.json
            ${{ runner.temp }}/seed-extras.diagnostic.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate the fishing test's vanilla reference inputs
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'horizon-client' || startsWith(matrix.shard, 'horizon-client#'))
        run: |
          reference=$(mktemp -d "$RUNNER_TEMP/fishing-reference.XXXXXX")
          python3 tools/test_fishing_rng_parity.py --prepare-reference "$reference" --env-file "$GITHUB_ENV"
      - name: Run the ignored tests that need prepared data
        if: steps.data.outputs.present != 'false'
        env:
          RUSTUP_TOOLCHAIN: stable
          SHARD: ${{ matrix.shard }}
          HORIZON_DATA_LEG_TIMING: '1'
        run: |
          export HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3"
          python3 tools/ci/with_xvfb.py python3 tools/ci/ignored_tests.py "$SHARD"
      - name: Record data-leg end and compiler cache
        if: always()
        run: |
          date -u '+data-leg end utc=%Y-%m-%dT%H:%M:%SZ'
          # Whole-job cgroup high-water: compilation, tests and file cache, not per-test RSS
          # or an isolated test-execution peak. Fixed kernel files only; telemetry is best effort.
          echo 'data-leg memory_scope=whole_job_cgroup_including_compilation_tests_file_cache'
          for metric in memory.peak memory.max memory.swap.peak memory.swap.max; do
            field="${metric//./_}_bytes"
            value=unavailable
            if IFS= read -r sample 2>/dev/null < "/sys/fs/cgroup/$metric"; then
              if [[ "$sample" =~ ^[0-9]+$ || "$sample" == max ]]; then
                value="$sample"
              fi
            fi
            echo "data-leg $field=$value"
          done
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
  # Never turn missing prepared-data coverage into a green main/nightly run.
  ignored-tests:
    needs: [changes, ignored-tests-shards]
    if: >-
      always() && !cancelled() &&
      !inputs.prepare-output-check &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require prepared-data coverage
        env:
          RESULT: ${{ needs.ignored-tests-shards.result }}
          ROUTE: ${{ needs.changes.outputs.self_hosted }}
          REASON: ${{ needs.changes.outputs.routing_reason }}
          CHANGES: ${{ needs.changes.result }}
          FORCED_GITHUB: ${{ needs.changes.outputs.forced_github }}
        run: |
          {
            echo "## Prepared-data coverage"
            echo "Shard result: $RESULT; changes: $CHANGES; self-hosted: $ROUTE; forced GitHub: $FORCED_GITHUB"
            echo "Routing: $REASON"
            if [ "$RESULT" = skipped ]; then
              echo "Missing coverage: pool routing was disabled/unavailable or the shard matrix was empty. Restore the pool lease/switch if expired; do not treat this run as tested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != success ]; then
            echo "::error::Prepared-data coverage required; shard result: $RESULT; self-hosted: $ROUTE; $REASON"
            exit 1
          fi
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    needs: changes
    if: needs.changes.outputs.launcher_required != 'false'
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna-medium' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "playhorizon-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.launcher_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers GPUI links against
        if: needs.changes.outputs.launcher_required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.launcher_required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the launcher's formatting, lint and tests
        if: needs.changes.outputs.launcher_required != 'false'
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: |
          cargo +stable fmt --check
          cargo +stable clippy $JOBS --all-targets --locked -- -D warnings
          cargo +stable test $JOBS --locked --lib --bins
          cargo +stable test $JOBS --locked --test storage
          cargo +stable build $JOBS --manifest-path ../Cargo.toml --locked -p horizon-mod-package --features runtime-process --example holder_actor
          cargo +stable test $JOBS --manifest-path ../Cargo.toml --locked -p horizon-mod-package --features runtime-process --lib
  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  prepared-output-check:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare-output-check && github.repository == 'arismoko/horizon'
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh stable --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check prepared output digest
        run: |
          # Never reuse a completed preparation for this diagnostic, including a retry.
          for attempt in 1 2; do
            HORIZON_PREPARE_KEY="${GITHUB_SHA:0:16}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              HORIZON_PREPARE_EXPORT_DIGEST="$RUNNER_TEMP/export.digest" \
              HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
            exported=$(cat "$RUNNER_TEMP/export.digest")
            actual=$(python3 tools/prepare_output.py digest 2>/dev/null) || { echo "::error::prepared output digest unavailable"; exit 1; }
            { echo "fresh export $attempt: $exported"; echo "seeded export $attempt: $actual"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          set +e
          python3 tools/prepare_output.py check > "$RUNNER_TEMP/output-check.log" 2>&1
          result=$?
          set -e
          expected=$(awk '!/^#/ && NF == 2 { value=$2 } END { print value }' crates/horizon-prepare/output-versions.txt)
          { echo "prepared output check: $([ "$result" -eq 0 ] && echo pass || echo fail)"; echo "actual: $actual"; echo "expected: $expected"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"

  vanilla-parity:
    if: github.repository == 'arismoko/horizon' && github.event_name == 'workflow_dispatch' && !inputs.prepare-output-check && !inputs.github-fallback
