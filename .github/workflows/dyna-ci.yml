        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # horizon-client rustc processes take several GB each; $JOBS (chosen above) fits them in the runner's
      # memory. Formatting and lint run in parallel (the lint job), so this job only tests.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which the lint job already
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Setup done
        id: setup
        run: 'true'
      - name: Build the runtime holder test actor
        id: actor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        # The command lives in tools/ci/ignored_shards.py PREPARE, which the daily run uses too.
        run: python3 tools/ci/ignored_shards.py --prepare horizon-mod-package $JOBS
      # Compile first, apart from running: the build's time and its slowest units show on their own.
      - name: Build Rust core test binaries
        id: core_build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        # Build the exact test graph on green. A workspace proc-macro can have different build/test
        # dependency profiles; cargo build first would make cargo test compile its consumers again.
        run: |
          if cargo test $JOBS --profile test --workspace --lib --bins --tests --no-run --timings; then
            exit 0
          fi
          # Only red runs pay for the other graph, to collect independent targets' errors too.
          cargo build $JOBS --keep-going --profile test --workspace --lib --bins --tests || true
          exit 1
      # What bounds the build: the slowest compile units, from the report --timings writes.
      - name: Slowest compile units
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' }}
        continue-on-error: true
        run: |
          python3 tools/ci/cargo_timings.py target/cargo-timings/cargo-timing.html | tee -a "$GITHUB_STEP_SUMMARY"
          # The points build script's phases (seconds since it started), from the file it writes beside its output.
          for timing in target/debug/build/horizon-mod-points-*/out/points-timing.txt; do
