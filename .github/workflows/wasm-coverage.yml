name: wasm-coverage
# The full internals coverage (#1659): every crossable real internal has a compiling host binding and guest
# binding, generated from the real catalog and checked in one universal crate each. It alone takes about an
# hour on the OVH runners, so it runs once a day and on dispatch instead of on every main push (wasm-mods keeps
# the fast checks). A red run is a main break. Same shape as the daily prebuilt game.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for coverage verification
        type: choice
        default: auto
        options: [auto, ubuntu-latest, dyna-large]
permissions:
  contents: read
  actions: read
concurrency:
  group: wasm-coverage
  cancel-in-progress: false
env:
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  # The same runner choice dyna-checks makes: Dyna's large runner while the pool is up, else GitHub's.
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
      # The pool's switch and lease are read live: `vars` is fixed when the run is created, and a main run
      # that waits in the concurrency group would otherwise see a lease that expired while it waited.
      # A fork's pull request gets no token to read them and stays on GitHub's runners.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" = true ]; then
            ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_SELF_HOSTED" -q .value 2>/dev/null || true)
            LEASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/DYNA_CI_POOL_UNTIL" -q .value 2>/dev/null || true)
          fi
          # A refused read prints GitHub's error JSON: keep only a well-formed answer, else use the snapshot.
          case "${LEASE:-}" in '' | *[!0-9]*) LEASE= ;; esac
          case "${ENABLED:-}" in true | false) ;; *) ENABLED= ;; esac
          echo "pool lease: live=${LEASE:-unreadable} snapshot=${VARS_LEASE:-none}"
          ENABLED=${ENABLED:-$VARS_ENABLED} LEASE=${LEASE:-$VARS_LEASE} bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"

  wasm-coverage:
    needs: runner
    runs-on: ${{ inputs.runner != '' && inputs.runner != 'auto' && inputs.runner || (needs.runner.outputs.self_hosted == 'true' && 'dyna-large' || 'ubuntu-latest') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Dyna dependencies (install fallback without root)
        if: runner.environment != 'github-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchains and the ALSA and udev headers
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
          fi
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup toolchain install 1.99.1 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: wasm-mods
          # Every fixture uses this workspace's target, so its std and shared dependencies
          # are cached once rather than in seven independent target directories.
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Unlike rust-cache, retain the staged workspace artifacts and source mtimes.
      # Dyna's target symlink already persists these directories between jobs.
      - uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'
        id: coverage-cache
        with:
          path: |
            target/internals-catalog-coverage
            target/internals-catalog-check
          key: internals-coverage-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            internals-coverage-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            internals-coverage-v1-${{ runner.os }}-
      - name: Every crossable real internal has compiling host and guest bindings
        run: |
          export HORIZON_COVERAGE_WASM_CARGO="$(rustup which --toolchain 1.99.1 cargo)"
          export HORIZON_COVERAGE_WASM_RUSTC="$(rustup which --toolchain 1.99.1 rustc)"
          cargo +stable test -j4 -p horizon-mod-api-gen --lib guest_compiler_ignores_another_toolchains_driver -- --ignored --nocapture
          cargo +stable test -j4 -p horizon-mod-api-gen --lib real_catalog_has_compiling_host_and_guest_bindings -- --ignored --nocapture
      - uses: actions/cache/save@v4
        if: runner.environment == 'github-hosted' && steps.coverage-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target/internals-catalog-coverage
            target/internals-catalog-check
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}
