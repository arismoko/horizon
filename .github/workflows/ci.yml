name: checks
# verify: a full check on GitHub's runners of main every 6 hours, of a ref by hand (`gh workflow run checks -f
# verify=true`), and of a pull request when a maintainer adds the label `ci:verify`. A push to a pull request gets
# dyna-checks' cheap checks only (format, verify-static), and rollups, syncs and main's pushes its heavy gate on Dyna's
# runners (.github/workflows/dyna-ci.yml, tools/ci/pr_gate.py): a fork's pull requests ran verify on every push and held
# the organisation's hosted runners ahead of the release jobs (2026-11-18). The label stays on the pull request: a
# fork's run gets a read-only token, so nothing here can remove it, and no write token is ever given to a fork's code
# (no pull_request_target). To run it again, remove the label and add it again. The scheduled run also tries main on the
# newest stable Rust and saves the Rust caches it reads. A dispatch without `verify` runs only the by-hand jobs at the
# end. See docs/release-flow.md.
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      verify:
        description: Run verify on this ref instead of the by-hand jobs
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.sha }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  SUNRISE_TELEMETRY_URL: "off"
jobs:
  # Which jobs a maintainer-requested fork check needs, from the complete base/head diff
  # (tools/ci/rust_changes.py). Every verification part uses this one decision. Missing event commits, an
  # unavailable diff, or a failed selection keep all parts. Scheduled and manual verification stay full.
  changes:
    if: github.event.label.name == 'ci:verify' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rust_required: ${{ steps.selection.outputs.rust_required }}
      tooling_required: ${{ steps.selection.outputs.tooling_required }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch this commit's history for selection
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history for selection
          # The diff reads commits and two trees, which Git fetches when it first reads them (tools/ci/history_fetch.sh).
          HISTORY_FILTER: tree:0
        run: bash tools/ci/history_fetch.sh
      - name: Select the jobs this pull request needs
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --all "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  # verify runs as three jobs side by side, so a run takes as long as its slowest part (the Rust tests), not the sum:
  # one job doing them in turn took 14-21 minutes on GitHub's runners (main's run 43595807302: 859 s). `verify` waits
  # for the three and passes only when each passed. It runs even in a cancelled run
  # (`always()`), so it fails there instead of being skipped. A failed part re-runs alone ("Re-run failed jobs").
  #
  verify-tree:
    name: verify (tree and tools)
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'schedule' || inputs.verify ||
      github.event.label.name == 'ci:verify' && (needs.changes.outputs.tooling_required != 'false' || needs.changes.outputs.rust_required != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Keep game artifacts out of Git
        run: |
          python tools/check_public_tree.py
          python tools/check_public_tree.py --history
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        run: python3 tools/check_layers.py
      # docs/layers.md#built-in-addresses: every built-in outside address in the Sunrise layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        run: python3 tools/check_addresses.py
      - name: Check the mod API type boundary (including negative control)
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Vocabulary state has explicit ownership
        run: python3 tools/check_mod_vocabulary_state.py
      - name: Test offline research tooling
        run: python -m unittest discover -s tests -v
  verify-lint:
    name: verify (format and lint)
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'schedule' || inputs.verify ||
      github.event.label.name == 'ci:verify' && (needs.changes.outputs.rust_required != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies checked by clippy, saved by the scheduled runs on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting and lint
        run: |
          cargo +stable fmt --all -- --check
          find crates/sunrise-mod-api/src crates/sunrise-mod-vocab/src -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --check --config skip_children=true
          find crates/sunrise-gameplay-common/src crates/sunrise-gameplay/src crates/sunrise-client-gameplay/src crates/sunrise-client/src/cut_layout -name '*.rs' -print0 | xargs -0 rustup run stable rustfmt --edition 2024 --config skip_children=true --check
          rustup run stable rustfmt --edition 2024 --check crates/sunrise-mod-api-gen/dispatch-tests/src/fixtures/*.rs crates/sunrise-mod-api-gen/dispatch-tests/src/fixtures/*/*.rs
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          # The server build (released as sunrise-engine): the game without sound or controllers.
          cargo +stable clippy -p sunrise-client -p sunrise-game -p sunrise-mod-host --all-targets --locked --no-default-features -- -D warnings
      - name: Check generated mod API signatures
        run: python3 tools/ci/check_api_boundary.py
  verify-test:
    name: verify (Rust tests)
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'schedule' || inputs.verify ||
      github.event.label.name == 'ci:verify' && (needs.changes.outputs.rust_required != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      # Dependencies and the workspace's own build, saved by the scheduled runs on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which verify-lint's clippy
      # type-checks.
      # cargo test --locked, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Build the runtime holder test actor
        run: cargo +stable build -p sunrise-mod-package --features runtime-process --example holder_actor
      - name: Test Rust core and voxel kernel correctness
        run: |
          cargo +stable test --locked --workspace --lib --bins --tests
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
          # recompiling the workspace with a different dependency graph.
          cargo +stable test --locked --workspace --lib --bins --tests mod_content::tests:: -- --ignored
          cargo +stable test --locked --workspace --doc
  verify:
    needs: [verify-tree, verify-lint, verify-test]
    # Skipped with its parts on a dispatch of the by-hand jobs and on another label; otherwise it runs even in a
    # cancelled run.
    if: always() && (github.event_name == 'schedule' || inputs.verify || github.event.label.name == 'ci:verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed or had nothing to do
        env:
          TREE: ${{ needs.verify-tree.result }}
          LINT: ${{ needs.verify-lint.result }}
          TEST: ${{ needs.verify-test.result }}
        run: |
          echo "tree and tools: $TREE, format and lint: $LINT, Rust tests: $TEST"
          for result in "$TREE" "$LINT" "$TEST"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
  jfr-analysis:
    if: github.event_name == 'workflow_dispatch' && !inputs.verify
    runs-on: [self-hosted, linux, sunrise-game]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify streaming JFR analysis against the JDK exporter
        run: python tools/test_jfr.py
      - name: Verify ZGC pause and allocation event interpretation
        run: python tools/test_jfr.py --gc zgc
