name: board
# Keeps the Horizon roadmap board (https://github.com/users/arismoko/projects/1) in step with
# this repository's issues and PRs. The logic is .github/scripts/board-sync.js. It needs the
# PROJECT_TOKEN secret (a token with Projects read/write on the arismoko account); without it the
# job is skipped. It checks out no PR code, so pull_request_target is safe here.
on:
  issues:
    types: [opened, reopened, closed, assigned, unassigned, pinned, unpinned, transferred]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board
  # A running sync finishes; newer events wait as one pending run (GitHub keeps only the latest).
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: '[ -n "$PROJECT_TOKEN" ] && echo set=1 >> "$GITHUB_OUTPUT" || echo "::notice::PROJECT_TOKEN is not set; board sync skipped."'
      # A /claim comment assigns through claim-command.yml at the same moment; give it a head start.
      - if: steps.token.outputs.set && github.event_name == 'issue_comment'
        run: sleep 20
      - if: steps.token.outputs.set
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - if: steps.token.outputs.set
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: await require('./.github/scripts/board-sync.js')({ github, context, core })
