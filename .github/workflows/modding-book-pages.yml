name: modding-book-pages
# Publishes the modding book and the mod API reference to GitHub Pages
# (https://arismoko.github.io/horizon/, reference under /api/mod_api/).
on:
  push:
    branches: [main]
    paths: ["docs/modding/**", "crates/horizon-mod-api/**", "crates/horizon-mod-api-gen/**", "xtask/**", "tools/*modding*", "tests/test_modding_*.py"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Rust (tools/ci/rust-version)
        run: bash tools/ci/rustup_install.sh --profile minimal
      - run: cargo install mdbook --locked --version 0.4.52
      - run: mdbook build docs/modding
      - run: python3 tools/modding_concept_pages.py --html target/modding-book
      - run: cargo doc -p horizon-mod-api --no-deps
      # book.toml sets build-dir = "../../target/modding-book".
      - run: cp -r target/doc target/modding-book/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/modding-book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
