name: merge updates
# Posts each rollup and upstream-sync pull request to the team's Discord channel when it is
# labelled `rollup` or `sync` (opened) and when it merges: tools/ci/merge_updates.py.
on:
  pull_request_target:
    types: [labeled, closed]
permissions: {}
jobs:
  post:
    if: >-
      github.event.pull_request.head.repo.full_name == 'arismoko/horizon' &&
      github.event.pull_request.user.login == github.repository_owner && (
      (github.event.action == 'labeled' && (github.event.label.name == 'rollup' || github.event.label.name == 'sync')) ||
      (github.event.action == 'closed' && github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'rollup') || contains(github.event.pull_request.labels.*.name, 'sync'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post
        # A post that fails (Discord down, no webhook) never fails anything.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ github.event.action == 'labeled' && github.event.label.name || (contains(github.event.pull_request.labels.*.name, 'rollup') && 'rollup' || 'sync') }}
          STATE: ${{ github.event.action == 'closed' && 'merged' || 'opened' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          WEBHOOK: ${{ secrets.DISCORD_MERGE_WEBHOOK }}
        run: |
          gh api "repos/$REPO/contents/tools/ci/merge_updates.py?ref=main" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/merge_updates.py"
          python3 "$RUNNER_TEMP/merge_updates.py"
