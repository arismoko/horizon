name: ignored-tests
# The #[ignore]d library tests that need the prepared vanilla data, which verify doesn't have. Run by the daily run
# (daily.yml) and by hand, never on pull requests or main pushes (CI tiers, owner 2026-11-13).
#   gh workflow run ignored-tests.yml --ref <branch>
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to test (the daily run's)
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  SUNRISE_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  plan:
    # Every shard waits for this job: on Dyna's small runner while the repository's switch is on, as dyna-checks'
    # `changes`, so the shards never queue behind GitHub's runners first (23 minutes on 2026-11-16).
    runs-on: ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && 'dyna-small' || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read  # the attempt's creation or start time (tools/ci/dyna_ci_route.sh)
    timeout-minutes: 5
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      # Dyna's runner image has no GitHub CLI; GitHub's runners do.
      - name: GitHub CLI
        run: bash tools/ci/ensure_gh.sh
      # The pool's switch and lease (tools/ci/dyna_ci_route.sh): a snapshot is judged at the attempt's creation (a re-run's start), so a
      # run that waited in a concurrency group or GitHub's queue is not sent off the pool by a lease that lapsed
      # meanwhile.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          # Only dispatches (the daily run's included) run this workflow, from this repository.
          SAME_REPO: true
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_route.sh >> "$GITHUB_OUTPUT"
      - name: The ignored-tests shard matrix
        id: matrix
        run: python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"
  # Dyna's large runner holds the prepared vanilla data. Every shard runs, with one package per shard (the plan
  # lives in tools/ci/ignored_shards.py). tools/ci/ignored_tests.py fails on a new failure and on a known one that
  # passes, and prints only test names and results: the data is Mojang's.
  ignored-tests-shards:
    needs: plan
    if: needs.plan.outputs.self_hosted == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Owner-approved stopgap: #2944 removes this when the legs run under 15 minutes.
    runs-on: ${{ (matrix.shard == 'sunrise-client#1of2' || matrix.shard == 'sunrise-client#2of2') && 'dyna-xlarge' || 'dyna-large' }}
    # Temporary: #2944 brings client data legs under 15 minutes and restores the 60-minute cap.
    # Interim: 180 so the client legs finish and report at all (the 2026-11-13 dry run's #1of2 was killed at 90 with
    # 61 tests past 60 s). Cutting the slow client tests (#4022's next change) brings it back down.
    timeout-minutes: ${{ (matrix.shard == 'sunrise-client#1of2' || matrix.shard == 'sunrise-client#2of2') && 180 || 60 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The daily run's commit; empty (this event's commit) on a dispatch of this workflow.
          ref: ${{ inputs.commit }}
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Record data-leg start and compiler cache
        run: |
          date -u '+data-leg start utc=%Y-%m-%dT%H:%M:%SZ'
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Prepare and verify the dedicated server profile from Mojang's pinned jar
        if: matrix.shard == 'daily-rows'
        run: |
          # Only pinned downloads persist, by SHA-1 inside this repository's private cache.
          mkdir -p "$DYNA_CI_KEEP/mojang-server" .local
          ln -s "$DYNA_CI_KEEP/mojang-server" .local/server-downloads
          version=$(python3 -c 'import json; print(json.load(open("research-lock.json"))["minecraft"]["version"])')
          profile="$PWD/game-files/sunrise-client/${version}-server"
          cargo build --release --locked -p sunrise-prepare
          preparer="${CARGO_TARGET_DIR:-target}/release/sunrise-prepare"
          python3 tools/ci/preparation_step.py resource-export "$RUNNER_TEMP/server-prepare.log" \
            "$preparer" --server --output "$profile"
          "$preparer" --server --check --output "$profile" > "$RUNNER_TEMP/server-check.log" 2>&1 || {
            echo '::error::sunrise-prepare --server --check refused the prepared server profile'; exit 1;
          }
          python3 tools/prepare_output.py check --server "$profile"
          echo "SUNRISE_TEST_SERVER_PROFILE=$profile" >> "$GITHUB_ENV"
      # Missing data fails the leg.
      - name: Prepare checkout-keyed vanilla data
        id: data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for dir in minecraft datagen sunrise-client tools; do
            if [ ! -d "/cache/sunrise-local/$dir" ]; then
              echo "prepared data unavailable on this runner"
              echo "Prepared data unavailable: $dir ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
      - name: Retain typed preparation diagnostics only
        if: failure() && steps.data.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: preparation-diagnostic-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/prepare-build.diagnostic.json
            ${{ runner.temp }}/prepare.diagnostic.json
            ${{ runner.temp }}/seed-extras.diagnostic.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate the fishing test's vanilla reference inputs
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'sunrise-client' || startsWith(matrix.shard, 'sunrise-client#') || matrix.shard == 'sunrise-gameplay' || startsWith(matrix.shard, 'sunrise-gameplay#'))
        run: |
          reference=$(mktemp -d "$RUNNER_TEMP/fishing-reference.XXXXXX")
          python3 tools/test_fishing_rng_parity.py --prepare-reference "$reference" --env-file "$GITHUB_ENV"
      - name: Generate the game-mode split tests' vanilla witness
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'sunrise-client' || startsWith(matrix.shard, 'sunrise-client#'))
        run: |
          witness=$(mktemp -d "$RUNNER_TEMP/gamemode-split-witness.XXXXXX")
          python3 tools/test_gamemode_split_parity.py --prepare-witness "$witness" --env-file "$GITHUB_ENV"
      - name: Generate the crosshair pick tests' vanilla witness
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'sunrise-client' || startsWith(matrix.shard, 'sunrise-client#'))
        run: |
          witness=$(mktemp -d "$RUNNER_TEMP/crosshair-pick-witness.XXXXXX")
          python3 tools/test_crosshair_pick_parity.py --prepare-witness "$witness" --env-file "$GITHUB_ENV"
      - name: Generate the network parity tests' vanilla witnesses
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'sunrise-client' || startsWith(matrix.shard, 'sunrise-client#') || matrix.shard == 'sunrise-client-lib' || startsWith(matrix.shard, 'sunrise-client-lib#') || matrix.shard == 'sunrise-gameplay-common' || startsWith(matrix.shard, 'sunrise-gameplay-common#') || matrix.shard == 'daily-rows')
        run: |
          witness=$(mktemp -d "$RUNNER_TEMP/network-witness.XXXXXX")
          python3 tools/ci/with_xvfb.py python3 tools/test_network_parity.py --prepare-witness "$witness" --env-file "$GITHUB_ENV"
      - name: Generate the item glint tests' vanilla witness
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'sunrise-client-lib' || startsWith(matrix.shard, 'sunrise-client-lib#') || matrix.shard == 'sunrise-client' || startsWith(matrix.shard, 'sunrise-client#') || matrix.shard == 'sunrise-client-gameplay' || startsWith(matrix.shard, 'sunrise-client-gameplay#'))
        run: |
          python3 tools/ci/with_xvfb.py python3 tools/test_glint_parity.py --record-only
          echo "SUNRISE_ITEM_GLINT_WITNESS=$PWD/.local/witness/26.3/glint/witness.json" >> "$GITHUB_ENV"
      - name: Run the ignored tests that need prepared data
        if: steps.data.outputs.present != 'false'
        env:
          SHARD: ${{ matrix.shard }}
          SUNRISE_DATA_LEG_TIMING: '1'
          # The mesher and section-visibility tests read the prepared data from their own variable.
          SUNRISE_MESH_TEST_RESOURCES: ${{ github.workspace }}/.local/sunrise-client/26.3
          IGNORED_TESTS_PRIVATE_LOGS: ${{ runner.temp }}/ignored-tests-private
        run: |
          export SUNRISE_TEST_RESOURCES="$PWD/.local/sunrise-client/26.3"
          python3 tools/ci/with_xvfb.py python3 tools/ci/ignored_tests.py --report "$RUNNER_TEMP/daily-report.json" "$SHARD"
      # The public log withholds panic payloads (they can carry vanilla data); a failed run's full output is copied
      # into this host's keep, as parity.yml keeps a failed share's logs, with the same three-day retention.
      - name: Keep a failed run's full output beyond this slot
        if: always()
        env:
          PRIVATE_LOGS: ${{ runner.temp }}/ignored-tests-private
          NAME: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: |
          [ -n "${DYNA_CI_KEEP:-}" ] || exit 0
          root="$DYNA_CI_KEEP/ignored-tests-failed-logs"
          if [ -d "$PRIVATE_LOGS" ] && [ -n "$(ls -A "$PRIVATE_LOGS")" ]; then
            mkdir -p "$root"
            rm -rf -- "${root:?}/$NAME"
            cp -a "$PRIVATE_LOGS" "$root/$NAME"
            echo "the failed tests' full output is kept in the host's keep: ignored-tests-failed-logs/$NAME"
          fi
          [ -d "$root" ] && find "$root" -mindepth 1 -maxdepth 1 -type d -mmin +4320 -exec rm -rf {} + || true
      # The leg's verdict for the daily summary: test names, panic locations and policy only (ignored_tests.py --report).
      - name: Upload the leg report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/daily-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record data-leg end and compiler cache
        if: always()
        run: |
          date -u '+data-leg end utc=%Y-%m-%dT%H:%M:%SZ'
          # Whole-job cgroup high-water: compilation, tests and file cache, not per-test RSS
          # or an isolated test-execution peak. Fixed kernel files only; telemetry is best effort.
          echo 'data-leg memory_scope=whole_job_cgroup_including_compilation_tests_file_cache'
          for metric in memory.peak memory.max memory.swap.peak memory.swap.max; do
            field="${metric//./_}_bytes"
            value=unavailable
            if IFS= read -r sample 2>/dev/null < "/sys/fs/cgroup/$metric"; then
              if [[ "$sample" =~ ^[0-9]+$ || "$sample" == max ]]; then
                value="$sample"
              fi
            fi
            echo "data-leg $field=$value"
          done
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
