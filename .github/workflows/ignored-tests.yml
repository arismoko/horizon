name: ignored-tests
# The #[ignore]d library tests that need the prepared vanilla data, which verify doesn't have. Run by the daily run
# (daily.yml) and by hand, never on pull requests or main pushes (CI tiers, owner 2026-11-13).
#   gh workflow run ignored-tests.yml --ref <branch>
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to test (the daily run's)
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          # Only dispatches (the daily run's included) run this workflow, from this repository.
          SAME_REPO: true
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - name: The ignored-tests shard matrix
        id: matrix
        run: python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"
  # Dyna's large runner holds the prepared vanilla data. Every shard runs, with one package per shard (the plan
  # lives in tools/ci/ignored_shards.py). tools/ci/ignored_tests.py fails on a new failure and on a known one that
  # passes, and prints only test names and results: the data is Mojang's.
  ignored-tests-shards:
    needs: plan
    if: needs.plan.outputs.self_hosted == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Owner-approved stopgap: #2944 removes this when the legs run under 15 minutes.
    runs-on: ${{ (matrix.shard == 'horizon-client#1of2' || matrix.shard == 'horizon-client#2of2') && 'dyna-xlarge' || 'dyna-large' }}
    # Temporary: #2944 brings client data legs under 15 minutes and restores the 60-minute cap.
    # Interim: 180 so the client legs finish and report at all (the 2026-11-13 dry run's #1of2 was killed at 90 with
    # 61 tests past 60 s). Cutting the slow client tests (#4022's next change) brings it back down.
    timeout-minutes: ${{ (matrix.shard == 'horizon-client#1of2' || matrix.shard == 'horizon-client#2of2') && 180 || 60 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The daily run's commit; empty (this event's commit) on a dispatch of this workflow.
          ref: ${{ inputs.commit }}
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Record data-leg start and compiler cache
        run: |
          date -u '+data-leg start utc=%Y-%m-%dT%H:%M:%SZ'
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # Missing data fails the leg.
      - name: Prepare checkout-keyed vanilla data
        id: data
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for dir in minecraft datagen horizon-client tools; do
            if [ ! -d "/cache/horizon-local/$dir" ]; then
              echo "prepared data unavailable on this runner"
              echo "Prepared data unavailable: $dir ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      - name: Retain typed preparation diagnostics only
        if: failure() && steps.data.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: preparation-diagnostic-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/prepare-build.diagnostic.json
            ${{ runner.temp }}/prepare.diagnostic.json
            ${{ runner.temp }}/seed-extras.diagnostic.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Generate the fishing test's vanilla reference inputs
        if: steps.data.outputs.present != 'false' && (matrix.shard == 'horizon-client' || startsWith(matrix.shard, 'horizon-client#'))
        run: |
          reference=$(mktemp -d "$RUNNER_TEMP/fishing-reference.XXXXXX")
          python3 tools/test_fishing_rng_parity.py --prepare-reference "$reference" --env-file "$GITHUB_ENV"
      - name: Run the ignored tests that need prepared data
        if: steps.data.outputs.present != 'false'
        env:
          SHARD: ${{ matrix.shard }}
          HORIZON_DATA_LEG_TIMING: '1'
        run: |
          export HORIZON_TEST_RESOURCES="$PWD/.local/horizon-client/26.3"
          python3 tools/ci/with_xvfb.py python3 tools/ci/ignored_tests.py --report "$RUNNER_TEMP/daily-report.json" "$SHARD"
      # The leg's verdict for the daily summary: test names, panic locations and policy only (ignored_tests.py --report).
      - name: Upload the leg report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/daily-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record data-leg end and compiler cache
        if: always()
        run: |
          date -u '+data-leg end utc=%Y-%m-%dT%H:%M:%SZ'
          # Whole-job cgroup high-water: compilation, tests and file cache, not per-test RSS
          # or an isolated test-execution peak. Fixed kernel files only; telemetry is best effort.
          echo 'data-leg memory_scope=whole_job_cgroup_including_compilation_tests_file_cache'
          for metric in memory.peak memory.max memory.swap.peak memory.swap.max; do
            field="${metric//./_}_bytes"
            value=unavailable
            if IFS= read -r sample 2>/dev/null < "/sys/fs/cgroup/$metric"; then
              if [[ "$sample" =~ ^[0-9]+$ || "$sample" == max ]]; then
                value="$sample"
              fi
            fi
            echo "data-leg $field=$value"
          done
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
