name: wasm-mods
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/cargo-horizon-mod/**'
      - 'crates/horizon-mod-*/**'
      - '.github/workflows/wasm-mods.yml'
      - 'tools/generate_wire_enum_goldens.py'
      - 'tools/capture_wire_enum_layouts.py'
      - 'tools/fixtures/wire_enum_layouts.json'
      - 'tools/fixtures/wire_enum_baseline_identities.json'
      - 'tests/test_wire_enum_goldens.py'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
# Finish running main checks; keep only the newest pending push. Obsolete PR runs still cancel.
concurrency:
  group: wasm-mods-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fixture:
    # Drafts skip it: the shared runners go to ready PRs (CI rule, 2026-11-08).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'dyna-large' }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Configure persistent build targets
        shell: bash
        run: |
          # Dyna supplies a persistent target mount; hosted runners use the checkout.
          target="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          mkdir -p "$target"
          if [[ "$target" != "$GITHUB_WORKSPACE/target" ]]; then
            ln -s "$target" "$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          if [[ '${{ runner.environment }}' != 'github-hosted' ]]; then
            # build-std fingerprints rust-src mtimes, including its build scripts.
            # Keep the toolchain beside its artifacts across ephemeral runners.
            echo "RUSTUP_HOME=$target/rustup" >> "$GITHUB_ENV"
          fi
          cache="$target/wasm-fixtures"
          if [[ '${{ runner.environment }}' == 'github-hosted' ]]; then
            cache="$GITHUB_WORKSPACE/.wasm-fixture-targets"
          fi
          # Keep generated workspaces real: Cargo cannot discover their members
          # through a target symlink. Each member still has its own workspace and
          # link invocation. PRs reuse dependency artifacts; main also exercises
          # independent dependency compilation in the original per-member targets.
          for member in fixture library-fixture/{library,observer,dependent} groups/{counter_lib,alpha,beta,gamma,hog}; do
            root="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/$member/target/horizon-mod"
            mkdir -p "$root"
            artifacts="$cache/shared"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              artifacts="$cache/$member"
            fi
            for artifact in horizon-wasm wasm32-unknown-unknown std-artifacts; do
              mkdir -p "$artifacts/$artifact"
              ln -s "$artifacts/$artifact" "$root/$artifact"
            done
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rust-src, rustfmt
          targets: wasm32-unknown-unknown
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          # These custom-profile targets belong to staged, independent workspaces.
          cache-directories: .wasm-fixture-targets
      - name: Check fieldless Wire layout coverage and hashes
        shell: bash
        run: |
          python3 -m unittest tests.test_wire_enum_goldens
          mkdir -p "$CARGO_TARGET_DIR/wire-goldens"
          env -u RUSTC_WRAPPER RUSTC_BOOTSTRAP=1 cargo rustc --locked -p horizon-mod-vocab --lib -- \
            -Zunpretty=expanded > "$CARGO_TARGET_DIR/wire-goldens/expanded.rs"
          python3 tools/generate_wire_enum_goldens.py \
            --expanded "$CARGO_TARGET_DIR/wire-goldens/expanded.rs" --check
          cargo test --locked -p horizon-mod-vocab --lib existing_fieldless_enum_layouts_match_baseline
      - name: Compile and test emitted point records
        run: |
          manifest=crates/horizon-mod-point-shape/tests/record-wire/Cargo.toml
          cargo test --manifest-path "$manifest" --features wasm-guest --locked
          cargo check --manifest-path "$manifest" --features wasm-guest --target wasm32-unknown-unknown --locked
      - name: Build tool and shared member
        run: |
          cargo build -p cargo-horizon-mod
          cd crates/horizon-mod-wasm/tests/fixture
          "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod build --wasm --catalog points.json
          "$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod" horizon-mod wasm-std "$GITHUB_WORKSPACE/target/horizon-wasm-std.wasm" --catalog points.json
      - name: Validate and load the fixture
        env:
          HORIZON_WASM_FIXTURE: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/fixture/target/horizon-mod/wasm_fixture.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: |
          cargo test -p horizon-mod-api --features wasm-guest --lib guest_pool_
          cargo test -p horizon-mod-wasm --features listener-fixture --test real_member --test self_refusal --test native_listener --test no_wire_registration -- --include-ignored --nocapture
          cargo test -p horizon-mod-wasm --features listener-fixture --lib guest_input_pool_stays_flat_for_100k_no_import_calls -- --ignored --nocapture
      - name: Build independent library members
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod"
          root="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/library-fixture"
          for member in library observer dependent; do
            (cd "$root/$member" && "$tool" horizon-mod build --wasm --catalog "$root/points.json")
          done
      - name: Load independently built library members
        env:
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
          HORIZON_WASM_LIBRARY: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/library/target/horizon-mod/wasm_test_library.hmod
          HORIZON_WASM_OBSERVER: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/observer/target/horizon-mod/wasm_test_observer.hmod
          HORIZON_WASM_DEPENDENT: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/library-fixture/dependent/target/horizon-mod/wasm_test_dependent.hmod
        run: cargo test -p horizon-mod-wasm --test real_library -- --nocapture
      - name: Build the same-group capability members
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-horizon-mod"
          groups="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/groups"
          catalog="$GITHUB_WORKSPACE/crates/horizon-mod-wasm/tests/library-fixture/points.json"
          for member in counter_lib alpha beta gamma hog; do
            (cd "$groups/$member" && "$tool" horizon-mod build --wasm --catalog "$catalog")
          done
      - name: Load the group members
        env:
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
          HORIZON_WASM_GROUPS: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/groups
        run: cargo test -p horizon-mod-wasm --test groups -- --nocapture
      - name: Measure block entity boundary
        if: github.event_name == 'workflow_dispatch'
        env:
          HORIZON_WASM_FIXTURE: ${{ github.workspace }}/crates/horizon-mod-wasm/tests/fixture/target/horizon-mod/wasm_fixture.hmod
          HORIZON_WASM_STD: ${{ github.workspace }}/target/horizon-wasm-std.wasm
        run: cargo test --release -p horizon-mod-wasm --features listener-fixture --test bench block_entity_ticks -- --ignored --nocapture
