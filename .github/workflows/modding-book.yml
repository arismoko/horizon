name: modding-book
on:
  push:
    branches: [main]
    paths: ["docs/modding/**", "crates/horizon-mod-api/**", "crates/horizon-mod-api-gen/**", "xtask/**", "tools/*modding*", "tests/test_modding_*.py", "tools/ci/nightly.py", "crates/horizon-mod-package/src/sdk/**", "crates/horizon-mod-surface/**"]
  # A PR gets the book itself (concept-pages preprocessor and mdBook build), not the API doc and example builds.
  pull_request:
    # The generator and xtask render the hook-notes and coverage chapters at build time, from the
    # mod API's surface and catalog.
    paths: ["docs/modding/**", "crates/horizon-mod-api/**", "crates/horizon-mod-api-gen/**", "xtask/**", "tools/*modding*", "tests/test_modding_*.py", "tools/ci/nightly.py", "crates/horizon-mod-package/src/sdk/**", "crates/horizon-mod-surface/**", ".github/workflows/modding-book.yml"]
  workflow_dispatch:
jobs:
  book:
    # A contributor's pull request (its head in a fork) skips what compiles; a reviewer dispatches it (tools/ci/pr_gate.py).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Inert until the modding book exists on the branch.
      - id: book
        run: test -f docs/modding/book.toml && echo present=true >> "$GITHUB_OUTPUT" || true
      - name: The pinned Rust (tools/ci/rust-version)
        if: steps.book.outputs.present == 'true'
        run: bash tools/ci/rustup_install.sh --profile minimal
      - if: steps.book.outputs.present == 'true'
        run: cargo install mdbook --locked --version 0.4.52
      - if: steps.book.outputs.present == 'true'
        run: python3 -m unittest tests.test_modding_concept_pages tests.test_modding_hook_notes tests.test_modding_book_guard tests.test_modding_sdk_tables
      - if: steps.book.outputs.present == 'true'
        run: mdbook build docs/modding
      - if: steps.book.outputs.present == 'true'
        run: python3 tools/modding_concept_pages.py --html target/modding-book
      - if: steps.book.outputs.present == 'true' && github.event_name != 'pull_request'
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p horizon-mod-api --no-deps
      # The game's constructors live in the hidden `mod_api::__private`; no rustdoc page or link may name it.
      - name: Reject private paths in published docs
        if: steps.book.outputs.present == 'true'
        env:
          BOOK_EVENT: ${{ github.event_name }}
        run: |
          paths=(docs/modding/src target/modding-book)
          if [[ "$BOOK_EVENT" != pull_request ]]; then
            paths+=(target/doc/mod_api)
          fi
          for path in "${paths[@]}"; do
            test -d "$path"
          done
          # Only grep's no-match status is success; missing/unreadable paths must fail.
          status=0
          grep -rl __private "${paths[@]}" || status=$?
          test "$status" -eq 1
      - if: steps.book.outputs.present == 'true' && github.event_name != 'pull_request'
        run: cargo test -p horizon-modding-examples
      # book.toml sets build-dir = "../../target/modding-book", relative to docs/modding.
      - if: steps.book.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: modding-book
          path: target/modding-book
