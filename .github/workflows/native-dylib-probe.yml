name: native dylib linkage probe

# Full SDK proof is main-only; cheap Python contract tests remain in verify.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'third_party/**'
      - '.cargo/**'
      - 'packaging/windows/exe.rs'
      - 'packaging/executable_link.rs'
      - 'rust-toolchain*'
      - 'launcher/src/rust_toolchain.rs'
      - 'tools/ci/rust-version'
      - 'tools/prebuilt_game.py'
      - 'tools/native_dylib_probe.py'
      - 'tools/native_dylib_probe/**'
      - 'tools/native_probe_ci.py'
      - 'tools/ci/dyna_ci_deps.sh'
      - 'tools/ci/apt_retry.sh'
      - 'tools/ci/dyna_ci_runner.sh'
      - 'tools/ci/install_launcher_deps.sh'
      - '.github/workflows/native-dylib-probe.yml'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: native-dylib-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: select
        env:
          PROBE_SELECT: '1'
          GH_TOKEN: ${{ github.token }}
        run: python tools/native_probe_ci.py
  linkage:
    permissions:
      contents: read
    needs: select
    if: needs.select.outputs.selected == 'true'
    name: linkage ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Match the launcher's actual compiler host, not Windows MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && needs.select.outputs.self_hosted == 'true' && 'dyna-large' || matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      SDK_OUT: prebuilt
      PROBE_OUT: target/native-dylib-probe
      PROBE_PYTHON: ${{ matrix.os == 'ubuntu-22.04' && needs.select.outputs.self_hosted == 'true' && 'python3' || 'python' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Self-hosted image headers or rootless fallback
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Record exact head and select the launcher's pinned compiler
        id: rust
        run: |
          git rev-parse HEAD
          echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}-${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: native-dylib-probe-${{ matrix.target }}
      - name: Linux SDK prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: bash tools/ci/install_launcher_deps.sh libasound2-dev libudev-dev
      - name: Exact compiler identity
        run: rustc -vV
      - name: Allocate private persistent linkage workspace
        if: runner.environment == 'self-hosted'
        run: |
          umask 077
          mkdir -p "${CARGO_TARGET_DIR:?}"
          scratch=$(mktemp -d "$CARGO_TARGET_DIR/linkage.XXXXXX")
          {
            echo "LINKAGE_SCRATCH=$scratch"
            echo "CARGO_TARGET_DIR=$scratch/cargo"
            echo "SDK_OUT=$scratch/sdk"
            echo "PROBE_OUT=$scratch/probe"
          } >> "$GITHUB_ENV"
      - name: Build the unmodified prebuilt SDK topology
        run: >-
          "$PROBE_PYTHON" tools/prebuilt_game.py build "$SDK_OUT"
      - name: Export counts and Windows format limit
        run: >-
          "$PROBE_PYTHON" tools/prebuilt_game.py exports "$SDK_OUT"
      - name: Two mod libraries share the game's exact Rust state
        run: >-
          "$PROBE_PYTHON" tools/native_dylib_probe.py --sdk "$SDK_OUT" --output "$PROBE_OUT"
      - name: Probe command log
        if: failure()
        run: tail -n 120 "$PROBE_OUT/commands.log"
      - name: Clean private linkage workspace
        if: always() && runner.environment == 'self-hosted'
        run: |
          if [ -n "${LINKAGE_SCRATCH:-}" ]; then
            rm -rf "$LINKAGE_SCRATCH"
          fi

  main-break:
    needs: [select, linkage]
    if: always() && (needs.linkage.result == 'failure' || needs.select.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Main break and last green range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '## MAIN BREAK: native dylib probe failed; fast-path fix required.' >> "$GITHUB_STEP_SUMMARY"
          python tools/native_probe_ci.py
