name: native dylib linkage probe

# The full SDK proof: run by the daily run (daily.yml) and by dispatch, never on pull requests or main pushes
# (CI tiers, owner 2026-11-13); the cheap Python contract tests remain in verify.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dylib-probe-${{ inputs.commit && github.run_id || github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
  linkage:
    permissions:
      contents: read
    needs: route
    name: linkage ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Match the launcher's actual compiler host, not Windows MSVC.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && needs.route.outputs.self_hosted == 'true' && 'dyna-large' || matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      SDK_OUT: prebuilt
      PROBE_OUT: target/native-dylib-probe
      PROBE_PYTHON: ${{ matrix.os == 'ubuntu-22.04' && needs.route.outputs.self_hosted == 'true' && 'python3' || 'python' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - name: Self-hosted image headers or rootless fallback
        if: runner.environment == 'self-hosted' && runner.os == 'Linux'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Record exact head and select the launcher's pinned compiler
        id: rust
        run: |
          git rev-parse HEAD
          echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}-${{ matrix.target }}
          components: clippy
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: native-dylib-probe-${{ matrix.target }}
      - name: Linux SDK prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: bash tools/ci/install_launcher_deps.sh libasound2-dev libudev-dev
      - name: Exact compiler identity
        run: rustc -vV
      - name: Allocate private persistent linkage workspace
        if: runner.environment == 'self-hosted'
        run: |
          umask 077
          mkdir -p "${CARGO_TARGET_DIR:?}"
          scratch=$(mktemp -d "$CARGO_TARGET_DIR/linkage.XXXXXX")
          {
            echo "LINKAGE_SCRATCH=$scratch"
            echo "CARGO_TARGET_DIR=$scratch/cargo"
            echo "SDK_OUT=$scratch/sdk"
            echo "PROBE_OUT=$scratch/probe"
          } >> "$GITHUB_ENV"
      # Every build in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py). The SDK
      # stages and builds outside the checkout, beyond the Cargo config --cap writes, so the count also
      # goes to CARGO_BUILD_JOBS, as fn-replace-check does; 4 GiB per release rustc.
      - name: Cap build parallelism to the runner
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_BUILD_JOBS=$(python3 tools/ci/cargo_jobs.py --job-mib 4096 --cap)" | tee -a "$GITHUB_ENV"
      - name: Build the unmodified prebuilt SDK topology
        run: >-
          "$PROBE_PYTHON" tools/prebuilt_game.py build "$SDK_OUT"
      - name: Export counts and Windows format limit
        run: >-
          "$PROBE_PYTHON" tools/prebuilt_game.py exports "$SDK_OUT"
      - name: Two mod libraries share the game's exact Rust state
        run: >-
          "$PROBE_PYTHON" tools/native_dylib_probe.py --sdk "$SDK_OUT" --output "$PROBE_OUT"
      - name: The starter mod checks against the API source alone, host and wasm32
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          out="${LINKAGE_SCRATCH:-target}/api-source"
          rm -rf "$out"
          "$PROBE_PYTHON" tools/sdk_api_source.py build "$out"
          "$PROBE_PYTHON" tools/sdk_api_source.py check "$out"
      - name: Probe command log
        if: failure()
        run: tail -n 120 "$PROBE_OUT/commands.log"
      - name: Clean private linkage workspace
        if: always() && runner.environment == 'self-hosted'
        run: |
          if [ -n "${LINKAGE_SCRATCH:-}" ]; then
            rm -rf "$LINKAGE_SCRATCH"
          fi
