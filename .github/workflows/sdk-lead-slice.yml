name: sdk-lead-slice experiment
# Experiment only, on branch sdk-lead-slice (never main): an API-only native mod built from the API slice of
# the PUBLISHED prebuilt package and loaded through a replaceable mods library (experiments/slice/). It
# builds no game: it downloads the package and compiles only the experiment's small crates. No vanilla data.
on:
  push:
    branches: [sdk-lead-slice]
permissions:
  contents: read
env:
  SHA: afe471cf15df56439f23cd991d0d4b85563a14fc
jobs:
  slice:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - name: macos
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/slice
            tools/ci/rust-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}-${{ matrix.target }}
      # The launcher's own MinGW (launcher/src/rust_toolchain.rs MINGW), first on PATH.
      - name: WinLibs MinGW, as the launcher installs it
        if: runner.os == 'Windows'
        run: |
          curl -sSfL -o winlibs.zip https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r3.zip
          echo "62af32ea58acdea1318ea5dd8eb7017eaee694dd40b269d52a59c769dcfefb82  winlibs.zip" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP/winlibs" winlibs.zip > /dev/null
          echo "$RUNNER_TEMP/winlibs/mingw64/bin" >> "$GITHUB_PATH"
      - name: The published prebuilt package
        run: |
          archive=horizon-prebuilt-v5-${{ matrix.target }}.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/arismoko/horizon/releases/download/prebuilt-$SHA/$archive"
          ls -l "$RUNNER_TEMP/$archive"
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/sdk"
      - name: Tools
        run: |
          which gcc cc ar nm objdump rustc || true
          rustc -vV
          gcc --version | head -1 || true
      - name: Slice experiment
        run: python experiments/slice/slice.py "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/work" --seconds 60
