name: sdk publish
# The mod SDK's one publish step (docs/release-flow.md "Mod SDK"; design: /box/shared/sdk-lead/design.md §3): the
# release `sdk-<sha>` from the packing legs of prebuilt-game-build.yml in the caller's run (their `sdk-leg-*`
# artifacts). Only `publish` may write; the jobs that read the legs' output have `contents: read`. Called by the daily run
# after a green summary (daily.yml, sdk-publish) and by prebuilt-game.yml's hand dispatch.
# - `index` (no secrets): gathers every leg's assets once, after checking that each copy of the build data and the
#   surface is the same (tools/prebuilt_game.py gather), compares the surface with the SDK published before it on
#   this commit's history (horizon-stage surface-diff), writes the API source (tools/sdk_api_source.py), and writes
#   sdk.json over every asset (prebuilt_game.py index).
# - `sign` is the only job with the release key, and only on main with `publish` set (the `release` environment):
#   it checks out nothing but tools/ci/sign_release.sh, which hashes the assets and signs SHA256SUMS for the tag
#   `sdk-<sha>`, so the signature never passes for a game release (horizon-release-sign: sdk_digest), and refuses a
#   commit that is not on main. Any other run signs with a throwaway key.
# - `publish` checks the signature as the launcher does (horizon-release-sign verify) and that the release holds
#   exactly the assets a Nightly needs (tools/ci/nightly.py sdk-assets), then creates `sdk-<sha>`: only on main
#   with `publish` set. A branch run, or a dry run, publishes nothing.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit whose SDK the caller's packing legs built
        type: string
        required: true
      publish:
        description: Sign with the release key and create sdk-<sha> (on main only); otherwise a throwaway key, nothing published
        type: boolean
        default: false
permissions:
  contents: read
env:
  TAG: sdk-${{ inputs.commit }}
  COMMIT: ${{ inputs.commit }}
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, to find the SDK published before this one on it.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The launcher's pinned Rust
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          # The API source is checked for wasm32 too (tools/sdk_api_source.py build).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk-publish
      # Each leg's assets in a folder of its own (sdk-leg-<leg>), so a file two legs both made is seen, not
      # overwritten. Only the legs' artifacts: never this workflow's own from an earlier attempt.
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-leg-*
          path: legs
      - name: Gather the legs' assets, with one build data and surface
        run: python3 tools/prebuilt_game.py gather legs dist
      - name: The API source, with its generated code written out
        run: |
          python3 tools/sdk_api_source.py build "$RUNNER_TEMP/api-source"
          python3 tools/sdk_api_source.py archive "$RUNNER_TEMP/api-source" dist/api-source.tar.xz
      - name: Compare the surface with the SDK published before this one
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(python3 tools/ci/nightly.py sdk-previous "$COMMIT" previous-surface.json)
          echo "build=$previous" >> "$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            echo "### No SDK was published before $COMMIT on its history: sdk.json has no comparison" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The change notes added since that build: those its tree did not have.
          mkdir -p base
          if git cat-file -e "$previous:crates/horizon-mod-vocab/changes" 2> /dev/null; then
            git archive "$previous" crates/horizon-mod-vocab/changes | tar -x -C base
          fi
          # A stale note fails the PR report, not the publish: the diff is written either way.
          cargo run --locked --release -q -p horizon-mod-api-gen --bin horizon-stage -- surface-diff \
            previous-surface.json dist/surface.json --notes crates/horizon-mod-vocab/changes \
            --base-notes base/crates/horizon-mod-vocab/changes --json surface-diff.json | tee -a "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::a change note names an id that did not change since $previous"
          test -s surface-diff.json
      - name: Write sdk.json over every asset
        env:
          PREVIOUS: ${{ steps.previous.outputs.build }}
        run: python3 tools/prebuilt_game.py index dist ${PREVIOUS:+--previous "$PREVIOUS" surface-diff.json}
      # Overwritten by a rerun, so every later job reads this attempt's files.
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release
          path: dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  sign:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The key's only job, and only for a publishing run on main: sign_release.sh hashes the assets and signs with the
    # runner's OpenSSL, never running what the legs built.
    environment: ${{ inputs.publish && github.ref == 'refs/heads/main' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          # main's history without its files' contents: enough for the check below.
          fetch-depth: 0
          filter: blob:none
      # Where the key is: whatever the caller says, the real key signs only a commit of main.
      - name: The commit is on main
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        run: |
          git fetch -q --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main \
            || { echo "::error::$COMMIT is not on main: its SDK is not signed"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: dist
      - name: Sign SHA256SUMS for sdk-<sha>
        env:
          RELEASE_SIGNING_KEY: ${{ inputs.publish && github.ref == 'refs/heads/main' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ inputs.publish && github.ref == 'refs/heads/main' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
          EPHEMERAL: ${{ !(inputs.publish && github.ref == 'refs/heads/main') && 'yes' || '' }}
        run: bash tools/ci/sign_release.sh "$TAG" dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: ${{ !(inputs.publish && github.ref == 'refs/heads/main') }}
        with:
          name: sdk-ephemeral.pub
          path: dist/ephemeral.pub
          retention-days: 7
          overwrite: true

  publish:
    needs: [index, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # the sdk-<sha> release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISH: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdk-signature
          path: dist
      - uses: actions/download-artifact@v4
        if: env.PUBLISH != 'true'
        with:
          name: sdk-ephemeral.pub
          path: key
      - name: The signature, checked as the launcher checks it
        run: |
          key=(); [[ "$PUBLISH" != true ]] && key=(--key "$(cat key/ephemeral.pub)")
          cargo run --locked --quiet -p horizon-release-sign -- verify --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --publishing "${key[@]}" dist
      - name: Exactly the assets a Nightly needs
        run: |
          expected=$(python3 tools/ci/nightly.py sdk-assets | sort)
          actual=$(ls dist | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::not releasing $TAG: the assets are not exactly $(echo $expected) (found: $(echo $actual))"
            exit 1
          fi
      - name: Release sdk-<sha>
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "### $TAG is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" dist/* --target "$COMMIT" --prerelease --latest=false \
            --title "Mod SDK ${COMMIT::10}" \
            --notes "The mod SDK of game build $COMMIT: sdk.json lists every asset; SHA256SUMS is signed for $TAG."
      - name: Dry run, the SDK that would be published
        if: env.PUBLISH != 'true'
        run: |
          echo "### Would publish $TAG (a branch or dry run: signed with a throwaway key)" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
