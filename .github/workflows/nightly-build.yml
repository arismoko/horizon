name: nightly build
# A snapshot's run is named `snapshot build <commit>`: release_train.nightly_building tells the kinds apart by it.
run-name: ${{ inputs.kind == 'snapshot' && format('snapshot build {0}', inputs.base) || format('nightly build{0}', inputs.request && format(' (request {0})', inputs.request) || '') }}
# The Nightly, the only build Horizon ships since 2026-10-28 (docs/release-flow.md "Nightly"; Ludovic). When the batch
# train decides (release.yml, with the commit as `base`; the daily run calls it when every leg is green), and when a
# trusted reviewer asks (`/nightly 2640 2642`, nightly-command.yml), it builds main plus the pull requests the
# reviewers picked, merged in order (tools/ci/nightly_set.py), or main alone with none picked. Main is its newest
# commit where checks passed (or the `base` input), on the fork the commit `daily-green` points to, and no
# Nightly is published while a release-blocker is open. It publishes the result as the `nightly` pre-release, which every launcher and
# `horizon-server update` install. The previous nightly stays a week as nightly-<date>.
#
# Why the signing key never meets the pull requests' code:
# - `pick` merges the picked heads onto main with `git merge-tree --write-tree`: git objects only, no working tree,
#   so none of their files reaches the disk and no hook, filter or script of theirs runs. It refuses any pull
#   request that changes a path CODEOWNERS gives to Ludovic (this folder, tools/ci/, the signing and update code),
#   pushes the merge as nightly/build-<date>-<n> and saves the set on the nightly-state branch.
# - This file, game-build.yml and every script below run from main's copy: every dispatch names --ref main, and
#   `uses: ./…` takes the caller's commit. A picked pull request's own .github/ is never read.
# - `build` (game-build.yml, `trusted: false`) never reaches a release's tools: its macOS jobs run on the runner
#   that already runs pull requests' parity jobs, never the release runner; its Rust cache has its own key and is
#   never saved; and releases don't read the machine's shared sccache.
# - `build` (game-build.yml) checks out and compiles the merge with no secrets: its token reads contents only and
#   isn't kept in the checkout; the macOS programs are signed ad hoc (Developer ID needs the runner's keychain,
#   which stays locked for nightlies).
# - `sign` is the only job with RELEASE_SIGNING_KEY. It checks out nothing but main's tools/ci/sign_release.sh, which
#   runs the runner's sha256sum and OpenSSL over the archives: it hashes them, never runs them. The signed message
#   names the channel ("horizon release nightly"), so a nightly's signature can't pass for a release's.
# - `publish` verifies the signature with main's horizon-release-sign, checks the smoke test, and only then moves
#   the tag. Like sign, it never executes what build produced.
# - The source ships with the build: `pick` writes horizon-source.tar.gz with `git archive` (git objects again, nothing
#   run), `sign` signs it with the builds, and `publish` attaches it and tags the commit nightly-source/<date>-<short>
#   for good (the dated release and the build branch go after 7 days; native mods pin the commit: docs/native-mods.md).
#   gh workflow run "nightly build"                     # now (skips when the pick is the same commit as last night's)
#   gh workflow run "nightly build" -f force=true       # build and publish even if unchanged
#   gh workflow run "nightly build" -f dry_run=true     # build and sign with a throwaway key, publish nothing
# Dry picks use only nightly/dry-run-<run>-<attempt>, removed by always-run cleanup; nightly-state and real build
# numbering/quota stay untouched, including on a failed build. A hard-killed cleanup may leave only that isolated ref.
# By dispatch only: the daily run starts it through release.yml when every leg is green (CI tiers, owner 2026-11-13).
# kind=snapshot (release.yml kind snapshot, after it published the commit's SDK): the same build and signing for one
# commit of main with the gate green, alone (no picks, no build branch, no nightly-state, no daily cap, no
# release-blocker hold), signed for the `snapshot` channel and its version, and published as the pre-release
# snapshot-<date>-<short> ("Snapshot <date> · <short>"); never the `nightly` tag, its rotation or nightly-source tags.
# The newest snapshot, and every snapshot of the last 7 days, stay (nightly.py prune-snapshots).
on:
  workflow_dispatch:
    inputs:
      kind:
        description: nightly (the `nightly` channel) or snapshot (a commit of main, its own tag; release.yml starts it)
        type: choice
        options: [nightly, snapshot]
        default: nightly
      force:
        description: Build and publish even if tonight's pick is the commit already published
        type: boolean
        default: false
      dry_run:
        description: Build and sign with a throwaway key, publish nothing
        type: boolean
        default: false
      issue:
        description: The issue or pull request whose `/nightly` comment asked for this build (answered there)
        type: string
        default: ''
      request:
        description: The command's id, in the run's name so it can link the run
        type: string
        default: ''
      prs:
        description: A dry run's own set, `2640@<head> 2642@<head>` (the saved set stays)
        type: string
        default: ''
      base:
        description: The commit of main to build on (default main's newest with green checks; on the fork the daily-green commit, and only it)
        type: string
        default: ''
      urgent:
        description: Past the day's cap of 12 builds (the train, for a release-now pull request or a forced run)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # One build at a time. A newer request replaces one still waiting: it builds the set as it is by then, so no pick
  # is lost.
  # Snapshots have groups of their own (real and dry apart), so one never replaces a waiting Nightly.
  group: ${{ inputs.kind == 'snapshot' && format('snapshot-build{0}', inputs.dry_run && '-dry-run' || '') || 'nightly-build' }}
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # nightly/build-<date>-<n> and the nightly-state branch (main is protected)
      issues: write         # says in the thread when the picked pull requests conflict
      pull-requests: write
      actions: read         # main's newest green checks and parity-main runs (the base)
    outputs:
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.pick.outputs.sha }}
      short: ${{ steps.pick.outputs.short }}
      source: ${{ steps.pick.outputs.source }}
      date: ${{ steps.pick.outputs.date }}
      version: ${{ steps.pick.outputs.version }}
      nightly: ${{ steps.pick.outputs.nightly }}
      source_tag: ${{ steps.pick.outputs.source_tag }}
      tag: ${{ steps.pick.outputs.tag }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: mode
        # A dry run never publishes; a hand-started run off main is always one.
        run: echo "dry_run=${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref != 'refs/heads/main') }}" >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ (inputs.force || steps.mode.outputs.dry_run == 'true') && 'yes' || '' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NIGHTLY_ISSUE: ${{ inputs.issue }}
          NIGHTLY_PRS: ${{ inputs.prs }}
          NIGHTLY_BASE: ${{ inputs.base }}
          NIGHTLY_URGENT: ${{ inputs.urgent }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py pick --kind "$KIND" ${FORCE:+--force} | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; cat nightly-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Old nightly/build-* branches deleted (real runs only)
        # Ludovic, 2026-10-27: older than 7 days, but never the newest build or one a published nightly points to;
        # nothing but nightly/build-* (nightly.py stale_builds, tests/test_nightly.py).
        if: steps.mode.outputs.dry_run != 'true' && inputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### nightly/build-* branches"; python3 tools/ci/nightly.py prune-builds --days 7; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The source of the build (horizon-source.tar.gz)
        if: steps.pick.outputs.build == 'true'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: git archive --format=tar.gz --prefix="horizon-${SHA:0:7}/" -o horizon-source.tar.gz "$SHA"
      - uses: actions/upload-artifact@v7
        if: steps.pick.outputs.build == 'true'
        with:
          name: horizon-source
          path: horizon-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-notes
          path: nightly-notes.md
          retention-days: 3
      # The fork's Nightly is exactly an SDK's build, and carries that SDK's index in its signed sums, so a game's build
      # id and SDK come from the game release itself (checked against sdk-<sha>'s SHA256SUMS here).
      - name: The SDK index the Nightly carries (sdk.json of sdk-<sha>)
        if: steps.pick.outputs.build == 'true' && github.repository == 'arismoko/horizon' && steps.pick.outputs.sdk != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: python3 tools/ci/nightly.py sdk-index "$SHA" sdk.json
      - uses: actions/upload-artifact@v7
        if: steps.pick.outputs.build == 'true' && github.repository == 'arismoko/horizon' && steps.pick.outputs.sdk != 'false'
        with:
          name: horizon-sdk-index
          path: sdk.json
          if-no-files-found: error
          retention-days: 3

  build:
    needs: pick
    if: needs.pick.outputs.build == 'true'
    uses: ./.github/workflows/game-build.yml
    with:
      ref: ${{ needs.pick.outputs.sha }}
      version: ${{ needs.pick.outputs.version }}
      nightly: ${{ needs.pick.outputs.nightly }}
      developer_id: false
      trusted: false  # it can hold unreviewed pull requests: their own cache key, never saved, not the release runner

  sign:
    needs: [pick, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The key's only job: main's sign_release.sh hashes the archives and signs with the runner's OpenSSL.
    environment: ${{ needs.pick.outputs.dry_run != 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: horizon-*
          merge-multiple: true
      - name: Sign the checksums for the nightly channel (SHA256SUMS.sig) and for this build (SHA256SUMS.v2.sig)
        # SHA256SUMS.sig is for launchers from before v2 (signed for "nightly"); SHA256SUMS.v2.sig is signed for
        # nightly-<date>-<commit>, the version the release title names, which current launchers and servers
        # require (docs/security.md, "Nightly signatures"). The publish step titles the release from the same values.
        env:
          RELEASE_SIGNING_KEY: ${{ needs.pick.outputs.dry_run != 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ needs.pick.outputs.dry_run != 'true' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
          EPHEMERAL: ${{ needs.pick.outputs.dry_run == 'true' && 'yes' || '' }}
          # The channel (nightly or snapshot) and the build's version on it: sign_release.sh refuses a mismatch.
          KIND: ${{ inputs.kind }}
          ALSO_FOR: ${{ inputs.kind }}-${{ needs.pick.outputs.date }}-${{ needs.pick.outputs.short }}
        run: |
          # Windows ARM64's build may fail without holding the Nightly (game-build.yml): then it is left out.
          arm64=(); if [[ -f dist/horizon-windows-arm64.zip ]]; then arm64=(dist/horizon-windows-arm64.zip)
          else echo "::warning::horizon-windows-arm64.zip is missing: SHA256SUMS goes out without it"; fi
          musl=(); if [[ -f dist/horizon-linux-musl-x86_64.tar.gz ]]; then musl=(dist/horizon-linux-musl-x86_64.tar.gz)
          else echo "::warning::horizon-linux-musl-x86_64.tar.gz is missing: SHA256SUMS goes out without it"; fi
          # The fork's Nightly carries its SDK's index (the pick job fetched it); upstream's has no SDK.
          # A snapshot's dry run of a commit whose SDK is not published yet has none (nightly.py pick_snapshot warns).
          sdk=(); if [[ "$GITHUB_REPOSITORY" == arismoko/horizon && ( "$KIND" == nightly || -f dist/sdk.json ) ]]; then sdk=(dist/sdk.json); fi
          bash tools/ci/sign_release.sh "$KIND" dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip \
            ${arm64[@]+"${arm64[@]}"} ${musl[@]+"${musl[@]}"} ${sdk[@]+"${sdk[@]}"} \
            dist/horizon-macos-arm64.zip dist/horizon-macos-x64.zip dist/horizon-server-linux-x86_64.tar.gz \
            dist/horizon-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: needs.pick.outputs.dry_run == 'true'
        with:
          name: ephemeral.pub
          path: dist/ephemeral.pub
          retention-days: 3

  publish:
    needs: [pick, build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read          # the open release-blocker issues (gate)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The signatures, checked as launchers check them
        env:
          EPHEMERAL: ${{ needs.pick.outputs.dry_run == 'true' && 'yes' || '' }}
          DATE: ${{ needs.pick.outputs.date }}
          SHORT: ${{ needs.pick.outputs.short }}
          KIND: ${{ inputs.kind }}
        run: |
          key=(); [[ -n "$EPHEMERAL" ]] && key=(--key "$(cat dist/ephemeral.pub)")
          cargo run --locked --quiet -p horizon-release-sign -- verify --repository "$GITHUB_REPOSITORY" --tag "$KIND" --publishing "${key[@]}" dist
          # The version's own signature, which current launchers require: the title below names the same version.
          cargo run --locked --quiet -p horizon-release-sign -- verify --repository "$GITHUB_REPOSITORY" --tag "${KIND}-${DATE}-${SHORT}" \
            --signature SHA256SUMS.v2.sig --publishing "${key[@]}" dist
      - name: Ready to publish (the smoke test drew a world, no release-blocker is open)
        # Right before publishing, as for a release: an issue labelled while the builds ran still holds it. A dry run
        # only reports what a real run would do (that is how a blocker's fix is tried).
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.pick.outputs.dry_run }}
          # A release-blocker holds the Nightly players get, not a snapshot built to test main.
          BLOCKERS: ${{ inputs.kind == 'nightly' && 'yes' || '' }}
        run: |
          if ! python3 tools/release_train.py gate --kind game --smoke dist/smoke-test.json ${BLOCKERS:+--blockers}; then
            # The fork uses a dry run as release-readiness evidence: a missing/failed smoke
            # report must fail it, not produce a misleading green workflow.
            [[ "$DRY_RUN" == true && "$GITHUB_REPOSITORY" != arismoko/horizon ]] || { echo "::error::Nothing published"; exit 1; }
            echo "::warning::A real run would publish nothing"
          fi
      - name: Publish as the `nightly` pre-release
        if: needs.pick.outputs.dry_run != 'true' && inputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          SHORT: ${{ needs.pick.outputs.short }}
          DATE: ${{ needs.pick.outputs.date }}
          SOURCE_TAG: ${{ needs.pick.outputs.source_tag }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py require-sdk "$SHA"
          python3 tools/ci/nightly.py rotate
          signature=(); [[ -f dist/SHA256SUMS.sig ]] && signature=(dist/SHA256SUMS.sig)
          [[ -f dist/SHA256SUMS.v2.sig ]] && signature+=(dist/SHA256SUMS.v2.sig)
          # The title is what launchers parse (strictly) into the version SHA256SUMS.v2.sig is signed for.
          [[ "${SHA:0:7}" == "$SHORT" ]] || { echo "::error::the build's commit isn't the one signed"; exit 1; }
          # The ARM64 archive only when its build succeeded (the sign job left it out of SHA256SUMS otherwise).
          arm64=()
          if [[ -f dist/horizon-windows-arm64.zip ]]; then
            arm64=("dist/horizon-windows-arm64.zip#Game files the launcher installs (Nightly): Windows ARM64 (horizon-windows-arm64.zip)")
          else
            echo "::warning::horizon-windows-arm64.zip is missing: the Nightly goes out without it (ARM64 launchers install the x64 build)"
          fi
          sdk=(); if [[ "$GITHUB_REPOSITORY" == arismoko/horizon ]]; then sdk=("dist/sdk.json#The mod SDK of this build (sdk.json; its files are the release sdk-$SHA)"); fi
          musl=()
          if [[ -f dist/horizon-linux-musl-x86_64.tar.gz ]]; then
            musl=("dist/horizon-linux-musl-x86_64.tar.gz#Game files for musl Linux (horizon-linux-musl-x86_64.tar.gz)")
          else
            echo "::warning::horizon-linux-musl-x86_64.tar.gz is missing: the Nightly goes out without it"
          fi
          # A pre-release, never GitHub's latest: the latest stays the last vX.Y.Z, which launchers and servers from
          # before the Nightly-only switch keep (they don't read Nightlies).
          python3 tools/ci/nightly.py require-sdk "$SHA"
          gh release create nightly --prerelease --latest=false --target "$SHA" \
            --title "Nightly $DATE · ${SHA:0:7}" --notes-file dist/nightly-notes.md \
            "dist/horizon-linux-x86_64.tar.gz#Game files the launcher installs (Nightly): Linux (horizon-linux-x86_64.tar.gz)" \
            ${musl[@]+"${musl[@]}"} \
            "dist/horizon-windows-x64.zip#Game files the launcher installs (Nightly): Windows (horizon-windows-x64.zip)" \
            ${arm64[@]+"${arm64[@]}"} ${sdk[@]+"${sdk[@]}"} \
            "dist/horizon-macos-arm64.zip#Game files the launcher installs (Nightly): macOS on Apple Silicon (horizon-macos-arm64.zip)" \
            "dist/horizon-macos-x64.zip#Game files the launcher installs (Nightly): macOS on Intel (horizon-macos-x64.zip)" \
            "dist/horizon-server-linux-x86_64.tar.gz#Nightly dedicated server for Linux (horizon-server-linux-x86_64.tar.gz)" \
            "dist/horizon-source.tar.gz#Source of this Nightly, commit ${SHA:0:7} (horizon-source.tar.gz; kept for good as the tag $SOURCE_TAG)" \
            dist/SHA256SUMS "${signature[@]}" dist/smoke-test.json
          python3 tools/ci/nightly.py keep-source "$SHA" "$DATE"
          python3 tools/ci/nightly.py prune --days 7
      - name: Publish as the snapshot-<date>-<short> pre-release
        if: needs.pick.outputs.dry_run != 'true' && inputs.kind == 'snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          SHORT: ${{ needs.pick.outputs.short }}
          DATE: ${{ needs.pick.outputs.date }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py require-sdk "$SHA"
          # The title is what launchers parse (strictly) into the version SHA256SUMS.v2.sig is signed for: the tag.
          [[ "${SHA:0:7}" == "$SHORT" && "$TAG" == "snapshot-$DATE-$SHORT" ]] || { echo "::error::the build's commit isn't the one signed"; exit 1; }
          # Exactly the files SHA256SUMS lists (the sign job left out a missing optional archive), and the signatures.
          files=(); while read -r _ name; do files+=("dist/${name#\*}"); done < dist/SHA256SUMS
          # A pre-release, never GitHub's latest, under its own tag: no launcher lists or updates to it.
          gh release create "$TAG" --prerelease --latest=false --target "$SHA" \
            --title "Snapshot $DATE · $SHORT" --notes-file dist/nightly-notes.md \
            "${files[@]}" dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.v2.sig dist/smoke-test.json
          python3 tools/ci/nightly.py prune-snapshots --days 7
      - name: Dry run, the nightly that would be published
        if: needs.pick.outputs.dry_run == 'true'
        run: |
          echo "Would publish ${{ inputs.kind == 'snapshot' && needs.pick.outputs.tag || 'nightly' }} at ${{ needs.pick.outputs.sha }} (${{ needs.pick.outputs.source }})"
          ls -l dist

  cleanup-dry-run:
    # No consumer needs the temporary checkout ref after build/sign/publish finish.
    # Derive it independently of pick's outputs: pick may fail after pushing it.
    needs: [pick, build, sign, publish]
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove this dry run's temporary checkout ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run failed jobs increments the attempt without rerunning a successful pick.
          # Earlier attempts of this same run have no remaining consumers either.
          for ((attempt=1; attempt<=GITHUB_RUN_ATTEMPT; attempt++)); do
            ref="nightly/dry-run-${GITHUB_RUN_ID}-${attempt}"
            status=$(curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --output "$RUNNER_TEMP/dry-ref-cleanup.json" --write-out '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/$ref")
            case "$status" in
              204|404) echo "Temporary ref $ref removed or already absent" ;;
              *) echo "Temporary ref cleanup failed: HTTP $status"; exit 1 ;;
            esac
          done

  answer:
    # Tells the thread that asked for this build how it ended. A conflict `pick` already explained there.
    needs: [pick, build, sign, publish]
    if: always() && inputs.issue != '' && needs.pick.result == 'success'
    # One comment, no checkout and no secret: one of our small runners (label horizon-light, docs/ci-runners.md).
    runs-on: ${{ (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_BOOKKEEPING_RUNNER && fromJSON(vars.NIGHTLY_BOOKKEEPING_RUNNER)) || (vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]')) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BUILD: ${{ needs.pick.outputs.build }}
          PUBLISHED: ${{ needs.publish.result }}
          DRY_RUN: ${{ needs.pick.outputs.dry_run }}
          NAME: Nightly ${{ needs.pick.outputs.date }} · ${{ needs.pick.outputs.short }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$BUILD" != true ]]; then
            text="nothing new: the published Nightly is already this build."
          elif [[ "$PUBLISHED" == success && "$DRY_RUN" == true ]]; then
            text="the dry run built and signed $NAME; nothing was published. $RUN"
          elif [[ "$PUBLISHED" == success ]]; then
            text="published $NAME: https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly. Launchers install it at their next check."
          else
            text="the build failed, nothing was published: $RUN"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="🤖 Nightly: $text"
